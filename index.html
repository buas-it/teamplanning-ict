.person-row.alt { background:rgba(255,255,255,0.015); }
.cell-wrap { position:relative; }
.cell { height:34px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap; padding:2px; transition:all 0.12s; user-select:none; position:relative; overflow:hidden; }

.cross::after  { transform:translate(-50%,-50%) rotate(-45deg); }

.half-circle-right { width:13px; height:13px; border-radius:50%; border:1.5px solid #e53935; background:linear-gradient(to left,#e53935 50%,transparent 50%); flex-shrink:0; }

async function groupsMutate(mutator, message){
  for(let i=0;i<4;i++){
    const cur = await groupsFetch();

    if(refuse) return { error: refuse };
    const body = { message, content: encodeBase64(JSON.stringify({ v: 1, groups: cur.groups }, null, 1)), branch: GH_BRANCH };
    if(cur.sha) body.sha = cur.sha;
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GROUPS_PATH}`, { method: "PUT", headers: {"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body: JSON.stringify(body) });
    if(r.ok){
      let sha = null; try{ const d = await r.json(); sha = (d && d.content && d.content.sha) || null; }catch(e){}
      applyGroups(cur.groups); groupsSha = sha; groupsReady = true; groupsError = null;
      try{ showLockIndicator(); }catch(e){}
      return { ok: true, groups: cur.groups };
    }
    if(r.status !== 409 && r.status !== 422) throw new Error("HTTP " + r.status);
  }

}

  });
  let changes, n;
  if(tpl.length && !hinted){ changes = [...team, ...tpl, {s:"doorgevoerd", n:cells.length}]; n = team.length + tpl.length; }   // standaardrooster: afgeleide cellen alleen tellen
  else { changes = [...team, ...tpl, ...cells]; n = team.length + tpl.length + cells.length; }
  return { n, trunc: changes.length > AUDIT_MAX_CHANGES, changes: changes.slice(0, AUDIT_MAX_CHANGES),
           action: tpl.length ? "standaard" : (team.length && !cells.length ? "team" : "wijziging") };
}

// Na elke geslaagde opslag: wat is er veranderd, door wie, vanaf welke machine
function auditAfterSave(snap){
  try{
    const base = auditBase;
    auditBase = snap;
    if(!base) return;
    const hint = (auditHint && Date.now() - auditHint.t < 60000) ? auditHint.text : null;
    auditHint = null;
    const diff = auditDiff(base, snap, !!hint);
    if(!diff.n) return;
    const who = auditWho || currentIdentity || null;
    auditQueue.push({
      v:1, eid: auditEid(), t: new Date().toISOString(),
      user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "",
      action: hint || diff.action, n: diff.n, trunc: diff.trunc, changes: diff.changes
    });
    auditPushed++;
    auditWho = null;
    auditPersist();
    auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

// Regels toevoegen aan audit/<dag>.jsonl (lezen, toevoegen, schrijven; bij conflict opnieuw)
async function auditAppend(day, entries){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/audit/${day}.jsonl`;
  const hdr = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
  for(let attempt=0; attempt<4; attempt++){
    let sha, text = "";
    const g = await fetch(url + `?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers: hdr});
    if(g.status === 200){ const d = await g.json(); sha = d.sha; text = auditDecode(d.content); }
    else if(g.status !== 404){ return false; }
    const have = new Set();
    text.split("\n").forEach(l=>{ if(!l.trim()) return; try{ have.add(JSON.parse(l).eid); }catch(e){} });
    let add = entries.filter(e=>!have.has(e.eid));
    // iemand zonder naam kan het logboek niet vullen: hooguit 3 regels 'niet ingelogd' per 10 minuten in het hele logboek (de rest wordt weggelaten)
    let ruimte = 3 - text.split("\n").filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } }).filter(e=>e && e.anon && Date.now() - Date.parse(e.t) < 10 * 60 * 1000).length;
    add = add.filter(e=>{ if(!e.anon) return true; if(ruimte > 0){ ruimte--; return true; } return false; });
    if(!add.length) return true;
    const newText = text + (text && !text.endsWith("\n") ? "\n" : "") + add.map(e=>JSON.stringify(e)).join("\n") + "\n";
    const body = {message: commitMessage("Audit " + day), content: encodeBase64(newText), branch: GH_BRANCH};
    if(sha) body.sha = sha;
    const p = await ghWriteFetch(url, {method:"PUT", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify(body)});
    if(p.ok) return true;
    if(p.status === 409 || p.status === 422) continue;   // iemand was ons voor: opnieuw lezen en nogmaals proberen
    return false;
  }
  return false;
}

async function auditFlush(){
  if(auditFlushing || !auditQueue.length){ updateAuditDot(); return; }
  auditFlushing = true; updateAuditDot();
  try{
    let guard = 0;
    while(auditQueue.length && guard++ < 10){
      const day = auditQueue[0].t.slice(0,10);
      const batch = auditQueue.filter(e=>e.t.slice(0,10) === day);
      const ok = await auditAppend(day, batch);
      auditLastOk = ok;
      if(!ok) break;
      const done = new Set(batch.map(e=>e.eid));
      auditQueue = auditQueue.filter(e=>!done.has(e.eid));
      auditPersist();
    }
  }catch(e){ auditLastOk = false; console.warn("audit flush fout:", e); }
  finally{ auditFlushing = false; updateAuditDot(); }
}

function updateAuditDot(){
  const el = document.getElementById("health-audit"); if(!el) return;
  const n = auditQueue.length;
  let col, title;
  if(auditLastOk === false){ col = "#e53935"; title = "Audit: uploaden mislukt, " + n + " regel" + (n!==1?"s":"") + " in wachtrij (wordt opnieuw geprobeerd)"; }
  else if(n > 0){ col = "#ffb74d"; title = "Audit: " + n + " in wachtrij"; }
  else if(auditLastOk === true){ col = "#4caf50"; title = "Audit: bijgewerkt (klik voor het logboek)"; }
  else { col = "rgba(255,255,255,0.2)"; title = "Audit: nog niets gelogd in deze sessie (klik voor het logboek)"; }
  const admin = canSeeAdmin();
  if(!admin) title = title.replace(" (klik voor het logboek)", "");
  el.style.color = col; el.title = title; el.style.cursor = admin ? "pointer" : "default";
  if(!el._clickSet){ el._clickSet = true; el.onclick = ()=>{ if(canSeeAdmin()) showAuditModal(); }; }
}

function b64e(u8){ let s = ""; for(let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function b64d(s){ const bin = atob(s), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
async function adminDerive(pw, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations: iter}, key, 256));
}

async function hashPassword(pw){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ── Persoonlijke wachtwoorden: per naam een salt + PBKDF2-hash in users.json op de data-branch ──
const USER_ITER = 210000, USERS_PATH = "users.json", PW_MIN = 10;
const EXTRA_LOGINS = ["Monitor"];   // mogen inloggen maar zijn geen teamlid: geen rij in de planning, niet in Systeembeheer of Support
const loginNames = () => TEAM.filter(n=>n!=="__divider__").concat(EXTRA_LOGINS.filter(n=>!TEAM.includes(n)));
async function usersLoad(){
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
  if(r.status === 404) return { users: {}, sha: null };       // nog nooit iemand een eigen wachtwoord ingesteld
  if(!r.ok) throw new Error("HTTP " + r.status);              // bij twijfel NIET terugvallen op het startwachtwoord
  const d = await r.json();
  const parsed = JSON.parse(auditDecode(d.content));
  return { users: (parsed && typeof parsed.users === "object" && parsed.users) || {}, sha: d.sha };
}
// Lezen, wijzigen, schrijven; bij een schrijfconflict opnieuw. mutator(users) wijzigt de lijst en geeft een tekst terug om te weigeren.
async function usersMutate(mutator, message){
  for(let i=0;i<4;i++){
    const cur = await usersLoad();
    const refuse = mutator(cur.users);
    if(refuse) return { error: refuse };
    const body = { message, content: encodeBase64(JSON.stringify({ v: 1, users: cur.users }, null, 1)), branch: GH_BRANCH };
    if(cur.sha) body.sha = cur.sha;
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}`, { method: "PUT", headers: {"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body: JSON.stringify(body) });
    if(r.ok) return { ok: true };
    if(r.status !== 409 && r.status !== 422) throw new Error("HTTP " + r.status);
  }
  throw new Error("conflict");
}
async function verifyUserPw(pw, rec){
  const got = await adminDerive(pw, b64d(rec.salt), rec.iter), want = b64d(rec.hash);
  let diff = got.length ^ want.length; for(let i=0;i<Math.min(got.length, want.length);i++) diff |= got[i] ^ want[i];
  return diff === 0;
}
async function newUserRecord(pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { salt: b64e(salt), hash: b64e(await adminDerive(pw, salt, USER_ITER)), iter: USER_ITER, set: new Date().toISOString() };
}
function pwProblem(p1, p2){ if(p1.length < PW_MIN) return "Minimaal " + PW_MIN + " tekens"; if(p1 !== p2) return "De wachtwoorden komen niet overeen"; return null; }
// Gebeurtenis zonder celwijziging (wachtwoord ingesteld/gewijzigd/gereset) in het logboek zetten
function auditEvent(action, opts){
  try{
    let who = currentIdentity; const anon = !!(opts && opts.anon);
    if(!who && anon) who = makeIdentity("(niet ingelogd)", guessWorkstation(), machineText(machineBase()));   // iemand bij de poort: wel apparaat en browser, geen naam
    auditQueue.push({ v: 1, eid: auditEid(), t: new Date().toISOString(), user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "", action, n: 0, trunc: false, changes: [], ...(anon ? { anon: true } : {}) });
    auditPushed++;
    auditPersist(); auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

async function loadFromGitHub(usePrefetch=false){
  try{
    // Gebruik prefetch-promise als die nog loopt (eerste load), anders nieuw verzoek
    const r = await (usePrefetch ? _prefetchState : fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
    ));
    if(!r.ok){ console.warn("GitHub laden HTTP:", r.status); return false; }
    const d = await r.json();
    ghSha = d.sha;
    const text = atob(d.content.replace(/\n/g,""));
    const data = JSON.parse(text);
    if(data && data.store && data.team && data.team.length > 0){
      HEALTH.github = "ok"; HEALTH.data = "ok";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      applyState(data); auditRebase(); return true;
    } else {
      HEALTH.github = "ok"; HEALTH.data = "error";
      updateHealthBar();
      console.warn("GitHub: state leeg of ongeldig, wordt genegeerd");
    }
  }catch(e){
    HEALTH.github = "error";
    updateHealthBar();
    console.warn("GitHub laden mislukt:", e);
  }
  return false;
}

// Helper: encode JSON naar base64 (unicode-safe)
function encodeBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

// Helper: PUT een bestand naar GitHub (maakt aan of overschrijft)
async function ghPut(path, content, message){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
  let sha = undefined;
  try{
    const r = await fetch(url + `?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(r.ok){ const d = await r.json(); sha = d.sha; }
  }catch(e){}
  const body = {message, content, branch: GH_BRANCH, ...(sha ? {sha} : {})};
  return ghWriteFetch(url, {method:"PUT", headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body:JSON.stringify(body)});
}

// Backup elke 10 minuten na een wijziging (maximaal 14 dagen bewaard)
let lastBackupJson = null;   // staat bij de laatste GESLAAGDE backup
let lastBackupTime = 0;      // tijdstip van de laatste geslaagde backup
let backupBusy = false;      // er loopt een backup (die zichzelf herhaalt bij een conflict)
let backupPending = null;    // de laatste poging is mislukt: elke minuut opnieuw proberen tot het lukt
const BACKUP_INTERVAL = 10 * 60 * 1000; // 10 minuten
const BACKUP_RETRY_STATUS = [409, 422, 500, 502, 503, 504];   // conflict of storing: opnieuw; een andere fout (bijv. geen rechten) niet blijven proberen

async function maybeBackup(stateJson, opts = {}){
  // opts.force: de 10-minutenregel overslaan; opts.always: ook als er niets is gewijzigd (handmatig); opts.label/who: commitbericht; opts.attempts: aantal pogingen
  const now = Date.now();
  if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                     // niets gewijzigd sinds de laatste geslaagde backup
  if(!opts.force && !opts.always && now - lastBackupTime < BACKUP_INTERVAL && !backupPending) return null;   // nog geen 10 min (een mislukte backup wacht daar niet op)
  if(backupBusy){
    if(!opts.force && !opts.always){ backupPending = stateJson; return null; }                       // er loopt er al een
    for(let i = 0; i < 150 && backupBusy; i++) await new Promise(r=>setTimeout(r, 200));              // een gevraagde backup wacht op de lopende
    if(backupBusy){ backupPending = stateJson; return null; }
    if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                   // de lopende backup bevatte al precies deze staat
  }
  backupBusy = true;
  const now_dt = new Date();
  const date = now_dt.toISOString().slice(0,10);
  const time = now_dt.toTimeString().slice(0,5).replace(":","-");
  const filename = `${date}_${time}`;
  const content = encodeBase64(stateJson);
  const message = opts.label ? `${opts.label} ${filename}${opts.who || ""}` : `Auto-backup ${filename}`;
  let res = null;
  try{
    for(let poging = 0; poging < (opts.attempts || 4); poging++){   // GitHub weigert schrijfacties die tegelijk binnenkomen (409): even wachten en nogmaals
      if(poging) await new Promise(r=>setTimeout(r, 1500 * poging + Math.random() * 1000));
      res = await ghPut(`backups/${filename}.json`, content, message).catch(()=>null);
      if(res && res.ok) break;
      if(res && !BACKUP_RETRY_STATUS.includes(res.status)) break;
    }
    if(res && res.ok){
      lastBackupJson = stateJson; lastBackupTime = Date.now(); backupPending = null;
      HEALTH.lastBackup = lastBackupTime; HEALTH.lastBackupOk = true; HEALTH.lastBackupErr = null;
      HEALTH.lastBackupLabel = now_dt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+
                               now_dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    } else {
      backupPending = stateJson;   // niet als gedaan markeren: de volgende minuut opnieuw
      HEALTH.lastBackupOk = false; HEALTH.lastBackupErr = res ? "HTTP " + res.status : "geen verbinding";
    }
  }finally{ backupBusy = false; }
  updateHealthBar();
  const result = (res && res.ok) ? { ok: true, filename } : { ok: false, err: HEALTH.lastBackupErr };
  if(!result.ok) return result;
  // Verwijder backups ouder dan 14 dagen: op de achtergrond, hooguit 5 per keer (zodat het opslaan niet wordt opgehouden) en netjes achter elkaar
  try{
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14);
    const cut = cutoff.toISOString().slice(0,10);
    const listR = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(listR.ok){
      const files = await listR.json();
      files.filter(f=>f.name.replace(".json","").slice(0,10) < cut).slice(0, 5).forEach(f=>{
        const d = f.name.replace(".json","").slice(0,10); // YYYY-MM-DD prefix
        ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${f.name}`, {
          method:"DELETE",
          headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
          body: JSON.stringify({message:`Verwijder oude backup ${d}`, sha: f.sha, branch: GH_BRANCH})
        }).catch(()=>{});
      });
    }
  }catch(e){}
  return result;
}

    if(r.ok){ const d = await r.json(); if(d && d.content){ const txt = auditDecode(d.content); JSON.parse(txt); json = txt; } }
  }catch(e){}

async function saveToGitHub(){
  if(ghSaving) return;
  ghSaving = true; savePending = false;
  try{
    // Haal altijd eerst de actuele SHA op om conflicts te voorkomen
    const check = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2), {
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}
    });
    if(check.ok){ const cd = await check.json(); ghSha = cd.sha; }

    const json = JSON.stringify(serializeState());
    const content = encodeBase64(json);

    const body = {message:commitMessage("Update planning"), content, sha: ghSha, branch: GH_BRANCH};
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      method:"PUT",
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify(body)
    });
    if(r.ok){
      const d = await r.json();
      ghSha = d.content.sha;
      HEALTH.github = "ok"; HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      showSaveStatus("ok");
      // Prefetch SHA alvast voor volgende save (tijdens rustige periode)
      setTimeout(async ()=>{
        if(!ghSaving){
          try{
            const pre = await fetch(
              `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
              {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
            );
            if(pre.ok){ const pd = await pre.json(); ghSha = pd.sha; }
          }catch(e){}
        }
      }, 2000);
      // Backup (silent, na succesvolle save)
      lastSavedJson = json; saveOkCount++;
      maybeBackup(json);
      auditAfterSave(JSON.parse(json));   // audit: wat is er veranderd, door wie
    } else {
      const err = await r.json().catch(()=>({}));
      const msg = err.message || err.errors?.[0]?.message || r.status;
      console.error("GitHub opslaan mislukt:", r.status, msg);
      HEALTH.github = r.status === 401 || r.status === 403 ? "error" : "warn";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = false;
      updateHealthBar();
      // Bij 409 conflict: SHA ophalen en opnieuw proberen
      if(r.status === 409){
        console.warn("SHA conflict, opnieuw proberen...");
        ghSha = null; savePending = true;
        ghSaveTimer = setTimeout(saveToGitHub, 2000);
      } else {
        showSaveStatus("error: "+msg);
      }
    }
  }catch(e){
    console.warn("GitHub opslaan fout:", e);
    showSaveStatus("error");
  } finally {
    ghSaving = false;
  }
}

const store = {};

function weekKey(monday){ return `${monday.getFullYear()}-W${String(getWeekNumber(monday)).padStart(2,"0")}`; }
function getMondayFromKey(key){
  // key = "2026-W29" → find the monday of that ISO week
  const [yr, wStr] = key.split("-W");
  const year = parseInt(yr), week = parseInt(wStr);
  // Jan 4 is always in week 1
  const jan4 = new Date(year, 0, 4);
  const jan4Dow = jan4.getDay()||7;
  const week1Mon = new Date(jan4.getTime() - (jan4Dow-1)*86400000);
  return new Date(week1Mon.getTime() + (week-1)*7*86400000);
}
function weekMondayFromKey(k){ const [yr,wPart]=k.split("-W"); const wk=parseInt(wPart); const jan1=new Date(parseInt(yr),0,1); const j=jan1.getDay()||7; const m=new Date(jan1); m.setDate(jan1.getDate()+(wk-1)*7-(j-1)); return m; }

function getData(monday){
  const k=weekKey(monday);
  if(!store[k]) store[k]=cloneTemplate();

      store[k][p]={};
      DAYS.forEach(d=>{ store[k][p][d]=[...(template[p][d]||[])]; });
    }
  });
  return store[k];
}

}

    pushTemplateCell(person,day);
    saveState();
    const _p=person,_d=day;
    render();
    requestAnimationFrame(()=>{
      syncNameSpacer();
      if(document.getElementById("tpl-modal").style.display!=="none"){
        buildTemplateGrid();
        const newCell=document.getElementById(cellId("TPL",_p,_d));
        if(newCell) showPopup(newCell.parentElement,null,_p,_d,true);
      }
    });
  } else {
    const k=weekKey(monday);
    if(!manuallyEdited[k]) manuallyEdited[k]=new Set();
    manuallyEdited[k].add(person+"-"+day);
    const data=getData(monday);
    if(!data[person]) data[person]={};
    const cur=data[person][day]||[];
    // Multiselect met constraints:
    // - vrij sluit vm_vrij en nm_vrij uit (en andersom)
    let next;
    if(cur.includes(key)){
      next=cur.filter(k2=>k2!==key); // uitzetten
    } else {
      // ── Constraints ──────────────────────────────────────────────────
      const HELE_DAG  = ["kantoor","thuis","vrij","ziek","ziek_thuis","extern"];
      const HALVE_VM  = ["vm_kantoor","vm_thuis","vm_vrij","vm_extern"];
      const HALVE_NM  = ["nm_kantoor","nm_thuis","nm_vrij","nm_extern"];
      const HALVE_DAG = [...HALVE_VM,...HALVE_NM];

      // 1. Hele-dag status: verwijdert ALLE andere hele-dag én alle halve-dag
      if(HELE_DAG.includes(key)){
        next = [key];
      }
      // 2. Halve-dag: verwijder alle hele-dag statussen
      else {
        next = [...cur, key].filter(k2=>!HELE_DAG.includes(k2));
        // Verwijder dubbele
        next = [...new Set(next)];
        // Ochtend: slechts één ochtend-status tegelijk
        if(HALVE_VM.includes(key)) next = next.filter(k2=>!HALVE_VM.includes(k2)||k2===key);
        // Middag: slechts één middag-status tegelijk
        if(HALVE_NM.includes(key)) next = next.filter(k2=>!HALVE_NM.includes(k2)||k2===key);
        // vm+nm van zelfde soort → hele dag
        if(next.includes("vm_kantoor")&&next.includes("nm_kantoor")){ next=["kantoor"]; }
        else if(next.includes("vm_thuis")&&next.includes("nm_thuis")){ next=["thuis"]; }
        // extern halve dag sluit andere dagdeel vm/nm extern uit
        if(key==="vm_extern") next=next.filter(k2=>k2!=="nm_extern");
        if(key==="nm_extern") next=next.filter(k2=>k2!=="vm_extern");
      }
    }
    data[person][day]=next;
    saveState();
  }
}

const RUNNING_VERSION = ((document.getElementById("app-version") || {}).textContent || "").trim();

function safeToReload(){   // ververs nooit midden in iets: bewerken, opslaan, een open venster, iets ingetypt, het menu of net nog bezig
  if(editUnlocked || ghSaving || savePending || backupBusy || auditFlushing) return false;

async function checkForNewVersion(){
  try{
    if(location.protocol === "file:" || !RUNNING_VERSION) return;
    const r = await fetch("index.html?v=" + Date.now() + "&r=" + Math.random().toString(36).slice(2), { cache: "no-store" });
    if(!r.ok) return;
    const m = (await r.text()).match(/id="app-version"[^>]*>\s*(versie [^<]+?)\s*</);
    if(!m) return;
    const banner = document.getElementById("update-banner");
    if(m[1].trim() === RUNNING_VERSION){ if(banner) banner.remove(); return; }
    if(safeToReload()) reloadNow(); else showUpdateBanner();   // niet veilig: een melding met een knop; zodra het kan gaat het vanzelf
  }catch(e){}
}

// Laad staat: GitHub heeft prioriteit, dan localStorage, dan data-store tag
(async ()=>{
  // Verberg grid tot state geladen is (voorkomt flikkering met oude namen)
  const mainGrid = document.getElementById("main-grid");
  if(mainGrid) mainGrid.style.visibility = "hidden";
  const ghLoaded = await loadFromGitHub(true); // gebruik prefetch
  if(!ghLoaded){
    // Geen localStorage fallback — GitHub is de enige bron van waarheid
    // Verwijder eventuele oude localStorage data
    try{
      const keep = {};
      ["tp_device","tp_ws","tp_audit_queue","tp_last_user","tp_unlocked","tp_user"].forEach(k=>{ const v = localStorage.getItem(k); if(v !== null) keep[k] = v; });
      localStorage.clear();
      Object.keys(keep).forEach(k=>localStorage.setItem(k, keep[k]));
    }catch(e){}
  }
  firstLoadSettled = true; document.dispatchEvent(new CustomEvent("tp-team-changed"));   // eerste laadpoging klaar: het inlogvenster mag de namen tonen
  TEAM = TEAM.filter(p => p !== "__divider__");
  propagateTemplateToAll();
  renderAndSync();
  auditRebase();                 // audit: automatische doorvoering van het standaardrooster bij laden telt niet als gebruikerswijziging
  if(ghLoaded) auditFlush();     // eventuele eerder niet-geüploade regels alsnog wegschrijven
  // Toon grid nu state geladen is
  if(mainGrid) mainGrid.style.visibility = "visible";
  // Achtergrond-sync: herlaad van GitHub elke 60 seconden, en meteen als je terugkomt op het tabblad of in de app (timers staan stil zolang een tabblad op de achtergrond staat of de telefoon slaapt)
  let syncBusy = false, lastSyncRun = 0;
  async function backgroundSync(){
    if(syncBusy) return; syncBusy = true; lastSyncRun = Date.now();
    try{
      groupsLoad();   // groepen elke minuut verversen
      if(ghSaving || savePending) return;   // er wordt net opgeslagen of er wacht een wijziging: die niet overschrijven
      const beforeJson = JSON.stringify(serializeState());
      const loaded = await loadFromGitHub();
      if(loaded && JSON.stringify(serializeState()) !== beforeJson){
        renderAndSync();
      }
      auditFlush();   // audit: wachtrij opnieuw proberen
      checkForNewVersion();
    }finally{ syncBusy = false; }
  }
  setInterval(backgroundSync, 60000);
  const wake = ()=>{ if(!document.hidden && Date.now() - lastSyncRun > 10000) backgroundSync(); };   // hooguit eens per 10 seconden
  document.addEventListener("visibilitychange", wake); window.addEventListener("focus", wake); window.addEventListener("pageshow", wake); window.addEventListener("online", wake);
  setTimeout(checkForNewVersion, 5000);   // een pagina die uit de cache kwam, is binnen enkele seconden bij
})();

async function showPopup(cellWrap,monday,person,day,isTemplate){
  if(!isTemplate && LOCKED_DAYS.has(weekKey(monday)+"-"+day)) return; // Feestdag
  if(!await requireUnlock()) return;
  closePopup();
  const popup=document.createElement("div"); popup.className="popup";
  const title=document.createElement("div"); title.className="popup-title";
  title.textContent=(isTemplate?"★ Standaard · ":"")+person+" · "+DAY_LABELS[day];
  popup.appendChild(title);
  addWinX(popup, closePopup, "popup-close", { small:true, keepPosition:true });   // alleen een kruis rechtsboven in het venster
  function renderItems(){
    popup.querySelectorAll(".popup-item").forEach(e=>e.remove());
    const sel=isTemplate?(template[person][day]||[]):(getData(monday)[person][day]||[]);
    let lastGroup=null;
    STATUSES.forEach(s=>{
      // Scheidingslijn tussen groepen
      if(s.group!==lastGroup){
        if(lastGroup!==null){
          const div=document.createElement("div");
          div.style.cssText="height:1px;background:rgba(255,255,255,0.1);margin:4px 6px;";
          popup.appendChild(div);
        }
        lastGroup=s.group;
      }
      const active=sel.includes(s.key);
      const item=document.createElement("div"); item.className="popup-item";
      if(active){ item.style.background=s.color+"22"; item.style.border=`1px solid ${s.border}66`; }
      item.innerHTML=`<div class="popup-dot" style="background:${active?s.color:"rgba(255,255,255,0.1)"};${active?`box-shadow:0 0 6px ${s.color}88`:""}"></div><span class="popup-label" style="color:${active?"#fff":"#888"}">${s.label}</span>${active?`<span class="popup-check" style="color:${s.color}">✓</span>`:""}`;
      item.addEventListener("click",e=>{
        e.stopPropagation();
        toggleStatus(monday,person,day,s.key,isTemplate);
        if(!isTemplate){
          const _m=monday,_p=person,_d=day;
          render();
          requestAnimationFrame(()=>{
            syncNameSpacer();
            const newWrap=document.getElementById(cellId(weekKey(_m),_p,_d));
            if(newWrap) showPopup(newWrap.parentElement,_m,_p,_d,false);
          });
        }
      });
      popup.appendChild(item);
    });
  }
  renderItems();
  // Voeg toe aan body zodat position:fixed correct werkt
  document.body.appendChild(popup);
  openPopup={el:popup, wrap:cellWrap};
  // Bereken positie: onder de cel, maar klap omhoog als er te weinig ruimte is
  const rect = cellWrap.getBoundingClientRect();
  const ph = popup.offsetHeight || 260; // schatting voor eerste render
  const spaceBelow = window.innerHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  if(spaceBelow >= ph || spaceBelow >= spaceAbove){
    popup.style.top = (rect.bottom + 6) + "px";
  } else {
    popup.style.top = (rect.top - ph - 6) + "px";
  }
  // Horizontaal: gecentreerd op cel, maar binnen venster houden
  const pw = popup.offsetWidth || 172;
  let left = rect.left + rect.width/2 - pw/2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  popup.style.left = left + "px";
}

// ── Cell rendering ───────────────────────────────────────────────
function cellId(key,person,day){ return `cell-${key}-${person.replace(/\s/g,"_")}-${day}`; }

function renderCellContent(cell,sel){
  const dots=sel.map(k=>STATUS_MAP[k]).filter(Boolean);
  cell.innerHTML="";

  // Leeg
  if(!dots.length){
    cell.style.background="rgba(255,255,255,0.22)"; cell.style.border="1.5px solid rgba(255,255,255,0.30)";
    const e=document.createElement("div"); e.className="cell-empty-dot"; cell.appendChild(e); return;
  }

  const hasKantoor   =dots.some(s=>s.key==="kantoor");
  const hasThuis     =dots.some(s=>s.key==="thuis");
  const hasVmVrij    =dots.some(s=>s.key==="vm_vrij");
  const hasNmVrij    =dots.some(s=>s.key==="nm_vrij");
  const hasVmKantoor =dots.some(s=>s.key==="vm_kantoor");
  const hasNmKantoor =dots.some(s=>s.key==="nm_kantoor");
  const hasVmThuis   =dots.some(s=>s.key==="vm_thuis");
  const hasNmThuis   =dots.some(s=>s.key==="nm_thuis");
  const hasVmExtern  =dots.some(s=>s.key==="vm_extern");
  const hasNmExtern  =dots.some(s=>s.key==="nm_extern");
  const needsSplit   =hasVmVrij||hasNmVrij||hasVmKantoor||hasNmKantoor||hasVmThuis||hasNmThuis||hasVmExtern||hasNmExtern;

  // Hulpfunctie: klein label in de cel
  // side: "left"=linkerhelft, "right"=rechterhelft, "full"=heel vak
  function addLabel(txt, color, side="full"){
    const lbl=document.createElement("span");
    lbl.textContent=txt;
    if(side==="left"){
      lbl.style.cssText=`position:absolute;left:0;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;pointer-events:none;`;
    } else if(side==="right"){
      lbl.style.cssText=`position:absolute;right:0;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;pointer-events:none;`;
    } else {
      lbl.style.cssText=`font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;line-height:1;pointer-events:none;`;
    }
    cell.appendChild(lbl);
  }

  if(needsSplit){
    const leftColor  = hasVmVrij ? "rgba(229,57,53,0.55)" : hasVmKantoor ? "rgba(200,200,200,0.45)" : hasVmThuis ? "rgba(76,175,80,0.55)" : hasVmExtern ? "rgba(255,213,79,0.55)" : "rgba(255,255,255,0.04)";
    const rightColor = hasNmVrij ? "rgba(229,57,53,0.55)" : hasNmKantoor ? "rgba(200,200,200,0.45)" : hasNmThuis ? "rgba(76,175,80,0.55)" : hasNmExtern ? "rgba(255,213,79,0.55)" : "rgba(255,255,255,0.04)";
    const borderColor = (hasVmKantoor||hasNmKantoor) ? "rgba(200,200,200,0.4)" : (hasVmThuis||hasNmThuis) ? "rgba(76,175,80,0.5)" : "rgba(229,57,53,0.45)";
    cell.style.background = `linear-gradient(to right, ${leftColor} 50%, ${rightColor} 50%)`;
    cell.style.border = `1.5px solid ${borderColor}`;
    // Labels in split-cel
    if(hasVmVrij)    addLabel("V","rgba(255,255,255,1)","left");
    if(hasVmKantoor) addLabel("C","rgba(255,255,255,1)","left");
    if(hasVmThuis)   addLabel("T","rgba(255,255,255,1)","left");
    if(hasVmExtern)  addLabel("E","rgba(0,0,0,0.7)","left");
    if(hasNmVrij)    addLabel("V","rgba(255,255,255,1)","right");
    if(hasNmKantoor) addLabel("C","rgba(255,255,255,1)","right");
    if(hasNmThuis)   addLabel("T","rgba(255,255,255,1)","right");
    if(hasNmExtern)  addLabel("E","rgba(0,0,0,0.7)","right");
    // Extra bolletjes voor andere statussen (extern, vrij-heel-dag, etc.)
    const rest=dots.filter(s=>!["vm_vrij","nm_vrij","vm_kantoor","nm_kantoor","vm_thuis","nm_thuis","vm_extern","nm_extern","kantoor","thuis"].includes(s.key));
    rest.forEach(s=>{ cell.appendChild(makeDot(s)); });
  } else {
    // Achtergrond bepalen op basis van dominant (niet-kantoor) status
    const hasVrij=dots.some(s=>s.key==="vrij");
    const hasZiek=dots.some(s=>s.key==="ziek");
    const dominant=dots.find(s=>s.key!=="kantoor")||dots[0];
    cell.style.background=`${dominant.color}22`;
    cell.style.border=`1.5px solid ${dominant.border}66`;

    // Altijd K of T tonen voor kantoor/thuis (hele dag)
    if(hasZiek && dots.length===1){
      // Alleen ziek: lichtgrijs + streepje
      cell.style.background="rgba(150,150,150,0.18)"; cell.style.border="1.5px solid rgba(150,150,150,0.35)";
      addLabel("—","rgba(180,180,180,0.8)","full");
    } else if(dots.length===1 && dots[0].key==="ziek_thuis"){
      // Ziek thuis: grijsgroen + ZT
      cell.style.background="rgba(120,170,120,0.35)"; cell.style.border="1.5px solid rgba(120,170,120,0.5)";
      addLabel("ZT","rgba(225,240,225,0.95)","full");
    } else if(hasVrij && !hasKantoor && !hasThuis && dots.length===1){
      // Alleen vrij: rode achtergrond + V
      cell.style.background="rgba(229,57,53,0.55)"; cell.style.border="1.5px solid rgba(229,57,53,0.5)";
      addLabel("V","rgba(255,255,255,1)","full");
    } else if(hasKantoor && !hasThuis){
      // Alleen kantoor: zelfde grijs als halve-dag kantoor
      cell.style.background="rgba(180,180,180,0.6)"; cell.style.border="1.5px solid rgba(180,180,180,0.5)";
      addLabel("C","rgba(255,255,255,1)","full");
      // Extra bolletjes voor andere statussen
      dots.filter(s=>s.key!=="kantoor").forEach(s=>{ cell.appendChild(makeDot(s)); });
    } else if(hasThuis && !hasKantoor){
      // Alleen thuis: groene achtergrond + T
      cell.style.background="rgba(76,175,80,0.55)"; cell.style.border="1.5px solid rgba(76,175,80,0.5)";
      addLabel("T","rgba(255,255,255,1)","full");
      dots.filter(s=>s.key!=="thuis").forEach(s=>{ cell.appendChild(makeDot(s)); });
    } else if(dots.length===1 && dots[0].key==="extern"){
      // Alleen extern: gele achtergrond + zwarte E
      cell.style.background="rgba(255,213,79,0.75)"; cell.style.border="1.5px solid rgba(255,213,79,0.6)";
      addLabel("E","rgba(0,0,0,0.7)","full");
    } else {
      // Overige combinaties: gewone bolletjes
      dots.forEach(s=>{ cell.appendChild(makeDot(s)); });
    }
  }
}

function makeDot(s){
  const d=document.createElement("div"); d.className="dot";
  d.style.background=s.color; d.style.boxShadow=`0 0 6px ${s.color}88`;
  d.style.display="flex"; d.style.alignItems="center"; d.style.justifyContent="center";
  const LABELS={"kantoor":"C","thuis":"T","vrij":"V","ziek":"Z","ziek_thuis":"Z","extern":"E","vm_extern":"E","nm_extern":"E"};
  if(LABELS[s.key]){
    const lbl=document.createElement("span"); lbl.textContent=LABELS[s.key];
    lbl.style.cssText="font-size:12px;font-weight:700;color:rgba(0,0,0,0.45);line-height:1;";
    d.appendChild(lbl);
  }
  return d;
}

function renamePerson(oldName, newName){
  newName = newName.trim();
  if(!newName || newName === oldName || TEAM.includes(newName)) return false;
  const idx = TEAM.indexOf(oldName);
  if(idx === -1) return false;
  const why = teamLockoutReason(TEAM.map(n=>n===oldName ? newName : n), "rename");
  if(why){ alert(why); try{ buildTemplateGrid(); }catch(e){} return false; }   // niet je eigen naam (of die van de laatste beheerder) wijzigen
  TEAM[idx] = newName;
  // Kopieer template data
  template[newName] = template[oldName];
  delete template[oldName];
  // Kopieer store data
  Object.keys(store).forEach(k=>{
    if(store[k][oldName]){ store[k][newName]=store[k][oldName]; delete store[k][oldName]; }
  });
  // Kopieer manuallyEdited
  Object.keys(manuallyEdited).forEach(k=>{
    if(manuallyEdited[k]){
      DAYS.forEach(d=>{
        if(manuallyEdited[k].has(oldName+"-"+d)){
          manuallyEdited[k].delete(oldName+"-"+d);
          manuallyEdited[k].add(newName+"-"+d);
        }
      });
    }
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
  return true;
}

function addPerson(name){
  name = name.trim();
  if(!name || TEAM.includes(name)) return false;
  TEAM.push(name);
  // Voeg toe aan template
  template[name] = {}; DAYS.forEach(d=>{ template[name][d]=["kantoor"]; });
  // Voeg toe aan alle weken in store
  Object.keys(store).forEach(k=>{
    store[k][name] = {}; DAYS.forEach(d=>{ store[k][name][d]=[...(template[name][d]||[])]; });
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
  return true;
}

function removePerson(name){
  const idx = TEAM.indexOf(name);
  if(idx === -1) return;
  const why = teamLockoutReason(TEAM.filter(n=>n!==name), "remove"); if(why){ alert(why); return; }   // niet jezelf of de laatste beheerder uit het team halen
  TEAM.splice(idx, 1);
  delete template[name];
  Object.keys(store).forEach(k=>{ delete store[k][name]; });
  Object.keys(manuallyEdited).forEach(k=>{
    if(manuallyEdited[k]) DAYS.forEach(d=>{ manuallyEdited[k].delete(name+"-"+d); });
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
}

  hdrRow.style.cssText="display:grid;grid-template-columns:130px repeat(5,1fr) 28px;gap:4px;margin-bottom:8px;align-items:center;";
  hdrRow.appendChild(document.createElement("div"));
  DAYS.forEach(day=>{ const d=document.createElement("div"); d.style.cssText="text-align:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:1px;padding:6px 0;"; d.textContent=day; hdrRow.appendChild(d); });

  const addBtn=document.createElement("button");
  addBtn.textContent="+ Toevoegen";
  addBtn.style.cssText="background:rgba(128,203,196,0.15);border:1px solid rgba(128,203,196,0.4);color:#80cbc4;border-radius:6px;padding:6px 12px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;";
  addBtn.onclick=()=>{ if(inp.value.trim()){ const ok=addPerson(inp.value); if(ok) inp.value=""; else inp.style.borderColor="rgba(229,57,53,0.6)"; } };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") addBtn.click(); });
  addRow.appendChild(inp);

  container.appendChild(addRow);
  container.appendChild(hdrRow);
  TEAM.forEach((person,pi)=>{
    const row=document.createElement("div");
    row.style.cssText=`display:grid;grid-template-columns:130px repeat(5,1fr) 28px;gap:4px;margin-bottom:3px;border-radius:6px;align-items:center;background:${pi%2===0?"rgba(255,255,255,0.015)":"transparent"}`;
    const nameCell=document.createElement("div"); nameCell.style.cssText="display:flex;align-items:center;gap:6px;height:34px;padding:0 4px;";
    const dragH = buildDragHandle();
    const avatar = document.createElement("div");
    avatar.style.cssText=`width:24px;height:24px;border-radius:50%;background:${AVATARS[pi]||"#666"};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0`;
    avatar.textContent = person[0];
    const nameSpan = document.createElement("span");
    nameSpan.style.cssText=`font-size:12px;color:${person==="Hans"?"#FF6C00":"#d0d0d0"};font-weight:${person==="Hans"?700:400}`;
    nameSpan.textContent = person;
    const editBtn=document.createElement("button");
    editBtn.textContent="✏";
    editBtn.style.cssText="background:transparent;border:none;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer;padding:0 2px;flex-shrink:0;";
    editBtn.title="Naam wijzigen";
    editBtn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const inp2=document.createElement("input");
      inp2.value=person;
      inp2.style.cssText="font-size:12px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.5);border-radius:4px;color:#fff;padding:2px 6px;width:90px;font-family:inherit;outline:none;";
      nameCell.replaceChild(inp2,nameSpan);
      nameCell.removeChild(editBtn);
      inp2.focus(); inp2.select();
      const save=()=>{ renamePerson(person, inp2.value); };
      inp2.addEventListener("blur",save);
      inp2.addEventListener("keydown",e2=>{
        if(e2.key==="Enter"){ e2.preventDefault(); inp2.blur(); }
        if(e2.key==="Escape"){ inp2.removeEventListener("blur",save); nameCell.replaceChild(nameSpan,inp2); nameCell.appendChild(editBtn); }
      });
    });
    nameCell.appendChild(editBtn); nameCell.appendChild(dragH); nameCell.appendChild(avatar); nameCell.appendChild(nameSpan);
    row.appendChild(nameCell);

    // Drag-and-drop
    row.draggable = true;
    row.dataset.person = person;
    row.style.transition = "opacity 0.15s";
    row.addEventListener("dragstart", e=>{
      dragSrcName = person;
      e.dataTransfer.effectAllowed = "move";
      setTimeout(()=>{ row.style.opacity="0.4"; }, 0);
    });
    row.addEventListener("dragend", ()=>{ row.style.opacity="1"; });
    row.addEventListener("dragover", e=>{
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      row.style.outline = "2px solid rgba(128,203,196,0.6)";
    });
    row.addEventListener("dragleave", ()=>{ row.style.outline=""; });
    row.addEventListener("drop", e=>{
      e.preventDefault(); row.style.outline="";
      if(!dragSrcName || dragSrcName===person) return;
      const fromIdx = TEAM.indexOf(dragSrcName);
      const toIdx   = TEAM.indexOf(person);
      if(fromIdx<0||toIdx<0) return;
      TEAM.splice(fromIdx, 1);
      TEAM.splice(toIdx, 0, dragSrcName);
      dragSrcName = null;
      saveState();
      buildTemplateGrid();
      renderAndSync();
    });
    DAYS.forEach(day=>{
      const wrap=document.createElement("div"); wrap.className="cell-wrap";
      const cell=document.createElement("div"); cell.className="cell"; cell.id=cellId("TPL",person,day);
      renderCellContent(cell,template[person][day]||[]);
      cell.addEventListener("click",e=>{ e.stopPropagation(); if(openPopup&&openPopup.wrap===wrap){ closePopup(); return; } showPopup(wrap,null,person,day,true); });
      wrap.appendChild(cell); row.appendChild(wrap);

    // Verwijder-knop
    const delBtn=document.createElement("button");
    delBtn.textContent="✕";
    delBtn.title=`${person} verwijderen`;
    delBtn.style.cssText="background:transparent;border:1px solid rgba(244,143,177,0.3);color:rgba(244,143,177,0.6);border-radius:5px;width:24px;height:24px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;";
    delBtn.onmouseenter=()=>{ delBtn.style.color="#f48fb1"; delBtn.style.borderColor="rgba(244,143,177,0.7)"; delBtn.style.background="rgba(244,143,177,0.1)"; };
    delBtn.onmouseleave=()=>{ delBtn.style.color="rgba(244,143,177,0.6)"; delBtn.style.borderColor="rgba(244,143,177,0.3)"; delBtn.style.background="transparent"; };
    const _person=person;
    delBtn.onclick=(e)=>{
      e.stopPropagation();
      if(delBtn.dataset.confirm==="1"){
        removePerson(_person);
      } else {
        delBtn.dataset.confirm="1";
        delBtn.textContent="?";
        delBtn.style.color="#f48fb1";
        delBtn.style.background="rgba(244,143,177,0.2)";
        delBtn.style.borderColor="rgba(244,143,177,0.7)";
        setTimeout(()=>{
          delBtn.dataset.confirm="";
          delBtn.textContent="✕";
          delBtn.style.color="rgba(244,143,177,0.6)";
          delBtn.style.background="transparent";
          delBtn.style.borderColor="rgba(244,143,177,0.3)";
        }, 2000);
      }
    };
    row.appendChild(delBtn);
    container.appendChild(row);
  });
}

// ── Week panel ───────────────────────────────────────────────────
function buildWeekPanel(monday){
  const thisWeekMonday=mondayOf(today);
  const isCurrent=isSameDay(monday,thisWeekMonday);
  const wk=getWeekNumber(monday), yr=monday.getFullYear();
  const panel=document.createElement("div"); panel.className=`week-panel ${isCurrent?"current":"other"}`;
  const hdr=document.createElement("div"); hdr.className="week-header";
  const badge=document.createElement("div"); badge.className=`week-badge ${isCurrent?"current":"other"}`; badge.textContent=`Week ${wk}`;
  const lbl=document.createElement("div"); lbl.className=`week-lbl ${isCurrent?"current":"other"}`;
  const yearLabel=yr!==today.getFullYear()?` ${yr}`:"";
  lbl.textContent=isCurrent?"huidige week":(isSameDay(monday,addWeeks(thisWeekMonday,1))?"volgende week":`week ${wk}${yearLabel}`);
  hdr.appendChild(badge); hdr.appendChild(lbl); panel.appendChild(hdr);
  const dayHdr=document.createElement("div"); dayHdr.className="day-header";
  // Personen die altijd op kantoor moeten zijn
  const MUST_KANTOOR = GROUPS["ICT-Systeembeheer"];

  DAYS.forEach((day,i)=>{
    const dayDate=addDays(monday,i), isToday=isSameDay(dayDate,today);
    const dayData=getData(monday);
    const SUPPORT_ALL = GROUPS["ICT-Support"];
    const BEHEER_ALL  = GROUPS["ICT-Systeembeheer"];
    const isZiek = p => { const s=(dayData[p]||{})[day]||[]; return s.includes("ziek"); };
    const isK = p => !isZiek(p) && (()=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("vm_kantoor")||s.includes("nm_kantoor"); })();
    const nSupport = SUPPORT_ALL.filter(isK).length;
    const nBeheer  = BEHEER_ALL.filter(isK).length;
    const n = nSupport + nBeheer;
    const col=n>=7?"#f48fb1":n>=4?"#ffb74d":"#80cbc4";

    // Controleer of minstens één van MUST_KANTOOR op kantoor is
    const isOnKantoor = p => {
      const sel = (dayData[p]||{})[day]||[];
      return sel.includes("kantoor") || sel.includes("vm_kantoor") || sel.includes("nm_kantoor");
    };
    const SUPPORT_GRP = GROUPS["ICT-Support"];
    const isPersonZiek      = p => { const s=(dayData[p]||{})[day]||[]; return s.includes("ziek"); };
    const isPersonOnKantoor = p => !isPersonZiek(p) && (()=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("vm_kantoor")||s.includes("nm_kantoor"); })();
    const isPersonThuis     = p => !isPersonZiek(p) && (()=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("thuis")||s.includes("vm_thuis")||s.includes("nm_thuis")||s.includes("ziek_thuis"); })();
    const hasData           = p => ((dayData[p]||{})[day]||[]).length > 0;

    const beheerOpK  = MUST_KANTOOR.filter(isPersonOnKantoor);
    const beheerHasData = MUST_KANTOOR.some(hasData);
    // Iemand op kantoor 's ochtends of 's middags?
    const beheerVmK = MUST_KANTOOR.some(p=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("vm_kantoor"); });
    const beheerNmK = MUST_KANTOOR.some(p=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("nm_kantoor"); });
    const beheerFullyCovered = beheerVmK && beheerNmK;
    const beheerAlleenThuis = beheerOpK.length===0 && MUST_KANTOOR.some(isPersonThuis) && beheerHasData;
    const showBeheerWarn = !beheerFullyCovered && beheerHasData;

    const supportOpK = SUPPORT_GRP.filter(isPersonOnKantoor);
    const supportHasData = SUPPORT_GRP.some(hasData);
    const supportVmK = SUPPORT_GRP.some(p=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("vm_kantoor"); });
    const supportNmK = SUPPORT_GRP.some(p=>{ const s=(dayData[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("nm_kantoor"); });
    const supportFullyCovered = supportVmK && supportNmK;
    const supportAlleenThuis = supportOpK.length===0 && SUPPORT_GRP.some(isPersonThuis) && supportHasData;
    const showSupportWarn = !supportFullyCovered && supportHasData;

    // Per dagdeel bepalen: op kantoor / thuis / afwezig
    const thuisAanwezig = (group, vm) => {
      const key = vm ? ["thuis","vm_thuis"] : ["thuis","nm_thuis"];
      return group.some(p=>{ const s=(dayData[p]||{})[day]||[]; return key.some(k=>s.includes(k)); });
    };
    const geheel_weg = (group) =>
      group.every(p=>{ const s=(dayData[p]||{})[day]||[]; return s.length===0 || s.every(k=>k.includes("vrij")||k.includes("extern")); });

    // Beheer analyse per dagdeel
    const beheerVmGeen    = !beheerVmK;
    const beheerNmGeen    = !beheerNmK;
    const beheerVmThuis   = beheerVmGeen && thuisAanwezig(MUST_KANTOOR, true);
    const beheerNmThuis   = beheerNmGeen && thuisAanwezig(MUST_KANTOOR, false);
    const beheerVmWeg     = beheerVmGeen && !beheerVmThuis;
    const beheerNmWeg     = beheerNmGeen && !beheerNmThuis;

    // Support analyse per dagdeel
    const supportVmGeen   = !supportVmK;
    const supportNmGeen   = !supportNmK;
    const supportVmThuis  = supportVmGeen && thuisAanwezig(SUPPORT_GRP, true);
    const supportNmThuis  = supportNmGeen && thuisAanwezig(SUPPORT_GRP, false);
    const supportVmWeg    = supportVmGeen && !supportVmThuis;
    const supportNmWeg    = supportNmGeen && !supportNmThuis;

    // Kleur: rood = helemaal weg, oranje = thuis
    const beheerCritical  = beheerVmWeg || beheerNmWeg;
    const supportCritical = supportVmWeg || supportNmWeg;
    const dh=document.createElement("div"); dh.className=`day-hd${isToday?" today-col":""}`;
    if(showBeheerWarn && showSupportWarn && (beheerCritical||supportCritical))
      dh.style.cssText="background:rgba(229,57,53,0.15);border-radius:6px;outline:2px solid rgba(229,57,53,0.6);";
    else if(showBeheerWarn && beheerCritical)
      dh.style.cssText="background:rgba(229,57,53,0.10);border-radius:6px;outline:1.5px solid rgba(229,57,53,0.5);";
    else if(showBeheerWarn || showSupportWarn)
      dh.style.cssText="background:rgba(255,183,77,0.08);border-radius:6px;outline:1.5px solid rgba(255,183,77,0.35);";

    // Bouw waarschuwingstekst per groep
    const buildWarn = (vmWeg, nmWeg, vmThuis, nmThuis, naam) => {
      if(!vmWeg && !nmWeg && !vmThuis && !nmThuis) return "";
      const parts = [];
      if(vmWeg && nmWeg)   parts.push(`✗ ${naam} hele dag weg`);
      else if(vmWeg)        parts.push(`✗ ${naam} 's ochtends weg`);
      else if(nmWeg)        parts.push(`✗ ${naam} 's middags weg`);
      if(vmThuis && nmThuis) parts.push(`🏠 ${naam} hele dag thuis`);
      else if(vmThuis)       parts.push(`🏠 ${naam} 's ochtends thuis`);
      else if(nmThuis)       parts.push(`🏠 ${naam} 's middags thuis`);
      return parts.map(t=>{
        const isWeg = t.startsWith("✗");
        return `<div style="font-size:8px;color:${isWeg?"#f48fb1":"#ffb74d"};font-weight:700;letter-spacing:0.3px;margin-top:1px;">${t}</div>`;
      }).join("");
    };
    const warnHtml = (showBeheerWarn ? buildWarn(beheerVmWeg,beheerNmWeg,beheerVmThuis,beheerNmThuis,"beheer") : "")
                   + (showSupportWarn ? buildWarn(supportVmWeg,supportNmWeg,supportVmThuis,supportNmThuis,"support") : "");
    dh.innerHTML=`<div class="day-hd-name${isToday?" today-col":""}">${day}</div><div class="day-hd-date${isToday?" today-col":""}">${fmtDate(dayDate)}</div>${isToday?"":""}${warnHtml || `<div class="day-hd-count" id="cnt-${weekKey(monday)}-${day}" style="color:${col};line-height:1.2">${n>0?`<span style="font-size:8px;font-weight:700">B:${nBeheer} S:${nSupport}</span>`:""}` + `</div>` }`;
    dayHdr.appendChild(dh);
  });
  panel.appendChild(dayHdr);
  TEAM.forEach((person,pi)=>{
    const row=document.createElement("div"); row.className=`person-row${pi%2===0?" alt":""}`;
    DAYS.forEach((day,i)=>{
      const dayDate=addDays(monday,i), isToday=isSameDay(dayDate,today);
      const wrap=document.createElement("div"); wrap.className="cell-wrap";
      const cell=document.createElement("div"); cell.className=`cell${isToday?" today-col":""}`; cell.id=cellId(weekKey(monday),person,day);
      renderCellContent(cell,getData(monday)[person][day]||[]);
      cell.addEventListener("click",e=>{ e.stopPropagation(); if(openPopup&&openPopup.wrap===wrap){ closePopup(); return; } showPopup(wrap,monday,person,day,false); });
      wrap.appendChild(cell); row.appendChild(wrap);
    });
    panel.appendChild(row);
  });

  requestAnimationFrame(()=>{
    if(document.documentElement.classList.contains("tp-gated")) return;   // verborgen: niet meten; de planning wordt opnieuw opgebouwd zodra de poort opengaat
    const todayHd = panel.querySelector(".day-hd.today-col");
    const todayCells = Array.from(panel.querySelectorAll(".cell.today-col"));
    if(!todayHd || !todayCells.length) return;
    const panelRect = panel.getBoundingClientRect();
    const hdRect    = todayHd.getBoundingClientRect();
    const lastRect  = todayCells[todayCells.length-1].getBoundingClientRect();
    const overlay   = document.createElement("div");
    overlay.className = "today-col-overlay";
    const cellRect2 = todayCells[0].getBoundingClientRect();
    overlay.style.left   = (cellRect2.left   - panelRect.left) + "px";
    overlay.style.top    = (hdRect.top       - panelRect.top)  + "px";
    overlay.style.width  =  cellRect2.width                    + "px";
    overlay.style.height = (lastRect.bottom  - hdRect.top)     + "px";
    panel.querySelectorAll(".today-col-overlay").forEach(e=>e.remove());
    panel.appendChild(overlay);
  });

  return panel;
}

    } else if(s.key==="ziek_thuis"){
      item.innerHTML=`<div style="width:26px;height:15px;border-radius:4px;background:rgba(120,170,120,0.35);border:1.5px solid rgba(120,170,120,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:8px;font-weight:700;color:rgba(225,240,225,0.95)">ZT</span></div><span class="legend-label">${s.label}</span>`;
    } else {
      const bgColor = s.key==="extern"?"rgba(255,213,79,0.75)":s.key==="thuis"?"rgba(76,175,80,0.55)":s.key==="vrij"?"rgba(229,57,53,0.55)":s.color;

  });

function syncNameSpacer(){
  if(document.documentElement.classList.contains("tp-gated")) return;   // toegangspoort dicht: alles is verborgen en meet 0, dus niet meten (anders klappen de kopregels dicht)
  const panels=Array.from(document.querySelectorAll(".week-panel"));
  const nameCol=document.querySelector(".name-col");
  const spacer=document.querySelector(".name-spacer");
  if(!panels.length||!nameCol||!spacer) return;
  panels.forEach(p=>{ const wh=p.querySelector(".week-header"); const dh=p.querySelector(".day-header"); if(wh) wh.style.height=""; if(dh) dh.style.height=""; });
  const maxWH=Math.max(...panels.map(p=>{ const el=p.querySelector(".week-header"); return el?el.offsetHeight:0; }));
  const maxDH=Math.max(...panels.map(p=>{ const el=p.querySelector(".day-header"); return el?el.offsetHeight:0; }));
  panels.forEach(p=>{ const wh=p.querySelector(".week-header"); const dh=p.querySelector(".day-header"); if(wh) wh.style.height=maxWH+"px"; if(dh) dh.style.height=maxDH+"px"; });
  const firstRow=panels[0].querySelector(".person-row");
  if(!firstRow) return;
  spacer.style.height=(firstRow.getBoundingClientRect().top-nameCol.getBoundingClientRect().top)+"px";
}

// ── Statistics (Admin): hoe vaak elke gebruiker de site de afgelopen 30 dagen heeft gebruikt, uit het audit-logboek (alleen kijken) ──
const STATS_DAYS = 30;
function auditStats(entries, nowMs, days){   // telt per gebruiker: bezoeken (inloggen, de site openen, terugkeren) en opgeslagen wijzigingen van de planning
  const from = nowMs - days * 86400000, seen = new Set(), per = {};
  let anon = 0, eerst = null, totaalBezoeken = 0;
  entries.forEach(e=>{
    if(!e || !e.t || seen.has(e.eid)) return; seen.add(e.eid);
    const t = Date.parse(e.t); if(isNaN(t) || t < from || t > nowMs + 86400000) return;
    const act = e.action || "";
    const bezoek = act === "ingelogd" || act === "site geopend" || /^terug op de site/.test(act) || /^site benaderd/.test(act);
    if(bezoek && (eerst === null || t < eerst)) eerst = t;
    if(e.anon || e.user === "(niet ingelogd)"){ if(bezoek) anon++; return; }   // zonder naam: apart geteld, geen staaf
    if(!e.user || e.user === "onbekend") return;
    const u = per[e.user] || (per[e.user] = { user: e.user, bezoeken: 0, wijzigingen: 0 });
    if(bezoek){ u.bezoeken++; totaalBezoeken++; } else if(e.n > 0){ u.wijzigingen++; }
  });
  const users = Object.values(per).filter(u=>u.bezoeken || u.wijzigingen).sort((a, b)=>b.bezoeken - a.bezoeken || b.wijzigingen - a.wijzigingen || a.user.localeCompare(b.user));
  return { users, anon, eerstBezoek: eerst, totaalBezoeken, totaalWijzigingen: users.reduce((s, u)=>s + u.wijzigingen, 0), from };
}
function statsChartSvg(users){   // staafgrafiek: per gebruiker twee staven naast elkaar (bezoeken en wijzigingen)
  const NS = "http://www.w3.org/2000/svg";
  const mk = (n, a, t)=>{ const e = document.createElementNS(NS, n); for(const k in a) e.setAttribute(k, a[k]); if(t != null) e.textContent = t; return e; };
  const max = Math.max(1, ...users.flatMap(u=>[u.bezoeken, u.wijzigingen]));
  const mag = Math.pow(10, Math.floor(Math.log10(max))), nice = [1, 2, 5, 10].map(m=>m * mag).find(v=>v >= max), step = nice <= 5 ? 1 : nice / 5;
  const W = Math.max(480, 70 + users.length * 70), H = 290, L = 42, T = 22, B = 46, ph = H - T - B, gw = (W - L - 10) / users.length;
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Staafgrafiek: gebruik van de site per gebruiker" });
  svg.style.cssText = "display:block;max-width:" + W + "px;margin:0 auto;font-family:'Courier New',monospace;";
  for(let v = 0; v <= nice; v += step){
    const y = T + ph - v / nice * ph;
    svg.appendChild(mk("line", { x1: L, x2: W - 6, y1: y, y2: y, stroke: v === 0 ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.08)", "stroke-width": 1 }));
    svg.appendChild(mk("text", { x: L - 6, y: y + 3, "text-anchor": "end", "font-size": 10, fill: "#888" }, String(v)));
  }
  users.forEach((u, i)=>{
    const x0 = L + i * gw + gw / 2, bw = Math.min(22, gw / 3);
    [["bezoeken", "#80cbc4", u.bezoeken, -bw - 1], ["wijzigingen", "#ce93d8", u.wijzigingen, 1]].forEach(([serie, kleur, val, dx])=>{
      const hh = val / nice * ph;
      const r = mk("rect", { x: x0 + dx, y: T + ph - hh, width: bw, height: hh, rx: 2, fill: kleur, "data-user": u.user, "data-series": serie, "data-value": val });
      r.appendChild(mk("title", {}, u.user + ": " + val + " " + serie)); svg.appendChild(r);
      if(val > 0) svg.appendChild(mk("text", { x: x0 + dx + bw / 2, y: T + ph - hh - 4, "text-anchor": "middle", "font-size": 10, fill: "#ddd" }, String(val)));
    });
    const lab = mk("text", { x: x0, y: H - B + 16, "text-anchor": "middle", "font-size": 11, fill: "#bbb" }, u.user.length > 10 ? u.user.slice(0, 9) + "…" : u.user);   // een lange naam loopt niet over de buren heen
    const gl = mk("g", {}); gl.appendChild(mk("title", {}, u.user)); gl.appendChild(lab); svg.appendChild(gl);   // de volledige naam als tooltip naast de tekst
  });
  return svg;
}

async function restoreFromBackup(filename, sha){
  if(!canRestore()){ denyRestore(); return; }   // alleen ICT-Systeembeheer
  if(!await requireUnlock()) return;
  if(!confirm(`Backup '${filename.replace(".json","")}' terugzetten?\nDe huidige planning wordt overschreven.`)) return;
  try {
    const br = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${filename}?ref=${GH_BRANCH}&t=`+Date.now(),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    const bd = await br.json();
    const backupState = JSON.parse(atob(bd.content.replace(/\n/g,"")));
    const lockWhy = teamLockoutReason(backupState.team, "restore"); if(lockWhy){ alert("❌ " + lockWhy); return; }   // niet jezelf buitensluiten
    const sr = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now(),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    const sd = await sr.json();
    const wr = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
      method:"PUT",
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify({message:commitMessage(`Herstel backup ${filename}`), content: btoa(unescape(encodeURIComponent(JSON.stringify(backupState)))), sha: sd.sha, branch: GH_BRANCH})
    });
    if(wr.ok){
      touchEditTimer();
      const written = JSON.parse(JSON.stringify(backupState));   // wat er echt is weggeschreven (voordat applyState de data aanpast)
      document.querySelectorAll(".z-index-800, [style*='z-index:800']").forEach(el=>el.remove());
      applyState(backupState);
      propagateTemplateToAll();
      const naam1 = filename.replace(".json",""), gelogd1 = auditPushed;
      auditSetHint("backup hersteld: " + naam1);
      auditAfterSave(written);   // logboek: verschil met wat er daarvoor stond
      if(auditPushed === gelogd1){ auditHint = null; auditEvent("backup hersteld: " + naam1 + " (geen verschil met de planning die er al stond)"); }   // ook een terugzetting zonder verschil hoort in het logboek
      auditRebase();             // daarna weer vergelijken met de lokale staat
      renderAndSync();
      alert("✅ Backup hersteld!");
    } else {
      alert("❌ Herstellen mislukt.");
    }
  } catch(e){ alert("❌ Fout: "+e.message); }
}

  const getMondayOfWeek = (yr,wn)=>{
    const jan4=new Date(yr,0,4); const dow=jan4.getDay()||7;
    const mon=new Date(jan4); mon.setDate(jan4.getDate()-(dow-1)+(wn-1)*7); return mon;
  };
  const getISOWeek = d=>{
    const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));
    const y=dt.getUTCFullYear();
    return [y,Math.ceil((((dt-new Date(Date.UTC(y,0,1)))/86400000)+1)/7)];
  };

          <option value="" disabled selected style="color:rgba(255,255,255,0.3);">— Kies een persoon —</option>
          ${TEAM.map(p=>`<option value="${p}">${p}</option>`).join("")}
        </select>
      </div>
      <div style="display:flex;border:1px solid rgba(255,255,255,0.12);border-radius:8px;overflow:hidden;">
        <button id="pd-tab-date" type="button" style="flex:1;padding:9px 6px;border:none;cursor:pointer;font-family:'Courier New',monospace;font-size:12px;">Datums</button>
        <button id="pd-tab-week" type="button" style="flex:1;padding:9px 6px;border:none;border-left:1px solid rgba(255,255,255,0.12);cursor:pointer;font-family:'Courier New',monospace;font-size:12px;">Weeknummers</button>
      </div>
      <div id="pd-panel-date">
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;">
          <div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px;">Van <span id="pd-from-wk" style="color:#ce93d8;"></span></div>
            <input id="pd-from" type="date" style="width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;box-sizing:border-box;" value="${fmt(now)}">
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.3);padding-bottom:10px;">t/m</div>
          <div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px;">T/m <span id="pd-to-wk" style="color:#ce93d8;"></span></div>
            <input id="pd-to" type="date" style="width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;box-sizing:border-box;" value="${fmt(weekEnd)}">
          </div>
        </div>
      </div>
      <div id="pd-panel-week" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;">
          <div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px;">Van</div>
            <div style="display:flex;gap:4px;">
              <select id="pd-wyr1" style="background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;width:72px;">
                <option value="2026">2026</option><option value="2027">2027</option>
              </select>
              <select id="pd-wnr1" style="background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;flex:1;">
                ${Array.from({length:53},(_,i)=>`<option value="${i+1}"${i+1===curW?" selected":""}>W${String(i+1).padStart(2,"0")}</option>`).join("")}
              </select>
            </div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.3);padding-bottom:10px;">t/m</div>
          <div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px;">T/m</div>
            <div style="display:flex;gap:4px;">
              <select id="pd-wyr2" style="background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;width:72px;">
                <option value="2026">2026</option><option value="2027">2027</option>
              </select>
              <select id="pd-wnr2" style="background:#1a1a2e;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:8px;padding:8px;font-family:'Courier New',monospace;font-size:12px;flex:1;">
                ${Array.from({length:53},(_,i)=>`<option value="${i+1}"${i+1===curW?" selected":""}>W${String(i+1).padStart(2,"0")}</option>`).join("")}
              </select>
            </div>
          </div>

      </div>
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:5px;letter-spacing:1px;">STATUS</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
          ${STATUSES_SIMPLE.map(s=>`
            <label style="display:flex;align-items:center;gap:7px;cursor:pointer;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);font-size:12px;color:#fff;">
              <input type="radio" name="pd-status" value="${s.key}" style="accent-color:${s.color};">
              <span style="width:12px;height:12px;border-radius:3px;background:${s.color};flex-shrink:0;display:inline-block;"></span>

        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">

      </label>
      <div id="pd-result" style="font-size:11px;color:#ce93d8;min-height:18px;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="pd-save" style="background:rgba(206,147,216,0.2);border:1px solid rgba(206,147,216,0.5);color:#ce93d8;border-radius:8px;padding:9px 18px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;">Opslaan</button>
      </div>
    </div>`;

  let useWeeks = false;

  const updateResult = ()=>{
    const workOnly = box.querySelector("#pd-workdays").checked;
    let from, to;
    if(useWeeks){
      const yr1=parseInt(box.querySelector("#pd-wyr1").value);
      const wn1=parseInt(box.querySelector("#pd-wnr1").value);
      const yr2=parseInt(box.querySelector("#pd-wyr2").value);
      const wn2=parseInt(box.querySelector("#pd-wnr2").value);
      from = getMondayOfWeek(yr1,wn1);
      to = new Date(getMondayOfWeek(yr2,wn2)); to.setDate(to.getDate()+4);
    } else {
      from = new Date(box.querySelector("#pd-from").value);
      to   = new Date(box.querySelector("#pd-to").value);
      const fEl=box.querySelector("#pd-from-wk"), tEl=box.querySelector("#pd-to-wk");
      if(!isNaN(from)){ const [y,w]=getISOWeek(from); fEl.textContent=`W${String(w).padStart(2,"0")}`; }
      if(!isNaN(to)){   const [y,w]=getISOWeek(to);   tEl.textContent=`W${String(w).padStart(2,"0")}`; }
    }
    if(!from||!to||isNaN(from)||isNaN(to)||to<from){ box.querySelector("#pd-result").textContent=""; return; }
    let count=0, d=new Date(from);
    while(d<=to){ if(!workOnly||d.getDay()>=1&&d.getDay()<=5) count++; d.setDate(d.getDate()+1); }
    box.querySelector("#pd-result").textContent=`→ ${count} dag${count!==1?"en":""} worden aangepast`;
  };

  const tabDate = box.querySelector("#pd-tab-date"), tabWeek = box.querySelector("#pd-tab-week");
  const setMode = (weeks)=>{
    useWeeks = weeks;
    box.querySelector("#pd-panel-date").style.display = weeks ? "none" : "";
    box.querySelector("#pd-panel-week").style.display = weeks ? "" : "none";
    tabDate.style.background = weeks ? "transparent" : "rgba(206,147,216,0.22)";
    tabDate.style.color      = weeks ? "rgba(255,255,255,0.45)" : "#ce93d8";
    tabDate.style.fontWeight = weeks ? "400" : "700";
    tabWeek.style.background = weeks ? "rgba(206,147,216,0.22)" : "transparent";
    tabWeek.style.color      = weeks ? "#ce93d8" : "rgba(255,255,255,0.45)";
    tabWeek.style.fontWeight = weeks ? "700" : "400";
    updateResult();
  };
  tabDate.onclick = ()=>setMode(false);
  tabWeek.onclick = ()=>setMode(true);
  setMode(false);

  ["#pd-from","#pd-to","#pd-wyr1","#pd-wnr1","#pd-wyr2","#pd-wnr2","#pd-workdays"].forEach(id=>{
    const el=box.querySelector(id); if(el){ el.addEventListener("change",updateResult); el.addEventListener("input",updateResult); }
  });
  box.querySelector('input[name="pd-status"][value="vrij"]').checked = true;
  // Wie is ingelogd? Die persoon staat standaard in het venster (te wijzigen); staat de naam niet in het team, dan blijft de keuze leeg
  { const me = currentIdentity && currentIdentity.user; if(me && TEAM.includes(me)) box.querySelector("#pd-person").value = me; }
  updateResult();

  addWinX(box, ()=>overlay.remove(), "pd-close");

  box.querySelector("#pd-save").onclick = async ()=>{
    if(!await requireUnlock()) return;
    const person = box.querySelector("#pd-person").value;
    const statusEl = box.querySelector('input[name="pd-status"]:checked');
    const workOnly = box.querySelector("#pd-workdays").checked;
    if(!person){ alert("Kies eerst een persoon"); return; }
    if(!statusEl){ alert("Kies een status"); return; }

    let from, to;
    if(useWeeks){
      const yr1=parseInt(box.querySelector("#pd-wyr1").value);
      const wn1=parseInt(box.querySelector("#pd-wnr1").value);
      const yr2=parseInt(box.querySelector("#pd-wyr2").value);
      const wn2=parseInt(box.querySelector("#pd-wnr2").value);
      from = getMondayOfWeek(yr1,wn1);
      to = new Date(getMondayOfWeek(yr2,wn2)); to.setDate(to.getDate()+4);
    } else {
      from = new Date(box.querySelector("#pd-from").value);
      to   = new Date(box.querySelector("#pd-to").value);
    }
    if(!from||!to||isNaN(from)||isNaN(to)||to<from){ alert("Ongeldige periode"); return; }

    const status = statusEl.value;
    let changed = 0;
    let d = new Date(from);
    while(d<=to){
      const dow=d.getDay();
      if(!workOnly||(dow>=1&&dow<=5)){
        const isoWeek=(()=>{ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7)); const y=dt.getUTCFullYear(); return `${y}-W${String(Math.ceil((((dt-new Date(Date.UTC(y,0,1)))/86400000)+1)/7)).padStart(2,"0")}`; })();
        const dayKey=DAGKEYS[dow];
        const lockKey=isoWeek+"-"+dayKey;
        if(!LOCKED_DAYS.has(lockKey)){
          const monday=mondayOf(d);
          const data=getData(monday);
          if(!data[person]) data[person]={};
          data[person][dayKey]=[status];
          if(!manuallyEdited[isoWeek]) manuallyEdited[isoWeek]=new Set();
          manuallyEdited[isoWeek].add(person+"-"+dayKey);
          changed++;
        }
      }
      d.setDate(d.getDate()+1);
    }
    auditSetHint("periode: " + person + " " + status + " " + fmt(from) + " t/m " + fmt(to));
    touchEditTimer();
    await saveToGitHub();
    renderAndSync();
    overlay.remove();
    const msg=document.createElement("div");
    msg.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid rgba(206,147,216,0.4);color:#ce93d8;padding:10px 20px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;z-index:900;";
    msg.textContent=`✅ ${changed} dag${changed!==1?"en":""} aangepast voor ${person}`;
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),3000);
  };

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// ── Geen Beheer modal ────────────────────────────────────────────
function showGeenBeheerModal(){
  const MUST = GROUPS["ICT-Systeembeheer"];
  const SUPPORT = GROUPS["ICT-Support"];
  const DAYS_LIST = ["MA","DI","WO","DO","VR"];
  const DAY_NAMES = {MA:"Maandag",DI:"Dinsdag",WO:"Woensdag",DO:"Donderdag",VR:"Vrijdag"};

  // Verzamel alle dagen zonder beheer uit alle zichtbare weken
  const results = [];
  const isOnKantoor = (monday, person, day) => {
    const sel = (getData(monday)[person]||{})[day]||[];
    return !sel.includes("ziek") && (sel.includes("kantoor")||sel.includes("vm_kantoor")||sel.includes("nm_kantoor"));
  };
  const isThuis = (monday, person, day) => {
    const sel = (getData(monday)[person]||{})[day]||[];
    return !sel.includes("ziek") && (sel.includes("thuis")||sel.includes("vm_thuis")||sel.includes("nm_thuis")||sel.includes("ziek_thuis"));
  };
  const hasStatus = (monday, person, day) => ((getData(monday)[person]||{})[day]||[]).length > 0;

  // Kijk alle weken vooruit waarvoor data beschikbaar is
  const thisMonday = mondayOf(today);
  const allMondays = Object.keys(store||{}).map(k=>{
    const m=getMondayFromKey(k); return m >= thisMonday ? m : null;
  }).filter(Boolean).sort((a,b)=>a-b);
  const weeksToCheck = allMondays.length > 0 ? allMondays : [thisMonday];
  for(const monday of weeksToCheck){
    DAYS_LIST.forEach((day, i) => {
      const dayDate = addDays(monday, i);
      if(dayDate < today) return;
      const dayData = getData(monday);
      const mustHasData = MUST.some(p => hasStatus(monday,p,day));
      const supportHasData = SUPPORT.some(p => hasStatus(monday,p,day));
      if(!mustHasData && !supportHasData) return;

      // Beheer analyse
      const beheerOpKantoor = MUST.filter(p => isOnKantoor(monday,p,day));
      const beheerThuis     = MUST.filter(p => !isOnKantoor(monday,p,day) && isThuis(monday,p,day) && hasStatus(monday,p,day));
      const geenBeheer      = beheerOpKantoor.length === 0 && mustHasData;
      const alleenThuis     = beheerOpKantoor.length === 0 && beheerThuis.length > 0;

      // Support analyse
      const supportOpKantoor = SUPPORT.filter(p => isOnKantoor(monday,p,day));
      const supportThuis     = SUPPORT.filter(p => !isOnKantoor(monday,p,day) && isThuis(monday,p,day) && hasStatus(monday,p,day));
      const geenSupport      = supportOpKantoor.length === 0 && supportHasData;
      const supportAlleenThuis = supportOpKantoor.length === 0 && supportThuis.length > 0;

      if(geenBeheer || geenSupport){
        const d = addDays(monday, i);
        // Tijdstip bepalen
        const whenAbsentModal = (group, onK) => {
          const dayD = getData(monday);
          const vmKantoor = group.some(p=>{ const s=(dayD[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("vm_kantoor"); });
          const nmKantoor = group.some(p=>{ const s=(dayD[p]||{})[day]||[]; return s.includes("kantoor")||s.includes("nm_kantoor"); });
          if(!vmKantoor && !nmKantoor) return "hele dag";
          if(!vmKantoor) return "'s ochtends";
          if(!nmKantoor) return "'s middags";
          return "";
        };
        results.push({
          label: `${DAY_NAMES[day]} ${d.getDate()} ${["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"][d.getMonth()]} ${d.getFullYear()}`,   // met jaartal
          geenBeheer,   alleenThuis,   beheerThuis,
          beheerWhen: whenAbsentModal(MUST, beheerOpKantoor),
          geenSupport,  supportAlleenThuis, supportThuis,
          supportWhen: whenAbsentModal(SUPPORT, supportOpKantoor),
          severity: (geenBeheer && !alleenThuis) || (geenSupport && !supportAlleenThuis) ? "critical" : "warn"
        });
      }
    });
  }

  // Bouw modal
  const overlay = document.createElement("div");
  overlay.className = "tp-overlay"; overlay.style.cssText = "position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;";
  const box = document.createElement("div");
  box.style.cssText = "background:#111827;border:1px solid rgba(244,143,177,0.3);border-radius:14px;padding:24px 22px;min-width:320px;max-width:420px;max-height:80vh;overflow-y:auto;";

  let html_inner = `<div style="font-size:14px;font-weight:700;color:#f48fb1;margin-bottom:14px;padding-right:34px;">⚠ Geen Systeembeheer</div>`;

  if(results.length === 0){
    html_inner += `<div style="color:#80cbc4;font-size:12px;padding:12px 0;">✓ Alle komende dagen is er iemand van Systeembeheer aanwezig.</div>`;
  } else {
    html_inner += `<div style="font-size:10px;color:#777;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;">Dagen zonder beheer/support (alle komende weken)</div>`;
    results.forEach(r => {
      const borderCol = r.severity==="critical" ? "rgba(229,57,53,0.3)" : "rgba(255,183,77,0.2)";
      html_inner += `<div style="padding:8px 0;border-bottom:1px solid ${borderCol};">
        <div style="font-size:12px;color:#fff;font-weight:600;margin-bottom:4px;">${r.label}</div>
        ${r.geenBeheer ? (r.alleenThuis
          ? `<div style="font-size:10px;color:#ffb74d;margin-bottom:2px;">🏠 Beheer thuis (${r.beheerWhen}): ${r.beheerThuis.join(", ")}</div>`
          : `<div style="font-size:10px;color:#f48fb1;margin-bottom:2px;">✗ Geen beheer op Campus (${r.beheerWhen})</div>`)
          : ""}
        ${r.geenSupport ? (r.supportAlleenThuis
          ? `<div style="font-size:10px;color:#ffb74d;margin-bottom:2px;">🏠 Support thuis (${r.supportWhen}): ${r.supportThuis.join(", ")}</div>`
          : `<div style="font-size:10px;color:#f48fb1;margin-bottom:2px;">✗ Geen support op Campus (${r.supportWhen})</div>`)
          : ""}
      </div>`;
    });
  }


  box.innerHTML = html_inner;
  overlay.appendChild(box);
  addWinX(box, ()=>overlay.remove(), "gb-close");
  document.body.appendChild(overlay);
}
