// ── Statistics (Admin): hoe vaak elke gebruiker de site de afgelopen 30 dagen heeft gebruikt, uit het audit-logboek (alleen kijken) ──
const STATS_DAYS = 30;
const STAT_KLEUR = { bezoeken: "#80cbc4", zelf: "#ce93d8", ander: "#ffb74d", beide: "#f48fb1" };
const STAT_SOORT = { zelf: "voor zichzelf", ander: "voor een ander", beide: "voor zichzelf en een ander" };
function auditChangeKind(e){   // voor wie is deze opgeslagen wijziging? zelf: alleen cellen van de gebruiker zelf; ander: alleen cellen van anderen; beide: allebei (of niet te bepalen)
  let eigen = 0, anders = 0;
  (e.changes || []).forEach(c=>{ if(c && c.p){ if(c.p === e.user) eigen++; else anders++; } });
  return eigen && !anders ? "zelf" : (anders && !eigen ? "ander" : "beide");
}
function auditStats(entries, nowMs, days){   // telt per gebruiker: bezoeken (inloggen, de site openen, terugkeren) en opgeslagen wijzigingen van de planning, die per soort (zelf / ander / beide) worden uitgesplitst
  const from = nowMs - days * 86400000, seen = new Set(), per = {};
  let anon = 0, eerst = null, totaalBezoeken = 0;
  entries.forEach(e=>{
    if(!e || !e.t || seen.has(e.eid)) return; seen.add(e.eid);
    const t = Date.parse(e.t); if(isNaN(t) || t < from || t > nowMs + 86400000) return;
    const act = e.action || "";
    const bezoek = act === "ingelogd" || act === "site geopend" || /^terug op de site/.test(act) || /^site benaderd/.test(act);
    if(bezoek && (eerst === null || t < eerst)) eerst = t;
    if(e.anon || e.user === "(niet ingelogd)"){ if(bezoek) anon++; return; }   // zonder naam: apart geteld, geen staaf
    if(!e.user || e.user === "onbekend") return;
    const u = per[e.user] || (per[e.user] = { user: e.user, bezoeken: 0, wijzigingen: 0, zelf: 0, ander: 0, beide: 0, lijst: [] });
    if(bezoek){ u.bezoeken++; totaalBezoeken++; }
    else if(e.n > 0){ const soort = auditChangeKind(e); u.wijzigingen++; u[soort]++; u.lijst.push({ t, soort, e }); }
  });
  const users = Object.values(per).filter(u=>u.bezoeken || u.wijzigingen).sort((a, b)=>b.bezoeken - a.bezoeken || b.wijzigingen - a.wijzigingen || a.user.localeCompare(b.user));
  users.forEach(u=>u.lijst.sort((a, b)=>b.t - a.t));   // nieuwste bovenaan, voor het inzoomen
  const som = k=>users.reduce((s, u)=>s + u[k], 0);
  return { users, anon, eerstBezoek: eerst, totaalBezoeken, totaalWijzigingen: som("wijzigingen"), totaalZelf: som("zelf"), totaalAnder: som("ander"), totaalBeide: som("beide"), from };
}
function auditChText(c){   // een wijziging in woorden, zoals in het logboekvenster
  const lab = k=>{ const s = STATUSES.find(x=>x.key === k); return s ? s.label : k; }, fv = a=>(a && a.length) ? a.map(lab).join(" + ") : "leeg";
  if(c.s === "cel") return c.p + " " + c.w + " " + c.d + ": " + fv(c.from) + " → " + fv(c.to);
  if(c.s === "standaard") return "standaard " + c.p + " " + c.d + ": " + fv(c.from) + " → " + fv(c.to);
  if(c.s === "team+") return "team: " + c.p + " toegevoegd";
  if(c.s === "team-") return "team: " + c.p + " verwijderd";
  if(c.s === "doorgevoerd") return "doorgevoerd naar " + c.n + " cellen";
  return JSON.stringify(c);
}
function statsChartSvg(users, onZoom){   // per gebruiker twee staven naast elkaar: bezoeken, en wijzigingen (één gestapelde staaf: voor zichzelf, voor een ander, voor beide); een klik op de wijzigingsstaaf zoomt in
  const NS = "http://www.w3.org/2000/svg";
  const mk = (n, a, t)=>{ const e = document.createElementNS(NS, n); for(const k in a) e.setAttribute(k, a[k]); if(t != null) e.textContent = t; return e; };
  const max = Math.max(1, ...users.flatMap(u=>[u.bezoeken, u.wijzigingen]));
  const mag = Math.pow(10, Math.floor(Math.log10(max))), nice = [1, 2, 5, 10].map(m=>m * mag).find(v=>v >= max), step = nice <= 5 ? 1 : nice / 5;
  const W = Math.max(480, 70 + users.length * 70), H = 290, L = 42, T = 22, B = 46, ph = H - T - B, gw = (W - L - 10) / users.length;
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "Staafgrafiek: gebruik van de site per gebruiker" });
  svg.style.cssText = "display:block;max-width:" + W + "px;margin:0 auto;font-family:'Courier New',monospace;";
  for(let v = 0; v <= nice; v += step){
    const y = T + ph - v / nice * ph;
    svg.appendChild(mk("line", { x1: L, x2: W - 6, y1: y, y2: y, stroke: v === 0 ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.08)", "stroke-width": 1 }));
    svg.appendChild(mk("text", { x: L - 6, y: y + 3, "text-anchor": "end", "font-size": 10, fill: "#888" }, String(v)));
  }
  users.forEach((u, i)=>{
    const x0 = L + i * gw + gw / 2, bw = Math.min(22, gw / 3);
    { // bezoeken: één staaf
      const hh = u.bezoeken / nice * ph;
      const r = mk("rect", { x: x0 - bw - 1, y: T + ph - hh, width: bw, height: hh, rx: 2, fill: STAT_KLEUR.bezoeken, "data-user": u.user, "data-series": "bezoeken", "data-value": u.bezoeken });
      r.appendChild(mk("title", {}, u.user + ": " + u.bezoeken + " bezoeken")); svg.appendChild(r);
      if(u.bezoeken > 0) svg.appendChild(mk("text", { x: x0 - bw - 1 + bw / 2, y: T + ph - hh - 4, "text-anchor": "middle", "font-size": 10, fill: "#ddd" }, String(u.bezoeken)));
    }
    { // wijzigingen: één staaf, gestapeld in drie kleuren
      let y = T + ph;
      [["zelf", u.zelf], ["ander", u.ander], ["beide", u.beide]].forEach(([soort, val])=>{
        if(!val) return;
        const hh = val / nice * ph; y -= hh;
        const r = mk("rect", { x: x0 + 1, y, width: bw, height: hh, rx: 2, fill: STAT_KLEUR[soort], stroke: "#111827", "stroke-width": 1, "data-user": u.user, "data-series": soort, "data-value": val, class: "stat-seg", tabindex: 0, role: "button", "aria-label": u.user + ": " + val + " wijziging" + (val === 1 ? "" : "en") + " " + STAT_SOORT[soort] + ", klik om in te zoomen" });
        r.style.cursor = "pointer";
        r.appendChild(mk("title", {}, u.user + ": " + val + " wijziging" + (val === 1 ? "" : "en") + " " + STAT_SOORT[soort] + " (klik om in te zoomen)"));
        const zoom = ()=>{ if(onZoom) onZoom(u); };
        r.addEventListener("click", zoom); r.addEventListener("keydown", ev=>{ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); zoom(); } });
        svg.appendChild(r);
        if(hh >= 13) svg.appendChild(mk("text", { x: x0 + 1 + bw / 2, y: y + hh / 2 + 3.5, "text-anchor": "middle", "font-size": 10, fill: "#1a1a2e", "pointer-events": "none" }, String(val)));
      });
      if(u.wijzigingen > 0) svg.appendChild(mk("text", { x: x0 + 1 + bw / 2, y: y - 4, "text-anchor": "middle", "font-size": 10, fill: "#ddd" }, String(u.wijzigingen)));
    }
    const lab = mk("text", { x: x0, y: H - B + 16, "text-anchor": "middle", "font-size": 11, fill: "#bbb" }, u.user.length > 10 ? u.user.slice(0, 9) + "…" : u.user);   // een lange naam loopt niet over de buren heen
    const gl = mk("g", {}); gl.appendChild(mk("title", {}, u.user)); gl.appendChild(lab); svg.appendChild(gl);   // de volledige naam als tooltip naast de tekst
  });
  return svg;
}

async function restoreFromBackup(filename, sha){
  if(!canRestore()){ denyRestore(); return; }   // alleen ICT-Systeembeheer
  if(!await requireUnlock()) return;
  if(!confirm(`Backup '${filename.replace(".json","")}' terugzetten?\nDe huidige planning wordt overschreven.`)) return;
  try {
    const br = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${filename}?ref=${GH_BRANCH}&t=`+Date.now(),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    const bd = await br.json();
    const backupState = JSON.parse(atob(bd.content.replace(/\n/g,"")));
    const lockWhy = teamLockoutReason(backupState.team, "restore"); if(lockWhy){ alert("❌ " + lockWhy); return; }   // niet jezelf buitensluiten
    const sr = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now(),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    const sd = await sr.json();
    const wr = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
      method:"PUT",
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify({message:commitMessage(`Herstel backup ${filename}`), content: btoa(unescape(encodeURIComponent(JSON.stringify(backupState)))), sha: sd.sha, branch: GH_BRANCH})
    });
    if(wr.ok){
      touchEditTimer();
      const written = JSON.parse(JSON.stringify(backupState));   // wat er echt is weggeschreven (voordat applyState de data aanpast)
      document.querySelectorAll(".z-index-800, [style*='z-index:800']").forEach(el=>el.remove());
      applyState(backupState);
      propagateTemplateToAll();
      const naam1 = filename.replace(".json",""), gelogd1 = auditPushed;
      auditSetHint("backup hersteld: " + naam1);
      auditAfterSave(written);   // logboek: verschil met wat er daarvoor stond
      if(auditPushed === gelogd1){ auditHint = null; auditEvent("backup hersteld: " + naam1 + " (geen verschil met de planning die er al stond)"); }   // ook een terugzetting zonder verschil hoort in het logboek
      auditRebase();             // daarna weer vergelijken met de lokale staat
      renderAndSync();
      alert("✅ Backup hersteld!");
    } else {
      alert("❌ Herstellen mislukt.");
    }
  } catch(e){ alert("❌ Fout: "+e.message); }
}

      </div>
    </div>`;

  let useWeeks = false;

  const updateResult = ()=>{
    const workOnly = box.querySelector("#pd-workdays").checked;
    let from, to;
    if(useWeeks){
      const yr1=parseInt(box.querySelector("#pd-wyr1").value);
      const wn1=parseInt(box.querySelector("#pd-wnr1").value);
      const yr2=parseInt(box.querySelector("#pd-wyr2").value);
      const wn2=parseInt(box.querySelector("#pd-wnr2").value);
      from = getMondayOfWeek(yr1,wn1);
      to = new Date(getMondayOfWeek(yr2,wn2)); to.setDate(to.getDate()+4);
    } else {
      from = new Date(box.querySelector("#pd-from").value);
      to   = new Date(box.querySelector("#pd-to").value);
      const fEl=box.querySelector("#pd-from-wk"), tEl=box.querySelector("#pd-to-wk");
      if(!isNaN(from)){ const [y,w]=getISOWeek(from); fEl.textContent=`W${String(w).padStart(2,"0")}`; }
      if(!isNaN(to)){   const [y,w]=getISOWeek(to);   tEl.textContent=`W${String(w).padStart(2,"0")}`; }
    }
    if(!from||!to||isNaN(from)||isNaN(to)||to<from){ box.querySelector("#pd-result").textContent=""; return; }
    let count=0, d=new Date(from);
    while(d<=to){ if(!workOnly||d.getDay()>=1&&d.getDay()<=5) count++; d.setDate(d.getDate()+1); }
    box.querySelector("#pd-result").textContent=`→ ${count} dag${count!==1?"en":""} worden aangepast`;
  };

  const tabDate = box.querySelector("#pd-tab-date"), tabWeek = box.querySelector("#pd-tab-week");
  const setMode = (weeks)=>{
    useWeeks = weeks;
    box.querySelector("#pd-panel-date").style.display = weeks ? "none" : "";
    box.querySelector("#pd-panel-week").style.display = weeks ? "" : "none";
    tabDate.style.background = weeks ? "transparent" : "rgba(206,147,216,0.22)";
    tabDate.style.color      = weeks ? "rgba(255,255,255,0.45)" : "#ce93d8";
    tabDate.style.fontWeight = weeks ? "400" : "700";
    tabWeek.style.background = weeks ? "rgba(206,147,216,0.22)" : "transparent";
    tabWeek.style.color      = weeks ? "#ce93d8" : "rgba(255,255,255,0.45)";
    tabWeek.style.fontWeight = weeks ? "700" : "400";
    updateResult();
  };
  tabDate.onclick = ()=>setMode(false);
  tabWeek.onclick = ()=>setMode(true);
  setMode(false);

  ["#pd-from","#pd-to","#pd-wyr1","#pd-wnr1","#pd-wyr2","#pd-wnr2","#pd-workdays"].forEach(id=>{
    const el=box.querySelector(id); if(el){ el.addEventListener("change",updateResult); el.addEventListener("input",updateResult); }
  });
  box.querySelector('input[name="pd-status"][value="vrij"]').checked = true;
  // Wie is ingelogd? Die persoon staat standaard in het venster (te wijzigen); staat de naam niet in het team, dan blijft de keuze leeg
  { const me = currentIdentity && currentIdentity.user; if(me && TEAM.includes(me)) box.querySelector("#pd-person").value = me; }
  updateResult();

  addWinX(box, ()=>overlay.remove(), "pd-close");

  box.querySelector("#pd-save").onclick = async ()=>{
    if(!await requireUnlock()) return;
    const person = box.querySelector("#pd-person").value;
    const statusEl = box.querySelector('input[name="pd-status"]:checked');
    const workOnly = box.querySelector("#pd-workdays").checked;
    if(!person){ alert("Kies eerst een persoon"); return; }
    if(!statusEl){ alert("Kies een status"); return; }

    let from, to;
    if(useWeeks){
      const yr1=parseInt(box.querySelector("#pd-wyr1").value);
      const wn1=parseInt(box.querySelector("#pd-wnr1").value);
      const yr2=parseInt(box.querySelector("#pd-wyr2").value);
      const wn2=parseInt(box.querySelector("#pd-wnr2").value);
      from = getMondayOfWeek(yr1,wn1);
      to = new Date(getMondayOfWeek(yr2,wn2)); to.setDate(to.getDate()+4);
    } else {
      from = new Date(box.querySelector("#pd-from").value);
      to   = new Date(box.querySelector("#pd-to").value);
    }
    if(!from||!to||isNaN(from)||isNaN(to)||to<from){ alert("Ongeldige periode"); return; }

    const status = statusEl.value;
    let changed = 0;
    let d = new Date(from);
    while(d<=to){
      const dow=d.getDay();
      if(!workOnly||(dow>=1&&dow<=5)){
        const isoWeek=(()=>{ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7)); const y=dt.getUTCFullYear(); return `${y}-W${String(Math.ceil((((dt-new Date(Date.UTC(y,0,1)))/86400000)+1)/7)).padStart(2,"0")}`; })();
        const dayKey=DAGKEYS[dow];
        const lockKey=isoWeek+"-"+dayKey;
        if(!LOCKED_DAYS.has(lockKey)){
          const monday=mondayOf(d);
          const data=getData(monday);
          if(!data[person]) data[person]={};
          data[person][dayKey]=[status];
          if(!manuallyEdited[isoWeek]) manuallyEdited[isoWeek]=new Set();
          manuallyEdited[isoWeek].add(person+"-"+dayKey);
          changed++;
        }
      }
      d.setDate(d.getDate()+1);
    }
    auditSetHint("periode: " + person + " " + status + " " + fmt(from) + " t/m " + fmt(to));
    touchEditTimer();
    await saveToGitHub();
    renderAndSync();
    overlay.remove();
    const msg=document.createElement("div");
    msg.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid rgba(206,147,216,0.4);color:#ce93d8;padding:10px 20px;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;z-index:900;";
    msg.textContent=`✅ ${changed} dag${changed!==1?"en":""} aangepast voor ${person}`;
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),3000);
  };

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// ── Geen Beheer modal ────────────────────────────────────────────
function showGeenBeheerModal(){
  if(!canSeeAdmin()) return;   // Geen Beheer zit in de map Info: ICT-Systeembeheer en ICT-Management (alleen kijken)
  const MUST = ADMINISTRATORS.filter(n=>TEAM.includes(n));   // de Administrators (teamleden)
  const DAYS_LIST = ["MA","DI","WO","DO","VR"];
  const DAY_NAMES = {MA:"Maandag",DI:"Dinsdag",WO:"Woensdag",DO:"Donderdag",VR:"Vrijdag"};

  // Verzamel alle dagen waarop Systeembeheer of Support niemand aanwezig heeft (thuis of op kantoor telt allebei)
  const results = [];
  // Kijk alle weken vooruit waarvoor data beschikbaar is
  const thisMonday = mondayOf(today);
  const allMondays = Object.keys(store||{}).map(k=>{
    const m=getMondayFromKey(k); return m >= thisMonday ? m : null;
  }).filter(Boolean).sort((a,b)=>a-b);
  const weeksToCheck = allMondays.length > 0 ? allMondays : [thisMonday];
  for(const monday of weeksToCheck){
    DAYS_LIST.forEach((day, i) => {
      const dayDate = addDays(monday, i);
      if(dayDate < today) return;
      const dayData = getData(monday);
      const beheer = groupCoverage(dayData, MUST, day);
      if(beheer.gap){
        const d = addDays(monday, i);
        results.push({
          label: `${DAY_NAMES[day]} ${d.getDate()} ${["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"][d.getMonth()]} ${d.getFullYear()}`,   // met jaartal
          beheerGap: beheer.gap
        });
      }
    });
  }

  // Bouw modal
  const overlay = document.createElement("div");
  overlay.className = "tp-overlay"; overlay.style.cssText = "position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;";
  const box = document.createElement("div");
  box.style.cssText = "background:#111827;border:1px solid rgba(244,143,177,0.3);border-radius:14px;padding:24px 22px;min-width:320px;max-width:420px;max-height:80vh;overflow-y:auto;";

  let html_inner = `<div style="font-size:14px;font-weight:700;color:#f48fb1;margin-bottom:14px;padding-right:34px;">⚠ Geen Beheer</div>`;

  if(results.length === 0){
    html_inner += `<div style="color:#80cbc4;font-size:12px;padding:12px 0;">✓ Alle komende dagen is er een Administrator aanwezig.</div>`;
  } else {
    html_inner += `<div style="font-size:10px;color:#777;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;">Dagen zonder Administrator (alle komende weken)</div>`;
    results.forEach(r => {
      html_inner += `<div style="padding:8px 0;border-bottom:1px solid rgba(229,57,53,0.3);">
        <div style="font-size:12px;color:#fff;font-weight:600;margin-bottom:4px;">${r.label}</div>
        ${r.beheerGap ? `<div style="font-size:10px;color:#f48fb1;margin-bottom:2px;">✗ Geen beheer (${r.beheerGap})</div>` : ""}
      </div>`;
    });
  }


  box.innerHTML = html_inner;
  overlay.appendChild(box);
  addWinX(box, ()=>overlay.remove(), "gb-close");
  document.body.appendChild(overlay);
}

document.getElementById("btn-restore-backup").addEventListener("click", async ()=>{
  if(!canRestore()){ denyRestore(); return; }   // alleen ICT-Systeembeheer
  if(!await requireUnlock()) return;            // en bewerken moet aan staan
  const btn = document.getElementById("btn-restore-backup");
  btn.textContent = "⟳ laden...";
  btn.disabled = true;
  try{
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups?ref=${GH_BRANCH}&t=`+Date.now(),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(!r.ok){ alert("Kon backups niet laden ("+r.status+")"); return; }
    const files = await r.json();
    const sorted = files.filter(f=>f.name.endsWith(".json")).sort((a,b)=>b.name.localeCompare(a.name));
    if(!sorted.length){ alert("Geen backups gevonden."); return; }

    // Bouw keuze-overlay
    const overlay = document.createElement("div");
    overlay.className = "tp-overlay"; overlay.style.cssText = "position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;";
    const box = document.createElement("div");
    box.style.cssText="background:#111827;border:1px solid rgba(255,165,0,0.4);border-radius:14px;padding:44px 22px 24px;min-width:280px;max-width:340px;";
    const restoreTitle = document.createElement("div");
    restoreTitle.style.cssText = "font-size:14px;font-weight:700;color:#ffb74d;margin-bottom:10px;";
    restoreTitle.textContent = "⟳ Backup herstellen";
    box.appendChild(restoreTitle);

    const selectLbl = document.createElement("div");
    selectLbl.style.cssText = "font-size:10px;color:#777;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase;";
    selectLbl.textContent = "Kies een datum";
    box.appendChild(selectLbl);

    const sel = document.createElement("select");
    sel.id = "backup-select";
    sel.style.cssText = "width:100%;background:#1a1a2e;color:#eee;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12px;margin-bottom:16px;";
    sorted.forEach(f=>{ const o=document.createElement("option"); o.value=f.download_url; o.textContent=f.name.replace(".json",""); sel.appendChild(o); });
    box.appendChild(sel);

    const btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;gap:8px;justify-content:flex-end;";
    btnRow.innerHTML = `<button id="backup-confirm" style="background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.4);color:#ffb74d;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;">Terugzetten</button>`;
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    addWinX(box, ()=>overlay.remove(), "backup-close");

    document.getElementById("backup-confirm").onclick = async ()=>{
      if(!canRestore()){ overlay.remove(); denyRestore(); return; }   // nog eens controleren op het moment van terugzetten
      const url = document.getElementById("backup-select").value;
      const confirmBtn = document.getElementById("backup-confirm");
      confirmBtn.textContent = "Bezig..."; confirmBtn.disabled = true;
      try{
        const dr = await fetch(url+"?t="+Date.now());
        const data = await dr.json();
        if(data && data.store){
          const lockWhy = teamLockoutReason(data.team, "restore"); if(lockWhy){ alert("❌ " + lockWhy); return; }   // niet jezelf buitensluiten
          const naam2 = decodeURIComponent((url.split("?")[0].split("/").pop() || "")), gelogd2 = auditPushed, opgeslagen2 = saveOkCount;
          applyState(data);
          auditSetHint("backup hersteld: " + naam2);
          touchEditTimer();
          await saveToGitHub();
          if(saveOkCount > opgeslagen2 && auditPushed === gelogd2){ auditHint = null; auditEvent("backup hersteld: " + naam2 + " (geen verschil met de planning die er al stond)"); }   // het opslaan lukte maar er was geen verschil: toch vastleggen
          renderAndSync();
          buildTemplateGrid();
          overlay.remove();
          showSaveStatus("ok");
        } else { alert("Ongeldige backup."); }
      }catch(e){ alert("Fout bij herstellen: "+e.message); }
      finally{ confirmBtn.textContent="Terugzetten"; confirmBtn.disabled=false; }
    };
  }catch(e){ alert("Fout: "+e.message); }
  finally{ btn.textContent="⟳ backup"; btn.disabled=false; }
});

// Ververs het rooster elke minuut (vandaag-markering) — wordt al gedaan door de GitHub sync interval

// ── Inactiviteit: na 10 minuten zonder gebruik altijd terug naar het hoofdscherm ──
const IDLE_HOME_MS = 10 * 60 * 1000;
let idleHandled = false;
function closeAllOverlays(){
  closeWhoMenu();
  document.querySelectorAll(".tp-overlay:not([data-gate]), .mo-inline-menu, #health-popup").forEach(el=>el.remove());
  try{ closePopup(); }catch(e){}
  try{ tplModal.style.display = "none"; tplFilter = null; }catch(e){}
}
function goHome(){
  closeAllOverlays();
  const now = new Date(), dow = now.getDay();
  const def = (dow === 0 || dow === 6) ? addWeeks(mondayOf(now), 1) : mondayOf(now);   // zelfde startweek als bij het openen (in het weekend: komende week)
  try{ sessionStorage.removeItem("tp_baseMonday"); }catch(e){}
  if(baseMonday.getTime() !== def.getTime()){ baseMonday = def; renderAndSync(); }
  const se = document.scrollingElement || document.documentElement;
  se.scrollTop = 0; document.body.scrollTop = 0;
}
function markActive(){
  const now = Date.now();
  if(!idleHandled && now - lastActivity >= IDLE_HOME_MS){ goHome(); }   // timers stonden stil (slaapstand/achtergrond): alsnog terug
  lastActivity = now; idleHandled = false;
}
["pointerdown","pointermove","keydown","wheel","touchstart","scroll","click"].forEach(t=>document.addEventListener(t, markActive, {capture:true, passive:true}));
setInterval(()=>{
  if(!idleHandled && Date.now() - lastActivity >= IDLE_HOME_MS){ idleHandled = true; goHome(); }
}, 10000);

// ── Bewerken uit na 10 minuten zonder wijziging (ook als timers stilstonden); je blijft ingelogd ──
setInterval(checkEditExpiry, 10000);
document.getElementById("compliment").addEventListener("animationiteration", complimentIteration);
setInterval(complimentSync, 3000); complimentSync();   // het compliment onder de legenda (de verjaardagsbanner voor iedereen, de rest voor Monitor en Hans)
setInterval(revalidateSession, 5 * 60 * 1000);   // een gereset wachtwoord beëindigt ook sessies op andere apparaten
// Vangnet: niet ingelogd = nooit iets van de planning zichtbaar; ingelogd = nooit een zwart scherm
setInterval(()=>{ if(currentIdentity) gateOff(); else gateOn(); }, 5000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkEditExpiry(); });
window.addEventListener("focus", checkEditExpiry);
window.addEventListener("pageshow", checkEditExpiry);

// Elk uur: vergelijk lokale staat met GitHub, merge onopgeslagen wijzigingen, herlaad dan
// Uurlijkse pagina-reload: simpelweg herladen, remote wint altijd via loadFromGitHub bij opstart
setInterval(()=>{ sessionStorage.setItem('tp_baseMonday',baseMonday.getTime()); markAutoReload(); location.reload(); }, 60 * 60 * 1000);
</script>
