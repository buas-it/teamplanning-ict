// ── Date helpers ─────────────────────────────────────────────────
const today = new Date(); today.setHours(0,0,0,0);
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=x.getDay()||7; x.setDate(x.getDate()-(day-1)); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addWeeks(d,n){ return addDays(d,n*7); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function getWeekNumber(date){ const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())); const dn=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dn); const y1=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d-y1)/86400000)+1)/7); }
function fmtDate(d){ return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"}); }

function serializeState(){
  const me={};
  Object.keys(manuallyEdited).forEach(k=>{ me[k]=[...manuallyEdited[k]]; });
  return {store, template, manuallyEdited:me, team:TEAM, hidden:[...HIDDEN]};
}
function applyState(data){
  if(data.team) TEAM = data.team.filter(p => p !== "__divider__");
  HIDDEN = new Set(Array.isArray(data.hidden) ? data.hidden.filter(n=>TEAM.includes(n)) : []);

  if(data.store) Object.keys(data.store).forEach(k=>{
    // Verwijder personen die niet meer in het team zitten
    const week = data.store[k];
    Object.keys(week).forEach(p=>{ if(!TEAM.includes(p)) delete week[p]; });
    store[k] = week;
  });

  if(data.template){
    // Verwijder personen die niet meer in het team zitten uit template
    Object.keys(data.template).forEach(p=>{
      if(!TEAM.includes(p)) return; // overgeslagen
      if(!template[p]){ template[p]={}; DAYS.forEach(d=>{ template[p][d]=[]; }); }
      Object.keys(data.template[p]).forEach(d=>{ template[p][d]=data.template[p][d]; });
    });
    // Verwijder ook uit template object zelf als al geladen
    Object.keys(template).forEach(p=>{ if(!TEAM.includes(p)) delete template[p]; });
  }

  if(data.manuallyEdited) Object.keys(data.manuallyEdited).forEach(k=>{
    // Filter ook manuallyEdited entries voor verwijderde personen
    manuallyEdited[k] = new Set((data.manuallyEdited[k]||[]).filter(e=>TEAM.includes(e.split("-")[0])));
  });

  // data-store tag blijft leeg — GitHub is de enige bron van waarheid
  document.dispatchEvent(new CustomEvent("tp-team-changed"));   // o.a. het inlogvenster ververst zijn namenlijst
}

// Toegang en bewerken zijn twee aparte dingen:
//  - Toegang: naam + wachtwoord (de toegangspoort). Daarna kun je alleen kijken. Je blijft ingelogd (ook na verversen of herstarten van de browser) tot je uitlogt of het wachtwoord waarmee je inlogde wordt gereset.

let _ghWriteTail = Promise.resolve();
let GH_WRITE_MAX_WAIT = 45000;   // een hangende verbinding houdt de rij hooguit zo lang vast
function ghWriteFetch(url, opts){
  const run = _ghWriteTail.then(()=>fetch(url, opts));
  let t; _ghWriteTail = Promise.race([run.then(()=>{}, ()=>{}), new Promise(r=>{ t = setTimeout(r, GH_WRITE_MAX_WAIT); })]).then(()=>clearTimeout(t));
  return run;
}
const GROUPS_PATH = "groups.json";
const RESTORE_GROUP = "een Administrator";   // alleen een Administrator mag een backup terugzetten

}

function canEditSettingsOf(naam){ return !!(currentIdentity && naam && (currentIdentity.user === naam || canToggleMessage())); }   // de boodschap-instellingen (aan/uit, campus, monitorfunctie, talen) van een account: dat account zelf, of een Administrator
function canEditGroups(){ return !!(currentIdentity && heeftBeheer(currentIdentity.user)); }
// ── Niet jezelf buitensluiten ──
// Een beheerder mag zichzelf niet buitensluiten: je naam moet in het team blijven (anders staat hij niet meer in het inlogscherm en kom je niet meer bij Admin),
// je blijft zelf lid van ICT-Systeembeheer (een collega kan dat wel veranderen) en ICT-Systeembeheer houdt altijd minstens één lid in het team.
function teamLockoutReason(newTeam, what){   // geeft een tekst als dit team de ingelogde gebruiker of ICT-Systeembeheer buitensluit, anders null
  if(!Array.isArray(newTeam)) return null;   // geen team in de data: het team verandert niet
  const t = newTeam.filter(n=>n!=="__divider__"), me = currentIdentity && currentIdentity.user;
  if(me && TEAM.includes(me) && !t.includes(me)){
    if(what === "rename") return "Je kunt je eigen naam niet wijzigen terwijl je bent ingelogd: je zou niet meer kunnen inloggen.";
    if(what === "restore") return "Deze backup bevat jou niet in het team. Als je hem terugzet, kun je niet meer inloggen en niet meer bij Admin komen. Kies een nieuwere backup.";
    return "Je kunt jezelf niet uit het team halen: je zou niet meer kunnen inloggen en niet meer bij Admin komen.";
  }
  const admins = ADMINISTRATORS.filter(n=>TEAM.includes(n));   // de Administrators die teamlid zijn
  if(groupsReady && admins.length && !admins.some(n=>t.includes(n))) return "De Administrators zouden dan geen lid meer in het team hebben.";
  return null;
}
function canSeeAdmin(){   // Admin (logboek, wachtwoorden, boodschap, backup, Info): alleen Administrators die teamlid zijn; zolang de rechten niet bekend zijn, niemand

  return !!(me && groupsReady && TEAM.includes(me) && heeftBeheer(me));

}

function backupLabel(bestand){ const m = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})/.exec(bestand); return m ? m[3] + "-" + m[2] + "-" + m[1] + " " + m[4] + ":" + m[5] : String(bestand).replace(".json", ""); }

async function restoreBackupTijd(bestand){   // het moment van de backup: de commit van het bestand (de bestandsnaam heeft een lokale tijd)

  const cr = await fetch(`https://api.github.com/repos/${GH_REPO}/commits?sha=${GH_BRANCH}&path=${encodeURIComponent(pad)}&until=${encodeURIComponent(tot)}&per_page=1&t=${Date.now()}`, { headers: hd });

  const d = await fr.json(); return JSON.parse(auditDecode(d.content));
}

async function restoreCollega(naam, bestand, delen){
  if(!canRestore()) return { error: "Alleen een Administrator kan een collega terugzetten naar een backup." };
  if(!editUnlocked) return { error: "Bewerken staat uit." };
  if(!TEAM.includes(naam) && naam !== "Monitor") return { error: "Onbekende collega." };
  if(!/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}\.json$/.test(bestand || "")) return { error: "Kies een backup." };
  const me = currentIdentity.user, uitkomst = [], label = backupLabel(bestand), isTeam = TEAM.includes(naam), opHeader = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
  let bk, tot, hs = null, hu = null;
  try{   // alles wat nodig is eerst ophalen: lukt dat niet, dan wordt er niets teruggezet (liever niets dan de helft)
    const br = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${bestand}?ref=${GH_BRANCH}&t=${Date.now()}`, { headers: opHeader });
    if(!br.ok) throw new Error("backup: HTTP " + br.status);
    bk = JSON.parse(auditDecode((await br.json()).content)); tot = await restoreBackupTijd(bestand);
    if(delen.boodschap) hs = await ghHistorisch("settings.json", tot);
    if(delen.wachtwoord) hu = await ghHistorisch("users.json", tot);
  }catch(e){ return { error: "De gegevens van de backup konden niet worden opgehaald (" + ((e && e.message) || e) + "). Er is niets teruggezet." }; }
  const inBackup = isTeam && Array.isArray(bk.team) && bk.team.includes(naam), planningDelen = isTeam && (delen.planning || delen.verborgen);
  if(planningDelen && inBackup){   // een veiligheidsbackup van de huidige planning, zodat dit terug te draaien is
    const pb = await maybeBackup(JSON.stringify(serializeState()), { always: true, force: true, label: "Backup voor terugzetten", who: " (" + naam + " naar " + label + ")", attempts: 3 });
    if(!(pb && pb.ok) && HEALTH.lastBackupErr !== "HTTP 422") return { error: "De veiligheidsbackup van de planning is niet gelukt (" + ((pb && pb.err) || "geen verbinding") + "). Er is niets teruggezet." };
  }
  const klaar = (deel, ok, tekst)=>uitkomst.push({ deel, ok, tekst });
  // 1. planning, werkweek en verborgen (één wijziging van de planning, die daarna zoals altijd wordt opgeslagen)
  if(isTeam && (delen.planning || delen.verborgen)){
    if(!inBackup){ if(delen.planning) klaar("planning", false, naam + " stond niet in die backup"); if(delen.verborgen) klaar("verborgen", false, naam + " stond niet in die backup"); }
    else{
      try{
        if(delen.planning){ herstelPlanningVan(naam, bk); klaar("planning", true, "planning en werkweek van " + label); }
        if(delen.verborgen){ if((bk.hidden || []).includes(naam)) HIDDEN.add(naam); else HIDDEN.delete(naam); klaar("verborgen", true, HIDDEN.has(naam) ? "verborgen" : "zichtbaar"); }
        saveState(); try{ renderAndSync(); }catch(e){}   // geen propagateTemplateToAll: dat zou ook de planning van andere personen aanraken
      }catch(e){ klaar("planning", false, "mislukt (" + ((e && e.message) || e) + ")"); }
    }
  }
  // 2. boodschap-instellingen en persoonlijke boodschappen
  if(delen.boodschap){
    try{ const r = await settingsRestoreCollega(naam, hs); if(r.error) klaar("boodschap", false, r.error); else klaar("boodschap", true, r.changed ? "boodschap-instellingen en persoonlijke boodschappen teruggezet" : "stond al zo"); }
    catch(e){ klaar("boodschap", false, "mislukt (" + ((e && e.message) || e) + ")"); }
  }
  // 3. wachtwoord (je eigen wachtwoord niet: dan sluit je jezelf buiten)
  if(delen.wachtwoord){
    if(naam === me) klaar("wachtwoord", false, "overgeslagen: je eigen wachtwoord zet ik niet terug (dan sluit je jezelf buiten)");
    else{
      try{
        const hist = hu && hu.users && typeof hu.users === "object" ? hu.users[naam] : undefined;
        const r = await usersMutate(u=>{ if(JSON.stringify(u[naam]) === JSON.stringify(hist)) return "stond al zo"; if(hist === undefined) delete u[naam]; else u[naam] = JSON.parse(JSON.stringify(hist)); return false; }, "Wachtwoord van " + naam + " teruggezet naar de stand van " + label + " (door " + me + ")");
        if(r.error === "stond al zo") klaar("wachtwoord", true, "stond al zo"); else if(r.error) klaar("wachtwoord", false, r.error); else klaar("wachtwoord", true, hist === undefined ? "terug naar het startwachtwoord (er was toen geen eigen wachtwoord)" : "wachtwoord van " + label);
      }catch(e){ klaar("wachtwoord", false, "mislukt (" + ((e && e.message) || e) + ")"); }
    }
  }
  const gelukt = uitkomst.filter(u=>u.ok).map(u=>u.deel);
  auditEvent("boodschap restore: " + naam + " ← backup " + bestand.replace(".json", "") + ": " + (gelukt.join(", ") || "niets") + (uitkomst.some(u=>!u.ok) ? " (niet gelukt: " + uitkomst.filter(u=>!u.ok).map(u=>u.deel).join(", ") + ")" : ""));
  return { ok: true, uitkomst };
}

const AUDIT_MAX_CHANGES = 200;

function auditEid(){
  const a = new Uint8Array(6);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for(let k=0;k<6;k++) a[k] = Math.floor(Math.random()*256);

function auditDecode(b64){
  const bin = atob(String(b64).replace(/\n/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);

// Vergelijk twee opgeslagen staten en geef de echte wijzigingen terug
function auditDiff(base, cur, hinted){
  const D5 = ["MA","DI","WO","DO","VR"];
  const same = (a,b)=>JSON.stringify(a||[]) === JSON.stringify(b||[]);
  const bTeam = (base.team||[]).filter(p=>p!=="__divider__"), cTeam = (cur.team||[]).filter(p=>p!=="__divider__");
  const both = cTeam.filter(p=>bTeam.includes(p));
  const team = [];
  cTeam.filter(p=>!bTeam.includes(p)).forEach(p=>team.push({s:"team+", p}));
  bTeam.filter(p=>!cTeam.includes(p)).forEach(p=>team.push({s:"team-", p}));
  const bTpl = base.template||{}, cTpl = cur.template||{};
  const tpl = [];
  both.forEach(p=>D5.forEach(d=>{ const a=(bTpl[p]||{})[d], b=(cTpl[p]||{})[d]; if(!same(a,b)) tpl.push({s:"standaard", p, d, from:a||[], to:b||[]}); }));
  const bStore = base.store||{}, cStore = cur.store||{};
  const cells = [];
  Object.keys(cStore).forEach(w=>{
    const bw = bStore[w] || {}, cw = cStore[w] || {};
    both.forEach(p=>D5.forEach(d=>{
      const b = (cw[p]||{})[d]; if(b === undefined) return;
      let a = (bw[p]||{})[d]; if(a === undefined) a = (bTpl[p]||{})[d];   // ontbrekende cel/week = standaardrooster
      if(!same(a,b)) cells.push({s:"cel", w, p, d, from:a||[], to:b||[]});
    }));
  });
  let changes, n;
  if(tpl.length && !hinted){ changes = [...team, ...tpl, {s:"doorgevoerd", n:cells.length}]; n = team.length + tpl.length; }   // standaardrooster: afgeleide cellen alleen tellen
  else { changes = [...team, ...tpl, ...cells]; n = team.length + tpl.length + cells.length; }
  return { n, trunc: changes.length > AUDIT_MAX_CHANGES, changes: changes.slice(0, AUDIT_MAX_CHANGES),
           action: tpl.length ? "standaard" : (team.length && !cells.length ? "team" : "wijziging") };
}

function auditAfterSave(snap){
  try{
    const base = auditBase;

    if(!base) return;
    const hint = (auditHint && Date.now() - auditHint.t < 60000) ? auditHint.text : null;
    auditHint = null;
    const diff = auditDiff(base, snap, !!hint);
    if(!diff.n) return;
    const who = auditWho || currentIdentity || null;
    auditQueue.push({
      v:1, eid: auditEid(), t: new Date().toISOString(),
      user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "",
      action: hint || diff.action, n: diff.n, trunc: diff.trunc, changes: diff.changes
    });
    auditPushed++;
    auditWho = null;
    auditPersist();
    auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

// Regels toevoegen aan audit/<dag>.jsonl (lezen, toevoegen, schrijven; bij conflict opnieuw)
async function auditAppend(day, entries){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/audit/${day}.jsonl`;
  const hdr = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
  for(let attempt=0; attempt<4; attempt++){
    let sha, text = "";
    const g = await fetch(url + `?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers: hdr});
    if(g.status === 200){ const d = await g.json(); sha = d.sha; text = auditDecode(d.content); }
    else if(g.status !== 404){ return false; }
    const have = new Set();
    text.split("\n").forEach(l=>{ if(!l.trim()) return; try{ have.add(JSON.parse(l).eid); }catch(e){} });
    let add = entries.filter(e=>!have.has(e.eid));
    // iemand zonder naam kan het logboek niet vullen: hooguit 3 regels 'niet ingelogd' per 10 minuten in het hele logboek (de rest wordt weggelaten)
    const bestaand = text.split("\n").filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } }).filter(e=>e && e.anon && Date.now() - Date.parse(e.t) < 10 * 60 * 1000);
    let ruimte = 3 - bestaand.filter(e=>!e.blok).length, ruimteBlok = 3 - bestaand.filter(e=>e.blok).length;   // een blokkade van een apparaat heeft een eigen, even kleine ruimte: die gaat niet verloren als de gewone regels 'niet ingelogd' de ruimte al hebben ingenomen
    add = add.filter(e=>{ if(!e.anon) return true; if(e.blok){ if(ruimteBlok > 0){ ruimteBlok--; return true; } return false; } if(ruimte > 0){ ruimte--; return true; } return false; });
    if(!add.length) return true;
    const newText = text + (text && !text.endsWith("\n") ? "\n" : "") + add.map(e=>JSON.stringify(e)).join("\n") + "\n";
    const body = {message: commitMessage("Audit " + day), content: encodeBase64(newText), branch: GH_BRANCH};
    if(sha) body.sha = sha;
    const p = await ghWriteFetch(url, {method:"PUT", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify(body)});
    if(p.ok) return true;
    if(p.status === 409 || p.status === 422) continue;   // iemand was ons voor: opnieuw lezen en nogmaals proberen
    return false;
  }
  return false;
}

async function auditFlush(){
  if(auditFlushing || !auditQueue.length){ updateAuditDot(); return; }
  auditFlushing = true; updateAuditDot();
  try{
    let guard = 0;
    while(auditQueue.length && guard++ < 10){
      const day = auditQueue[0].t.slice(0,10);
      const batch = auditQueue.filter(e=>e.t.slice(0,10) === day);
      const ok = await auditAppend(day, batch);
      auditLastOk = ok;
      if(!ok) break;
      const done = new Set(batch.map(e=>e.eid));
      auditQueue = auditQueue.filter(e=>!done.has(e.eid));
      auditPersist();
    }
  }catch(e){ auditLastOk = false; console.warn("audit flush fout:", e); }
  finally{ auditFlushing = false; updateAuditDot(); }
}

function updateAuditDot(){
  const el = document.getElementById("health-audit"); if(!el) return;

  else if(n > 0){ col = "#ffb74d"; title = "Audit: " + n + " in wachtrij"; }
  else if(auditLastOk === true){ col = "#4caf50"; title = "Audit: bijgewerkt (klik voor het logboek)"; }

// Toegang tot Admin: eerst inloggen, daarna alleen voor ICT-Systeembeheer en ICT-Management (ICT-Support, ICT-Monitoring en wie in geen groep zit hoeven Admin niet te zien)
async function ensureAdmin(opts){

}

// Logboek bekijken: laatste 14 dagen, filter op naam en machine (voor ICT-Systeembeheer en ICT-Management)
// ── Audit: opeenvolgende gewone wijzigingen van dezelfde persoon op hetzelfde apparaat tellen als één sessie (hooguit 10 minuten tussen de opslagen: zo lang blijft bewerken aan staan na de laatste wijziging) ──
const AUDIT_SESSIE_GAP = 10 * 60 * 1000;      // wijzigingen: zo lang blijft bewerken aan na de laatste wijziging
const AUDIT_BEZOEK_GAP = 30 * 60 * 1000;      // bezoeken: dezelfde grens als waarop 'terug op de site' wordt vastgelegd
const auditIsBezoek = a=>a === "ingelogd" || a === "site geopend" || /^terug op de site/.test(a || "");
function auditGroupSessions(rows){   // de regels om te tonen, nieuwste bovenaan: elke regel is een losse regel of een sessie met meerdere opslagen of keren openen
  const asc = [...rows].sort((a, b)=>Date.parse(a.t) - Date.parse(b.t)), open = {}, out = [];
  asc.forEach(e=>{
    const t = Date.parse(e.t), samen = e.action === "wijziging" && e.n > 0 && (e.changes || []).length && (e.changes || []).every(c=>c && c.s === "cel");   // alleen gewone celwijzigingen: Periode, standaardrooster, team en backups blijven op zichzelf staan
    if(auditIsBezoek(e.action) && e.user && e.user !== "(niet ingelogd)"){   // dezelfde persoon op hetzelfde apparaat die de site achter elkaar opent: één regel per periode van gebruik
      const bk = "b|" + e.user + "|" + (e.device || ""), bg = open[bk];
      if(bg && t - bg.last <= AUDIT_BEZOEK_GAP){ bg.saves.push(e); bg.last = t; }
      else { const nb = { soort: "bezoeken", saves: [e], last: t }; open[bk] = nb; out.push(nb); }
      return;
    }
    if(!samen){ out.push({ saves: [e], last: t }); return; }
    const key = "w|" + (e.user || "") + "|" + (e.device || ""), g = open[key];
    if(g && t - g.last <= AUDIT_SESSIE_GAP){ g.saves.push(e); g.last = t; }
    else { const ng = { soort: "wijzigingen", saves: [e], last: t }; open[key] = ng; out.push(ng); }
  });
  return out.sort((a, b)=>b.last - a.last);
}
function auditCellChains(saves){   // per cel de reeks waarden (van → … → naar), in de volgorde van de opslagen
  const m = new Map();
  saves.forEach(e=>(e.changes || []).forEach(c=>{ const k = c.w + "|" + c.p + "|" + c.d; if(!m.has(k)) m.set(k, { c, states: [c.from || []] }); m.get(k).states.push(c.to || []); }));
  return [...m.values()];
}

// ── Audit per dag; per gebruiker per dag één overzichtsregel; dagbestanden ouder dan een maand worden vanzelf opgeruimd ──
const AUDIT_VIEW_DAYS = 30, AUDIT_KEEP_DAYS = 31;   // het venster en Statistics kijken 30 dagen terug; de dagbestanden blijven 31 dagen (de dagbestanden gaan op UTC-datum)
function auditDayKey(ms){ const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function auditIsCelWijziging(e){ return e.action === "wijziging" && e.n > 0 && (e.changes || []).length && (e.changes || []).every(c=>c && c.s === "cel"); }
function auditUserDay(u){   // wat deze gebruiker die dag heeft gedaan, in een paar kerncijfers
  let bezoeken = 0, wijzigingen = 0, opslagen = 0, first = Infinity, last = -Infinity; const extra = {}, apparaten = new Map(), plain = [];
  u.groups.forEach(g=>g.saves.forEach(e=>{
    const t = Date.parse(e.t); if(t < first) first = t; if(t > last) last = t;
    apparaten.set(e.device || "?", (e.ws || "?") + " (" + (e.device || "?") + ")");
    if(auditIsBezoek(e.action) || /^site benaderd/.test(e.action || "")) bezoeken++;
    else if(auditIsCelWijziging(e)){ wijzigingen += e.n; opslagen++; plain.push(e); }
    else { const k = String(e.action || "?").split(":")[0].trim(); extra[k] = (extra[k] || 0) + 1; }
  }));
  plain.sort((a, b)=>Date.parse(a.t) - Date.parse(b.t));
  return { user: u.user, groups: u.groups, bezoeken, wijzigingen, opslagen, extra, first, last, apparaten: [...apparaten.values()], plain, pending: u.groups.some(g=>g.saves.some(e=>e.pending)) };
}
function auditDays(shown){   // de regels per dag (nieuwste dag eerst) en binnen een dag per gebruiker (laatst actief eerst)
  const dagen = new Map();
  shown.forEach(g=>{
    const dag = auditDayKey(g.last), user = g.saves[0].user || "onbekend";
    if(!dagen.has(dag)) dagen.set(dag, new Map());
    const per = dagen.get(dag); if(!per.has(user)) per.set(user, { user, groups: [] });
    per.get(user).groups.push(g);
  });
  return [...dagen.entries()].sort((a, b)=>b[0].localeCompare(a[0])).map(([dag, per])=>({ dag, users: [...per.values()].map(auditUserDay).sort((a, b)=>b.last - a.last) }));
}
async function auditCleanup(){   // dagbestanden van het logboek ouder dan 31 dagen verwijderen: hooguit 5 per keer, hooguit eens per 6 uur per apparaat, alleen door wie het logboek mag zien
  try{
    if(!canSeeAdmin()) return;
    const sleutel = "tp_audit_cleanup_t", laatst = parseInt(localStorage.getItem(sleutel) || "0");
    if(laatst && Date.now() - laatst < 6 * 3600 * 1000) return;
    localStorage.setItem(sleutel, String(Date.now()));
    const hdr = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
    const lr = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/audit?ref=${GH_BRANCH}&t=${Date.now()}`, {headers: hdr});
    if(!lr.ok) return;
    const grens = new Date(Date.now() - AUDIT_KEEP_DAYS * 86400000).toISOString().slice(0, 10);   // alles met een datum vóór deze dag is ouder dan 31 dagen
    const oud = (await lr.json()).filter(f=>f && /^\d{4}-\d\d-\d\d\.jsonl$/.test(f.name) && f.name.slice(0, 10) < grens).sort((a, b)=>a.name.localeCompare(b.name)).slice(0, 5);
    const weg = [];
    for(const f of oud){
      const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/audit/${f.name}`, { method: "DELETE", headers: {...hdr, "Content-Type": "application/json"}, body: JSON.stringify({ message: `Audit opgeruimd: ${f.name.slice(0, 10)} (ouder dan ${AUDIT_KEEP_DAYS} dagen)`, sha: f.sha, branch: GH_BRANCH }) });
      if(!r.ok){ localStorage.setItem(sleutel, String(Date.now() - 5 * 3600 * 1000)); break; }   // mislukt (bijv. een conflict): over een uur opnieuw, niet elke minuut
      weg.push(f.name.slice(0, 10));
    }
    if(weg.length) auditEvent("audit opgeruimd: " + weg.length + " dagbestand" + (weg.length === 1 ? "" : "en") + " ouder dan " + AUDIT_KEEP_DAYS + " dagen (" + weg[0] + (weg.length > 1 ? " t/m " + weg[weg.length - 1] : "") + ")");
  }catch(e){}
}

async function hashPassword(pw){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ── Persoonlijke wachtwoorden: per naam een salt + PBKDF2-hash in users.json op de data-branch ──
const USER_ITER = 210000, USERS_PATH = "users.json", PW_MIN = 10;
const EXTRA_LOGINS = ["Monitor"];   // mogen inloggen maar zijn geen teamlid: geen rij in de planning, niet in Systeembeheer of Support
const loginNames = () => TEAM.filter(n=>n!=="__divider__").concat(EXTRA_LOGINS.filter(n=>!TEAM.includes(n)));
async function usersLoad(){
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
  if(r.status === 404) return { users: {}, sha: null };       // nog nooit iemand een eigen wachtwoord ingesteld
  if(!r.ok) throw new Error("HTTP " + r.status);              // bij twijfel NIET terugvallen op het startwachtwoord
  const d = await r.json();
  const parsed = JSON.parse(auditDecode(d.content));
  return { users: (parsed && typeof parsed.users === "object" && parsed.users) || {}, sha: d.sha };
}
// Lezen, wijzigen, schrijven; bij een schrijfconflict opnieuw. mutator(users) wijzigt de lijst en geeft een tekst terug om te weigeren.
async function usersMutate(mutator, message){
  for(let i=0;i<4;i++){
    const cur = await usersLoad();
    const refuse = mutator(cur.users);
    if(refuse) return { error: refuse };
    const body = { message, content: encodeBase64(JSON.stringify({ v: 1, users: cur.users }, null, 1)), branch: GH_BRANCH };
    if(cur.sha) body.sha = cur.sha;
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}`, { method: "PUT", headers: {"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body: JSON.stringify(body) });
    if(r.ok) return { ok: true };
    if(r.status !== 409 && r.status !== 422) throw new Error("HTTP " + r.status);
  }
  throw new Error("conflict");
}
async function verifyUserPw(pw, rec){
  const got = await adminDerive(pw, b64d(rec.salt), rec.iter), want = b64d(rec.hash);
  let diff = got.length ^ want.length; for(let i=0;i<Math.min(got.length, want.length);i++) diff |= got[i] ^ want[i];
  return diff === 0;
}
async function newUserRecord(pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { salt: b64e(salt), hash: b64e(await adminDerive(pw, salt, USER_ITER)), iter: USER_ITER, set: new Date().toISOString() };
}

    auditQueue.push({ v: 1, eid: auditEid(), t: new Date().toISOString(), user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "", action, n: 0, trunc: false, changes: [], ...(anon ? { anon: true } : {}), ...(anon && opts.blok ? { blok: true } : {}) });
    auditPushed++;
    auditPersist(); auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

const AUTO_RELOAD_KEY = "tp_autoreload";

const OPENED_AUTO = (()=>{ try{ const t = parseInt(sessionStorage.getItem(AUTO_RELOAD_KEY) || "0"); sessionStorage.removeItem(AUTO_RELOAD_KEY); return !!t && Date.now() - t < 120000; }catch(e){ return false; } })();
function siteAccessAudit(){
  if(OPENED_AUTO) return;   // een automatisch herladen is geen nieuw bezoek
  try{
    if(currentIdentity){   // iemand opent de site (opnieuw) met een lopende inlog: nieuw tabblad, verversen, het scherm op de afdeling dat opnieuw start
      const last = parseInt(localStorage.getItem("tp_open_t") || "0");
      if(last && Date.now() - last < 2 * 60 * 1000) return;   // snel achter elkaar verversen: één regel
      localStorage.setItem("tp_open_t", String(Date.now()));
      auditEvent("site geopend");
    } else {   // de poort: pas na 1 minuut als er dan nog niet is ingelogd (wie inlogt staat al als 'ingelogd'; een bot die even langskomt schrijft niets)
      setTimeout(()=>{
        if(currentIdentity) return;

        localStorage.setItem("tp_gate_t", String(Date.now()));
        auditEvent("site benaderd, niet ingelogd", { anon: true });
      }, 60 * 1000);
    }
  }catch(e){}
}

      const input = box.querySelector("#pw-input"), error = box.querySelector("#pw-error"), userSel = box.querySelector("#pw-user");
      function fillNames(){

        const extra = EXTRA_LOGINS.filter(n=>!TEAM.includes(n));
        if(extra.length){ const g = document.createElement("optgroup"); g.label = "Overig (geen teamlid)"; extra.forEach(n=>{ const o = document.createElement("option"); o.value = n; o.textContent = n; g.appendChild(o); }); userSel.appendChild(g); }
        let pick = names.includes(cur) ? cur : (preUser || ""); if(!pick){ try{ pick = localStorage.getItem("tp_last_user") || ""; }catch(e){} }

        wrong();

      async function tryUnlock(){

      const n1 = box.querySelector("#pw-new1"), n2 = box.querySelector("#pw-new2"), error = box.querySelector("#pw-error"), okBtn = box.querySelector("#pw-ok");
      async function save(){
        const prob = pwProblem(n1.value, n2.value); if(prob){ error.textContent = prob; return; }

          const rec = await newUserRecord(n1.value);

async function administratorsWijzig(actie, naam){   // een Administrator toevoegen of weghalen: alleen een Administrator (volgens de nieuwste indeling), en er blijft altijd minstens één over

async function loadFromGitHub(usePrefetch=false){
  try{
    // Gebruik prefetch-promise als die nog loopt (eerste load), anders nieuw verzoek
    const r = await (usePrefetch ? _prefetchState : fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
    ));
    if(!r.ok){ console.warn("GitHub laden HTTP:", r.status); return false; }
    const d = await r.json();
    ghSha = d.sha;
    const text = atob(d.content.replace(/\n/g,""));
    const data = JSON.parse(text);
    if(data && data.store && data.team && data.team.length > 0){
      HEALTH.github = "ok"; HEALTH.data = "ok";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      applyState(data); auditRebase(); return true;
    } else {
      HEALTH.github = "ok"; HEALTH.data = "error";
      updateHealthBar();
      console.warn("GitHub: state leeg of ongeldig, wordt genegeerd");
    }
  }catch(e){
    HEALTH.github = "error";
    updateHealthBar();
    console.warn("GitHub laden mislukt:", e);
  }
  return false;
}

// Helper: encode JSON naar base64 (unicode-safe)
function encodeBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

// Helper: PUT een bestand naar GitHub (maakt aan of overschrijft)
async function ghPut(path, content, message){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
  let sha = undefined;
  try{
    const r = await fetch(url + `?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(r.ok){ const d = await r.json(); sha = d.sha; }
  }catch(e){}
  const body = {message, content, branch: GH_BRANCH, ...(sha ? {sha} : {})};
  return ghWriteFetch(url, {method:"PUT", headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body:JSON.stringify(body)});
}

// Backup elke 10 minuten na een wijziging (maximaal 14 dagen bewaard)
let lastBackupJson = null;   // staat bij de laatste GESLAAGDE backup
let lastBackupTime = 0;      // tijdstip van de laatste geslaagde backup
let backupBusy = false;      // er loopt een backup (die zichzelf herhaalt bij een conflict)
let backupPending = null;    // de laatste poging is mislukt: elke minuut opnieuw proberen tot het lukt
const BACKUP_INTERVAL = 10 * 60 * 1000; // 10 minuten
const BACKUP_RETRY_STATUS = [409, 422, 500, 502, 503, 504];   // conflict of storing: opnieuw; een andere fout (bijv. geen rechten) niet blijven proberen

async function maybeBackup(stateJson, opts = {}){
  // opts.force: de 10-minutenregel overslaan; opts.always: ook als er niets is gewijzigd (handmatig); opts.label/who: commitbericht; opts.attempts: aantal pogingen
  const now = Date.now();
  if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                     // niets gewijzigd sinds de laatste geslaagde backup
  if(!opts.force && !opts.always && now - lastBackupTime < BACKUP_INTERVAL && !backupPending) return null;   // nog geen 10 min (een mislukte backup wacht daar niet op)
  if(backupBusy){
    if(!opts.force && !opts.always){ backupPending = stateJson; return null; }                       // er loopt er al een
    for(let i = 0; i < 150 && backupBusy; i++) await new Promise(r=>setTimeout(r, 200));              // een gevraagde backup wacht op de lopende
    if(backupBusy){ backupPending = stateJson; return null; }
    if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                   // de lopende backup bevatte al precies deze staat
  }
  backupBusy = true;
  const now_dt = new Date();
  const date = now_dt.toISOString().slice(0,10);
  const time = now_dt.toTimeString().slice(0,5).replace(":","-");
  const filename = `${date}_${time}`;
  const content = encodeBase64(stateJson);
  const message = opts.label ? `${opts.label} ${filename}${opts.who || ""}` : `Auto-backup ${filename}`;
  let res = null;
  try{
    for(let poging = 0; poging < (opts.attempts || 4); poging++){   // GitHub weigert schrijfacties die tegelijk binnenkomen (409): even wachten en nogmaals
      if(poging) await new Promise(r=>setTimeout(r, 1500 * poging + Math.random() * 1000));
      res = await ghPut(`backups/${filename}.json`, content, message).catch(()=>null);
      if(res && res.ok) break;
      if(res && !BACKUP_RETRY_STATUS.includes(res.status)) break;
    }
    if(res && res.ok){
      lastBackupJson = stateJson; lastBackupTime = Date.now(); backupPending = null;
      HEALTH.lastBackup = lastBackupTime; HEALTH.lastBackupOk = true; HEALTH.lastBackupErr = null;
      HEALTH.lastBackupLabel = now_dt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+
                               now_dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    } else {
      backupPending = stateJson;   // niet als gedaan markeren: de volgende minuut opnieuw
      HEALTH.lastBackupOk = false; HEALTH.lastBackupErr = res ? "HTTP " + res.status : "geen verbinding";
    }
  }finally{ backupBusy = false; }
  updateHealthBar();
  const result = (res && res.ok) ? { ok: true, filename } : { ok: false, err: HEALTH.lastBackupErr };
  if(!result.ok) return result;
  // Verwijder backups ouder dan 14 dagen: op de achtergrond, hooguit 5 per keer (zodat het opslaan niet wordt opgehouden) en netjes achter elkaar
  try{
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14);
    const cut = cutoff.toISOString().slice(0,10);
    const listR = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(listR.ok){
      const files = await listR.json();
      files.filter(f=>f.name.replace(".json","").slice(0,10) < cut).slice(0, 5).forEach(f=>{
        const d = f.name.replace(".json","").slice(0,10); // YYYY-MM-DD prefix
        ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${f.name}`, {
          method:"DELETE",
          headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
          body: JSON.stringify({message:`Verwijder oude backup ${d}`, sha: f.sha, branch: GH_BRANCH})
        }).catch(()=>{});
      });
    }
  }catch(e){}
  return result;
}
// Wat nog op opslaan wacht eerst wegschrijven (maximaal ~15 s)
async function flushPendingSave(){
  for(let i = 0; i < 60 && (ghSaving || savePending); i++){
    if(savePending && !ghSaving){ clearTimeout(ghSaveTimer); await saveToGitHub(); }
    else await new Promise(r=>setTimeout(r, 250));
  }
}
// Bewerken is uitgegaan (met de hand, na 10 minuten zonder wijziging, of door uitloggen) en er is gewijzigd: alles opslaan en een backup van precies die staat
async function endOfEditBackup(who){
  try{
    await flushPendingSave();
    if(lastSavedJson) await maybeBackup(lastSavedJson, { force: true, label: "Backup na bewerken", who });
  }catch(e){ console.warn("backup na bewerken mislukt:", e); }
}
// Admin > Backup maken: een kopie van de planning zoals die nu op GitHub staat (bewerken hoeft niet aan te staan: een backup wijzigt niets)
async function makeManualBackup(){
  if(!await ensureAdmin()) return;
  adminNotice("Backup wordt gemaakt …", "💾 Backup maken");
  let json = null;
  try{
    await flushPendingSave();
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(r.ok){ const d = await r.json(); if(d && d.content){ const txt = auditDecode(d.content); JSON.parse(txt); json = txt; } }
  }catch(e){}
  if(!json) json = lastSavedJson || JSON.stringify(serializeState());   // lukt het ophalen niet: de staat in deze pagina
  const res = await maybeBackup(json, { always: true, force: true, label: "Handmatige backup", who: commitMessage(""), attempts: 3 });
  if(res && res.ok){ adminNotice("✓ Backup gemaakt: " + res.filename.replace("_", " "), "💾 Backup maken"); auditEvent("backup gemaakt (handmatig): " + res.filename); }
  else adminNotice("✗ Backup mislukt" + (res && res.err ? " (" + res.err + ")" : "") + ". Probeer het zo opnieuw.", "💾 Backup maken");
}
function retryPendingBackup(){ if(backupPending && !backupBusy){ try{ maybeBackup(JSON.stringify(serializeState())); }catch(e){} } }   // een mislukte backup wordt elke minuut opnieuw geprobeerd, met de actuele staat
setInterval(retryPendingBackup, 60 * 1000);

async function saveToGitHub(){
  if(ghSaving) return;
  ghSaving = true; savePending = false;
  try{
    // Haal altijd eerst de actuele SHA op om conflicts te voorkomen
    const check = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2), {
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}
    });
    if(check.ok){ const cd = await check.json(); ghSha = cd.sha; }

    const json = JSON.stringify(serializeState());
    const content = encodeBase64(json);

    const body = {message:commitMessage("Update planning"), content, sha: ghSha, branch: GH_BRANCH};
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      method:"PUT",
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify(body)
    });
    if(r.ok){
      const d = await r.json();
      ghSha = d.content.sha;
      HEALTH.github = "ok"; HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      showSaveStatus("ok");
      // Prefetch SHA alvast voor volgende save (tijdens rustige periode)
      setTimeout(async ()=>{
        if(!ghSaving){
          try{
            const pre = await fetch(
              `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
              {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
            );
            if(pre.ok){ const pd = await pre.json(); ghSha = pd.sha; }
          }catch(e){}
        }
      }, 2000);
      // Backup (silent, na succesvolle save)
      lastSavedJson = json; saveOkCount++;
      maybeBackup(json);
      auditAfterSave(JSON.parse(json));   // audit: wat is er veranderd, door wie
    } else {
      const err = await r.json().catch(()=>({}));
      const msg = err.message || err.errors?.[0]?.message || r.status;
      console.error("GitHub opslaan mislukt:", r.status, msg);
      HEALTH.github = r.status === 401 || r.status === 403 ? "error" : "warn";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = false;
      updateHealthBar();
      // Bij 409 conflict: SHA ophalen en opnieuw proberen
      if(r.status === 409){
        console.warn("SHA conflict, opnieuw proberen...");
        ghSha = null; savePending = true;
        ghSaveTimer = setTimeout(saveToGitHub, 2000);
      } else {
        showSaveStatus("error: "+msg);
      }
    }
  }catch(e){
    console.warn("GitHub opslaan fout:", e);
    showSaveStatus("error");
  } finally {
    ghSaving = false;
  }
}

function showSaveStatus(state){
  const ind=document.getElementById("save-ind"); if(!ind) return;
  if(state==="ok"){
    ind.textContent="✓ opgeslagen"; ind.style.color="#80cbc4";
    ind.style.opacity="1";
    clearTimeout(ind._t);
    ind._t=setTimeout(()=>{ ind.style.opacity="0"; },3000);
    // Verberg foutbanner als die nog zichtbaar is
    hideSyncErrorBanner();
  } else if(state==="error"||state.startsWith("error:")){
    const msg = state.startsWith("error:") ? state.slice(6).trim() : "";
    ind.textContent="✗ mislukt"; ind.style.color="#f48fb1";
    ind.style.opacity="1";
    clearTimeout(ind._t);
    // Toon prominente foutbanner
    showSyncErrorBanner(msg);
  } else {
    ind.textContent="⟳ "+state; ind.style.color="#ffb74d";
    ind.style.opacity="1";
    clearTimeout(ind._t);
  }
}

function showSyncErrorBanner(detail){
  let banner = document.getElementById("sync-error-banner");
  if(!banner){
    banner = document.createElement("div");
    banner.id = "sync-error-banner";
    document.body.appendChild(banner);
  }
  banner.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <span style="font-size:20px;">⚠️</span>
      <div>
        <div style="font-weight:700;font-size:13px;">Opslaan mislukt — wijzigingen zijn NIET bewaard</div>
        <div style="font-size:11px;opacity:0.8;margin-top:2px;">
          ${detail ? "Fout: "+detail+" · " : ""}Ververs de pagina of probeer opnieuw.
        </div>
      </div>
      <button onclick="saveToGitHub().then(()=>{}).catch(()=>{})" style="margin-left:auto;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;">↺ Opnieuw</button>
      <button onclick="hideSyncErrorBanner()" style="background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;padding:0 4px;">✕</button>
    </div>`;
  banner.style.cssText = `
    position:fixed;bottom:0;left:0;right:0;z-index:900;
    background:linear-gradient(135deg,#b71c1c,#c62828);
    color:#fff;padding:14px 20px;
    box-shadow:0 -4px 24px rgba(183,28,28,0.6);
    font-family:'Courier New',monospace;
    animation:slideUp 0.3s ease;
  `;
  // Voeg animatie toe als die nog niet bestaat
  if(!document.getElementById("sync-error-style")){
    const style = document.createElement("style");
    style.id = "sync-error-style";
    style.textContent = "@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}";
    document.head.appendChild(style);
  }
}

function hideSyncErrorBanner(){
  const b = document.getElementById("sync-error-banner");
  if(b) b.remove();
}

const HEALTH = { github: "unknown", data: "unknown", lastSync: null, lastSyncOk: false, lastBackup: null, lastBackupOk: false, lastBackupLabel: null, lastBackupErr: null };

function updateHealthBar(){
  const el = {
    github: document.getElementById("health-github"),
    data:   document.getElementById("health-data"),
    sync:   document.getElementById("health-sync"),
    detail: document.getElementById("health-detail"),
  };
  if(!el.github) return;
  updateAuditDot();

  function dot(state){ return state==="ok"?"#4caf50": state==="warn"?"#ffb74d": state==="error"?"#e53935":"rgba(255,255,255,0.2)"; }

  // GitHub bereikbaarheid
  el.github.style.color = dot(HEALTH.github);
  el.github.title = HEALTH.github==="ok" ? "GitHub: verbonden" : HEALTH.github==="error" ? "GitHub: niet bereikbaar" : "GitHub: onbekend";

  // Data integriteit
  el.data.style.color = dot(HEALTH.data);
  el.data.title = HEALTH.data==="ok" ? "Data: geldig" : HEALTH.data==="error" ? "Data: leeg of ongeldig!" : "Data: onbekend";

  // Sync timing
  if(HEALTH.lastSync){
    const secAgo = Math.round((Date.now()-HEALTH.lastSync)/1000);
    const syncState = HEALTH.lastSyncOk ? (secAgo < 120 ? "ok" : "warn") : "error";
    el.sync.style.color = dot(syncState);
    const ago = secAgo < 60 ? secAgo+"s" : Math.round(secAgo/60)+"m";
    el.sync.title = (HEALTH.lastSyncOk ? "Sync OK" : "Sync mislukt") + " — "+ago+" geleden";
    el.detail.textContent = (HEALTH.lastSyncOk ? "sync ✓ " : "sync ✗ ") + ago+" geleden";
  } else {
    el.sync.style.color = dot("unknown");
    el.sync.title = "Nog niet gesynchroniseerd";
    el.detail.textContent = "";
  }

  // Backup timing
  const elBackup = document.getElementById("health-backup");
  if(elBackup){
    if(HEALTH.lastBackup){
      const bSecAgo = Math.round((Date.now()-HEALTH.lastBackup)/1000);
      const bState = HEALTH.lastBackupOk ? (bSecAgo < 20*60 ? "ok" : "warn") : "error";
      elBackup.style.color = dot(bState);
      const bLabel = HEALTH.lastBackupLabel || (() => {
        const bDt = new Date(HEALTH.lastBackup);
        return bDt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+
               bDt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
      })();
      elBackup.title = HEALTH.lastBackupOk ? `Backup OK — ${bLabel} (klik voor inhoud)` : `Laatste backup mislukt${HEALTH.lastBackupErr ? " (" + HEALTH.lastBackupErr + ")" : ""}; er wordt opnieuw geprobeerd. Laatste geslaagde backup: ${bLabel} (klik voor inhoud)`;
      el.detail.textContent += HEALTH.lastBackupOk ? "  backup ✓ " + bLabel : "  backup ✗ (laatste geslaagd: " + bLabel + ")";
      elBackup.style.cursor = "pointer";
      elBackup.onclick = ()=>showBackupContents();
    } else if(backupPending || HEALTH.lastBackupErr){   // een poging is mislukt en er is nog geen eerdere backup bekend: dat niet verstoppen achter "nog geen backup"
      elBackup.style.color = dot("error");
      elBackup.title = `Laatste backup mislukt${HEALTH.lastBackupErr ? " (" + HEALTH.lastBackupErr + ")" : ""}; er wordt opnieuw geprobeerd. Nog geen geslaagde backup bekend (klik voor inhoud)`;
      el.detail.textContent += "  backup ✗ (nog geen geslaagde)";
    } else {
      elBackup.style.color = dot("unknown");
      elBackup.title = "Nog geen backup gemaakt";
      el.detail.textContent += "  backup: nog geen";
    }
    // Klik op backup-bolletje
    if(elBackup && !elBackup._clickSet){
      elBackup._clickSet = true;
      elBackup.style.cursor = "pointer";
      elBackup.onclick = ()=>showBackupContents();
    }

  // Klik op GitHub bolletje
  const elGh = document.getElementById("health-github");
  if(elGh && !elGh._clickSet){
    elGh._clickSet = true; elGh.style.cursor = "pointer";
    elGh.onclick = ()=>showHealthPopup("GitHub verbinding",
      HEALTH.github==="ok" ? ["✅ Verbonden met GitHub API","📡 Repo: buas-it/teamplanning-ict","🔑 Token: actief"] :
      ["❌ Niet bereikbaar","📡 Repo: buas-it/teamplanning-ict","⚠️ Controleer internetverbinding"]);
  }

  // Klik op Data bolletje
  const elDt = document.getElementById("health-data");
  if(elDt && !elDt._clickSet){
    elDt._clickSet = true; elDt.style.cursor = "pointer";
    elDt.onclick = ()=>{
      const weken = Object.keys(store||{}).length;
      const teamleden = (TEAM||[]).length;
      showHealthPopup("Data integriteit",
        HEALTH.data==="ok"
          ? [`✅ Data geldig`,`👥 Team: ${teamleden} leden (${(TEAM||[]).join(", ")})`,`📅 Weken geladen: ${weken}`,`📍 Eerste week: ${Object.keys(store||{}).sort()[0]||"-"}`,`📍 Laatste week: ${Object.keys(store||{}).sort().slice(-1)[0]||"-"}`]
          : ["❌ Data leeg of ongeldig","⚠️ Kan geen data laden van GitHub"]);
    };
  }

  // Klik op Sync bolletje
  const elSync = document.getElementById("health-sync");
  if(elSync && !elSync._clickSet){
    elSync._clickSet = true; elSync.style.cursor = "pointer";
    elSync.onclick = ()=>{
      const secAgo = HEALTH.lastSync ? Math.round((Date.now()-HEALTH.lastSync)/1000) : null;
      const ago = secAgo===null ? "nog nooit" : secAgo < 60 ? secAgo+"s geleden" : Math.round(secAgo/60)+"m geleden";
      const syncTime = HEALTH.lastSync ? new Date(HEALTH.lastSync).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) : "-";
      showHealthPopup("Synchronisatie",
        secAgo!==null
          ? [HEALTH.lastSyncOk ? `✅ Laatste sync: ${ago}` : `❌ Sync mislukt: ${ago}`,`🕐 Tijdstip: ${syncTime}`,`🔄 Interval: elke 60 seconden`,`☁️ Bron: GitHub (remote wint altijd)`]
          : ["⏳ Nog niet gesynchroniseerd","🔄 Interval: elke 60 seconden"]);
    };
  }
  }
  try{ updateBadgeHealth(); }catch(e){}
}

// Laad laatste backup-tijd — gebruik prefetch-resultaat
_prefetchBackupList.then(async r=>{
  if(!r.ok) return;
  const files = await r.json();
  if(!Array.isArray(files) || !files.length) return;
  const newest = files.filter(f=>f.name.endsWith(".json"))
                      .sort((a,b)=>b.name.localeCompare(a.name))[0];
  if(!newest) return;
  // Gebruik bestandsnaam direct als leesbare string, geen Date-parsing
  const raw = newest.name.replace(".json",""); // "2026-07-13_12-30" of "2026-07-13"
  const label = raw.length >= 16
    ? raw.slice(8,10)+"-"+raw.slice(5,7)+" "+raw.slice(11,16).replace("-",":")
    : raw.slice(8,10)+"-"+raw.slice(5,7);

function weekKey(monday){ return `${monday.getFullYear()}-W${String(getWeekNumber(monday)).padStart(2,"0")}`; }
function getMondayFromKey(key){
  // key = "2026-W29" → find the monday of that ISO week
  const [yr, wStr] = key.split("-W");
  const year = parseInt(yr), week = parseInt(wStr);
  // Jan 4 is always in week 1
  const jan4 = new Date(year, 0, 4);
  const jan4Dow = jan4.getDay()||7;
  const week1Mon = new Date(jan4.getTime() - (jan4Dow-1)*86400000);
  return new Date(week1Mon.getTime() + (week-1)*7*86400000);
}
function weekMondayFromKey(k){ const [yr,wPart]=k.split("-W"); const wk=parseInt(wPart); const jan1=new Date(parseInt(yr),0,1); const j=jan1.getDay()||7; const m=new Date(jan1); m.setDate(jan1.getDate()+(wk-1)*7-(j-1)); return m; }

function getData(monday){
  const k=weekKey(monday);

      store[k][p]={};
      DAYS.forEach(d=>{ store[k][p][d]=[...(template[p][d]||[])]; });

function toggleStatus(monday,person,day,key,isTemplate){
  if(isTemplate && !canEditTemplate(person)) return;   // een standaardbezetting van een ander mag alleen ICT-Systeembeheer aanpassen
  if(!isTemplate){
    const lockKey = weekKey(monday)+"-"+day;
    if(LOCKED_DAYS.has(lockKey)){
      return; // Feestdag — niet bewerkbaar
    }
  }
  if(isTemplate){
    const cur=template[person][day];
    template[person][day]=cur.includes(key)?cur.filter(k=>k!==key):[...cur,key];
    pushTemplateCell(person,day);
    saveState();
    const _p=person,_d=day;
    render();
    requestAnimationFrame(()=>{
      syncNameSpacer();
      if(document.getElementById("tpl-modal").style.display!=="none"){
        buildTemplateGrid();
        const newCell=document.getElementById(cellId("TPL",_p,_d));
        if(newCell) showPopup(newCell.parentElement,null,_p,_d,true);
      }
    });
  } else {
    const k=weekKey(monday);
    if(!manuallyEdited[k]) manuallyEdited[k]=new Set();
    manuallyEdited[k].add(person+"-"+day);
    const data=getData(monday);
    if(!data[person]) data[person]={};
    const cur=data[person][day]||[];
    // Multiselect met constraints:
    // - vrij sluit vm_vrij en nm_vrij uit (en andersom)
    let next;
    if(cur.includes(key)){
      next=cur.filter(k2=>k2!==key); // uitzetten
    } else {
      // ── Constraints ──────────────────────────────────────────────────
      const HELE_DAG  = ["kantoor","thuis","vrij","ziek","ziek_thuis","extern"];
      const HALVE_VM  = ["vm_kantoor","vm_thuis","vm_vrij","vm_extern"];
      const HALVE_NM  = ["nm_kantoor","nm_thuis","nm_vrij","nm_extern"];
      const HALVE_DAG = [...HALVE_VM,...HALVE_NM];

      // 1. Hele-dag status: verwijdert ALLE andere hele-dag én alle halve-dag
      if(HELE_DAG.includes(key)){
        next = [key];
      }
      // 2. Halve-dag: verwijder alle hele-dag statussen
      else {
        next = [...cur, key].filter(k2=>!HELE_DAG.includes(k2));
        // Verwijder dubbele
        next = [...new Set(next)];
        // Ochtend: slechts één ochtend-status tegelijk
        if(HALVE_VM.includes(key)) next = next.filter(k2=>!HALVE_VM.includes(k2)||k2===key);
        // Middag: slechts één middag-status tegelijk
        if(HALVE_NM.includes(key)) next = next.filter(k2=>!HALVE_NM.includes(k2)||k2===key);
        // vm+nm van zelfde soort → hele dag
        if(next.includes("vm_kantoor")&&next.includes("nm_kantoor")){ next=["kantoor"]; }
        else if(next.includes("vm_thuis")&&next.includes("nm_thuis")){ next=["thuis"]; }
        // extern halve dag sluit andere dagdeel vm/nm extern uit
        if(key==="vm_extern") next=next.filter(k2=>k2!=="nm_extern");
        if(key==="nm_extern") next=next.filter(k2=>k2!=="vm_extern");
      }
    }
    data[person][day]=next;
    saveState();
  }
}

function startAutoUpdate(){   // de melding toont een aftelling en ververst daarna vanzelf; de knop 'Nu verversen' kan altijd eerder
  showUpdateBanner(); if(updateTimer) return;
  let rest = AUTO_UPDATE_SECONDS;
  const tik = ()=>{
    if(reloadBlockedHard()){ setUpdateText("🔄 Er is een nieuwe versie · ververst zodra je klaar bent met wat je nu doet"); rest = AUTO_UPDATE_SECONDS; return; }   // de aftelling begint opnieuw zodra dat kan
    if(rest > 0){ setUpdateText("🔄 Er is een nieuwe versie · ververst over " + rest + " s"); rest--; return; }
    clearInterval(updateTimer); updateTimer = null; reloadNow();
  };
  tik(); updateTimer = setInterval(tik, 1000);
}
async function checkForNewVersion(){
  try{
    if(location.protocol === "file:" || !RUNNING_VERSION) return;
    const r = await fetch("index.html?v=" + Date.now() + "&r=" + Math.random().toString(36).slice(2), { cache: "no-store" });
    if(!r.ok) return;
    const m = (await r.text()).match(/id="app-version"[^>]*>\s*(versie [^<]+?)\s*</);
    if(!m) return;
    const banner = document.getElementById("update-banner");
    if(m[1].trim() === RUNNING_VERSION){ if(banner || updateTimer) stopAutoUpdate(); return; }
    if(safeToReload()) reloadNow(); else startAutoUpdate();   // niet zomaar veilig: een melding met een aftelling, en daarna ververst de pagina vanzelf (behalve midden in opslaan of ingetypte tekst)
  }catch(e){}
}

// Laad staat: GitHub heeft prioriteit, dan localStorage, dan data-store tag
(async ()=>{
  // Verberg grid tot state geladen is (voorkomt flikkering met oude namen)
  const mainGrid = document.getElementById("main-grid");
  if(mainGrid) mainGrid.style.visibility = "hidden";
  setTimeout(()=>{ const l = document.getElementById("legend"); if(l && l.style.visibility === "hidden") l.style.visibility = "visible"; }, 15000);   // vangnet: gaat er bij het laden iets mis, dan blijft de legenda niet eeuwig verborgen
  const ghLoaded = await loadFromGitHub(true); // gebruik prefetch
  if(!ghLoaded){
    // Geen localStorage fallback — GitHub is de enige bron van waarheid
    // Verwijder eventuele oude localStorage data
    try{
      const keep = {};
      ["tp_device","tp_ws","tp_audit_queue","tp_last_user","tp_unlocked","tp_user","tp_pwtries"].forEach(k=>{ const v = localStorage.getItem(k); if(v !== null) keep[k] = v; });
      localStorage.clear();
      Object.keys(keep).forEach(k=>localStorage.setItem(k, keep[k]));
    }catch(e){}
  }
  firstLoadSettled = true; document.dispatchEvent(new CustomEvent("tp-team-changed"));   // eerste laadpoging klaar: het inlogvenster mag de namen tonen
  TEAM = TEAM.filter(p => p !== "__divider__");
  propagateTemplateToAll();
  renderAndSync();
  auditRebase();                 // audit: automatische doorvoering van het standaardrooster bij laden telt niet als gebruikerswijziging
  if(ghLoaded) auditFlush();     // eventuele eerder niet-geüploade regels alsnog wegschrijven
  // Toon grid nu state geladen is
  if(mainGrid) mainGrid.style.visibility = "visible";
  const legendaEl = document.getElementById("legend"); if(legendaEl) legendaEl.style.visibility = "visible";   // de legenda komt tegelijk met het hoofdvenster in beeld
  setInterval(hdCheck, 3000);   // een medewerker met een halve dag vrij zonder invulling krijgt bij het openen de vraag dit in te vullen
  // Achtergrond-sync: herlaad van GitHub elke 60 seconden, en meteen als je terugkomt op het tabblad of in de app (timers staan stil zolang een tabblad op de achtergrond staat of de telefoon slaapt)
  let syncBusy = false, lastSyncRun = 0;
  async function backgroundSync(){
    if(syncBusy) return; syncBusy = true; lastSyncRun = Date.now();
    try{
      groupsLoad(); settingsLoad();   // groepen en instellingen elke minuut verversen
      if(ghSaving || savePending) return;   // er wordt net opgeslagen of er wacht een wijziging: die niet overschrijven
      const beforeJson = JSON.stringify(serializeState());
      const loaded = await loadFromGitHub();
      if(loaded && JSON.stringify(serializeState()) !== beforeJson){
        renderAndSync();
      }
      auditFlush();   // audit: wachtrij opnieuw proberen
      checkForNewVersion();
      auditCleanup();   // oude dagbestanden van het logboek opruimen (hooguit eens per 6 uur, alleen voor wie Admin heeft)
    }finally{ syncBusy = false; }
  }
  setInterval(backgroundSync, 60000);
  const wake = ()=>{ if(!document.hidden && Date.now() - lastSyncRun > 10000) backgroundSync(); };   // hooguit eens per 10 seconden
  document.addEventListener("visibilitychange", wake); window.addEventListener("focus", wake); window.addEventListener("pageshow", wake); window.addEventListener("online", wake);
  setTimeout(checkForNewVersion, 5000);   // een pagina die uit de cache kwam, is binnen enkele seconden bij
})();

async function showPopup(cellWrap,monday,person,day,isTemplate){
  if(!isTemplate && LOCKED_DAYS.has(weekKey(monday)+"-"+day)) return; // Feestdag
  if(!await requireUnlock()) return;
  closePopup();
  const popup=document.createElement("div"); popup.className="popup";
  const title=document.createElement("div"); title.className="popup-title";
  title.textContent=(isTemplate?"★ Werkweek · ":"")+person+" · "+DAY_LABELS[day];
  popup.appendChild(title);
  addWinX(popup, closePopup, "popup-close", { small:true, keepPosition:true });   // alleen een kruis rechtsboven in het venster
  function renderItems(){
    popup.querySelectorAll(".popup-item").forEach(e=>e.remove());
    const sel=isTemplate?(template[person][day]||[]):(getData(monday)[person][day]||[]);
    let lastGroup=null;
    STATUSES.forEach(s=>{
      // Scheidingslijn tussen groepen
      if(s.group!==lastGroup){
        if(lastGroup!==null){
          const div=document.createElement("div");
          div.style.cssText="height:1px;background:rgba(255,255,255,0.1);margin:4px 6px;";
          popup.appendChild(div);
        }
        lastGroup=s.group;
      }
      const active=sel.includes(s.key);
      const item=document.createElement("div"); item.className="popup-item";
      if(active){ item.style.background=s.color+"22"; item.style.border=`1px solid ${s.border}66`; }
      item.innerHTML=`<div class="popup-dot" style="background:${active?s.color:"rgba(255,255,255,0.1)"};${active?`box-shadow:0 0 6px ${s.color}88`:""}"></div><span class="popup-label" style="color:${active?"#fff":"#888"}">${s.label}</span>${active?`<span class="popup-check" style="color:${s.color}">✓</span>`:""}`;
      item.addEventListener("click",e=>{
        e.stopPropagation();
        const _voor=[...(isTemplate?((template[person]||{})[day]||[]):(((getData(monday)[person])||{})[day]||[]))];
        toggleStatus(monday,person,day,s.key,isTemplate);
        controleerHalveDag(monday,person,day,isTemplate,_voor);   // een halve dag vrij zonder invulling van het andere dagdeel: de medewerker invullen laten
        if(!isTemplate){
          const _m=monday,_p=person,_d=day;
          render();
          requestAnimationFrame(()=>{
            syncNameSpacer();
            const newWrap=document.getElementById(cellId(weekKey(_m),_p,_d));
            if(newWrap) showPopup(newWrap.parentElement,_m,_p,_d,false);
          });
        }
      });
      popup.appendChild(item);
    });
  }
  renderItems();
  // Voeg toe aan body zodat position:fixed correct werkt
  document.body.appendChild(popup);
  openPopup={el:popup, wrap:cellWrap};
  // Bereken positie: onder de cel, maar klap omhoog als er te weinig ruimte is
  const rect = cellWrap.getBoundingClientRect();
  const ph = popup.offsetHeight || 260; // schatting voor eerste render
  const spaceBelow = window.innerHeight - rect.bottom - 8;
  const spaceAbove = rect.top - 8;
  if(spaceBelow >= ph || spaceBelow >= spaceAbove){
    popup.style.top = (rect.bottom + 6) + "px";
  } else {
    popup.style.top = (rect.top - ph - 6) + "px";
  }
  // Horizontaal: gecentreerd op cel, maar binnen venster houden
  const pw = popup.offsetWidth || 172;
  let left = rect.left + rect.width/2 - pw/2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  popup.style.left = left + "px";
}

// ── Cell rendering ───────────────────────────────────────────────
function cellId(key,person,day){ return `cell-${key}-${person.replace(/\s/g,"_")}-${day}`; }

function renderCellContent(cell,sel){
  const dots=sel.map(k=>STATUS_MAP[k]).filter(Boolean);
  cell.innerHTML="";

  // Leeg
  if(!dots.length){
    cell.style.background="rgba(255,255,255,0.22)"; cell.style.border="1.5px solid rgba(255,255,255,0.30)";
    const e=document.createElement("div"); e.className="cell-empty-dot"; cell.appendChild(e); return;
  }

  const hasKantoor   =dots.some(s=>s.key==="kantoor");
  const hasThuis     =dots.some(s=>s.key==="thuis");
  const hasVmVrij    =dots.some(s=>s.key==="vm_vrij");
  const hasNmVrij    =dots.some(s=>s.key==="nm_vrij");
  const hasVmKantoor =dots.some(s=>s.key==="vm_kantoor");
  const hasNmKantoor =dots.some(s=>s.key==="nm_kantoor");
  const hasVmThuis   =dots.some(s=>s.key==="vm_thuis");
  const hasNmThuis   =dots.some(s=>s.key==="nm_thuis");
  const hasVmExtern  =dots.some(s=>s.key==="vm_extern");
  const hasNmExtern  =dots.some(s=>s.key==="nm_extern");
  const needsSplit   =hasVmVrij||hasNmVrij||hasVmKantoor||hasNmKantoor||hasVmThuis||hasNmThuis||hasVmExtern||hasNmExtern;

  // Hulpfunctie: klein label in de cel
  // side: "left"=linkerhelft, "right"=rechterhelft, "full"=heel vak
  function addLabel(txt, color, side="full"){
    const lbl=document.createElement("span");
    lbl.textContent=txt;
    if(side==="left"){
      lbl.style.cssText=`position:absolute;left:0;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;pointer-events:none;`;
    } else if(side==="right"){
      lbl.style.cssText=`position:absolute;right:0;top:0;width:50%;height:100%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;pointer-events:none;`;
    } else {
      lbl.style.cssText=`font-size:15px;font-weight:700;color:${color};letter-spacing:0.5px;line-height:1;pointer-events:none;`;
    }
    cell.appendChild(lbl);
  }

  if(needsSplit){
    const leftColor  = hasVmVrij ? "rgba(229,57,53,0.55)" : hasVmKantoor ? "rgba(200,200,200,0.45)" : hasVmThuis ? "rgba(76,175,80,0.55)" : hasVmExtern ? "rgba(255,213,79,0.55)" : "rgba(255,255,255,0.04)";
    const rightColor = hasNmVrij ? "rgba(229,57,53,0.55)" : hasNmKantoor ? "rgba(200,200,200,0.45)" : hasNmThuis ? "rgba(76,175,80,0.55)" : hasNmExtern ? "rgba(255,213,79,0.55)" : "rgba(255,255,255,0.04)";
    const borderColor = (hasVmKantoor||hasNmKantoor) ? "rgba(200,200,200,0.4)" : (hasVmThuis||hasNmThuis) ? "rgba(76,175,80,0.5)" : "rgba(229,57,53,0.45)";
    cell.style.background = `linear-gradient(to right, ${leftColor} 50%, ${rightColor} 50%)`;
    cell.style.border = `1.5px solid ${borderColor}`;
    // Labels in split-cel
    if(hasVmVrij)    addLabel("V","rgba(255,255,255,1)","left");
    if(hasVmKantoor) addLabel("C","rgba(255,255,255,1)","left");
    if(hasVmThuis)   addLabel("T","rgba(255,255,255,1)","left");
    if(hasVmExtern)  addLabel("E","rgba(0,0,0,0.7)","left");
    if(hasNmVrij)    addLabel("V","rgba(255,255,255,1)","right");
    if(hasNmKantoor) addLabel("C","rgba(255,255,255,1)","right");
    if(hasNmThuis)   addLabel("T","rgba(255,255,255,1)","right");
    if(hasNmExtern)  addLabel("E","rgba(0,0,0,0.7)","right");
    // Extra bolletjes voor andere statussen (extern, vrij-heel-dag, etc.)
    const rest=dots.filter(s=>!["vm_vrij","nm_vrij","vm_kantoor","nm_kantoor","vm_thuis","nm_thuis","vm_extern","nm_extern","kantoor","thuis"].includes(s.key));
    rest.forEach(s=>{ cell.appendChild(makeDot(s)); });
  } else {
    // Achtergrond bepalen op basis van dominant (niet-kantoor) status
    const hasVrij=dots.some(s=>s.key==="vrij");
    const hasZiek=dots.some(s=>s.key==="ziek");
    const dominant=dots.find(s=>s.key!=="kantoor")||dots[0];
    cell.style.background=`${dominant.color}22`;
    cell.style.border=`1.5px solid ${dominant.border}66`;

    // Altijd K of T tonen voor kantoor/thuis (hele dag)
    if(hasZiek && dots.length===1){
      // Alleen ziek: lichtgrijs + streepje
      cell.style.background="rgba(150,150,150,0.18)"; cell.style.border="1.5px solid rgba(150,150,150,0.35)";
      addLabel("—","rgba(180,180,180,0.8)","full");
    } else if(dots.length===1 && dots[0].key==="ziek_thuis"){
      // Ziek thuis: grijsgroen + ZT
      cell.style.background="rgba(120,170,120,0.35)"; cell.style.border="1.5px solid rgba(120,170,120,0.5)";
      addLabel("ZT","rgba(225,240,225,0.95)","full");
    } else if(hasVrij && !hasKantoor && !hasThuis && dots.length===1){
      // Alleen vrij: rode achtergrond + V
      cell.style.background="rgba(229,57,53,0.55)"; cell.style.border="1.5px solid rgba(229,57,53,0.5)";
      addLabel("V","rgba(255,255,255,1)","full");
    } else if(hasKantoor && !hasThuis){
      // Alleen kantoor: zelfde grijs als halve-dag kantoor
      cell.style.background="rgba(180,180,180,0.6)"; cell.style.border="1.5px solid rgba(180,180,180,0.5)";
      addLabel("C","rgba(255,255,255,1)","full");
      // Extra bolletjes voor andere statussen
      dots.filter(s=>s.key!=="kantoor").forEach(s=>{ cell.appendChild(makeDot(s)); });
    } else if(hasThuis && !hasKantoor){
      // Alleen thuis: groene achtergrond + T
      cell.style.background="rgba(76,175,80,0.55)"; cell.style.border="1.5px solid rgba(76,175,80,0.5)";
      addLabel("T","rgba(255,255,255,1)","full");
      dots.filter(s=>s.key!=="thuis").forEach(s=>{ cell.appendChild(makeDot(s)); });
    } else if(dots.length===1 && dots[0].key==="extern"){
      // Alleen extern: gele achtergrond + zwarte E
      cell.style.background="rgba(255,213,79,0.75)"; cell.style.border="1.5px solid rgba(255,213,79,0.6)";
      addLabel("E","rgba(0,0,0,0.7)","full");
    } else {
      // Overige combinaties: gewone bolletjes
      dots.forEach(s=>{ cell.appendChild(makeDot(s)); });
    }
  }
}

function makeDot(s){
  const d=document.createElement("div"); d.className="dot";
  d.style.background=s.color; d.style.boxShadow=`0 0 6px ${s.color}88`;
  d.style.display="flex"; d.style.alignItems="center"; d.style.justifyContent="center";
  const LABELS={"kantoor":"C","thuis":"T","vrij":"V","ziek":"Z","ziek_thuis":"Z","extern":"E","vm_extern":"E","nm_extern":"E"};
  if(LABELS[s.key]){
    const lbl=document.createElement("span"); lbl.textContent=LABELS[s.key];
    lbl.style.cssText="font-size:12px;font-weight:700;color:rgba(0,0,0,0.45);line-height:1;";
    d.appendChild(lbl);
  }
  return d;
}

function renamePerson(oldName, newName){
  if(!canEditGroups()) return;   // namen, volgorde en wie er in het team zit: alleen ICT-Systeembeheer
  newName = newName.trim();
  if(!newName || newName === oldName || TEAM.includes(newName)) return false;
  const idx = TEAM.indexOf(oldName);
  if(idx === -1) return false;
  const why = teamLockoutReason(TEAM.map(n=>n===oldName ? newName : n), "rename");
  if(why){ alert(why); try{ buildTemplateGrid(); }catch(e){} return false; }   // niet je eigen naam (of die van de laatste beheerder) wijzigen
  TEAM[idx] = newName; if(HIDDEN.has(oldName)){ HIDDEN.delete(oldName); HIDDEN.add(newName); }
  // Kopieer template data
  template[newName] = template[oldName];
  delete template[oldName];
  // Kopieer store data
  Object.keys(store).forEach(k=>{
    if(store[k][oldName]){ store[k][newName]=store[k][oldName]; delete store[k][oldName]; }
  });
  // Kopieer manuallyEdited
  Object.keys(manuallyEdited).forEach(k=>{
    if(manuallyEdited[k]){
      DAYS.forEach(d=>{
        if(manuallyEdited[k].has(oldName+"-"+d)){
          manuallyEdited[k].delete(oldName+"-"+d);
          manuallyEdited[k].add(newName+"-"+d);
        }
      });
    }
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
  return true;
}

function addPerson(name){
  if(!canEditGroups()) return false;
  name = name.trim();
  if(!name || TEAM.includes(name)) return false;
  TEAM.push(name);
  // Voeg toe aan template
  template[name] = {}; DAYS.forEach(d=>{ template[name][d]=["kantoor"]; });
  // Voeg toe aan alle weken in store
  Object.keys(store).forEach(k=>{
    store[k][name] = {}; DAYS.forEach(d=>{ store[k][name][d]=[...(template[name][d]||[])]; });
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
  return true;
}

function removePerson(name){
  if(!canEditGroups()) return;
  const idx = TEAM.indexOf(name);
  if(idx === -1) return;
  const why = teamLockoutReason(TEAM.filter(n=>n!==name), "remove"); if(why){ alert(why); return; }   // niet jezelf of de laatste beheerder uit het team halen
  TEAM.splice(idx, 1); HIDDEN.delete(name);
  delete template[name];
  Object.keys(store).forEach(k=>{ delete store[k][name]; });
  Object.keys(manuallyEdited).forEach(k=>{
    if(manuallyEdited[k]) DAYS.forEach(d=>{ manuallyEdited[k].delete(name+"-"+d); });
  });
  saveState();
  buildTemplateGrid();
  renderAndSync();
}

function personHalfPresent(sel, vm){   // is deze persoon aanwezig in dit dagdeel? thuis of op kantoor telt allebei (ook 'ziek thuis': bereikbaar); ziek, vrij en extern niet
  if(sel.includes("ziek")) return false;
  const dd = vm ? "vm_" : "nm_";
  return sel.some(k=>k === "kantoor" || k === "thuis" || k === "ziek_thuis" || k === dd + "kantoor" || k === dd + "thuis");
}
function groupCoverage(dayData, group, day){   // dekking van een groep op een dag; gap: "" (geen afwijking), "hele dag", "'s ochtends" of "'s middags"; zonder ingevulde gegevens van de groep valt er niets te beoordelen
  const sels = group.filter(p=>!HIDDEN.has(p)).map(p=>(dayData[p] || {})[day] || []);   // een verborgen collega staat nergens in beeld en geeft dus ook geen dekking
  if(!sels.some(s=>s.length > 0)) return { hasData: false, vm: false, nm: false, gap: "" };
  const vm = sels.some(s=>personHalfPresent(s, true)), nm = sels.some(s=>personHalfPresent(s, false));

}

// ── Week panel ───────────────────────────────────────────────────
function buildWeekPanel(monday){
  const thisWeekMonday=mondayOf(today);
  const isCurrent=isSameDay(monday,thisWeekMonday);
  const wk=getWeekNumber(monday), yr=monday.getFullYear();
  const panel=document.createElement("div"); panel.className=`week-panel ${isCurrent?"current":"other"}`;
  const hdr=document.createElement("div"); hdr.className="week-header";
  const badge=document.createElement("div"); badge.className=`week-badge ${isCurrent?"current":"other"}`; badge.textContent=`Week ${wk}`;
  const lbl=document.createElement("div"); lbl.className=`week-lbl ${isCurrent?"current":"other"}`;
  const yearLabel=yr!==today.getFullYear()?` ${yr}`:"";
  lbl.textContent=isCurrent?"huidige week":(isSameDay(monday,addWeeks(thisWeekMonday,1))?"volgende week":`week ${wk}${yearLabel}`);
  const yrEl=document.createElement("div"); yrEl.className="week-year"; yrEl.textContent=String(addDays(monday,3).getFullYear());   // het jaar van de donderdag van die week: zo hoort het jaartal altijd bij het weeknummer, ook rond de jaarwisseling
  hdr.appendChild(badge); hdr.appendChild(lbl); hdr.appendChild(yrEl); panel.appendChild(hdr);
  const dayHdr=document.createElement("div"); dayHdr.className="day-header";
  const BEHEER_GRP = ADMINISTRATORS.filter(n=>TEAM.includes(n));   // de controle ligt bij de Administrators (teamleden)
  DAYS.forEach((day,i)=>{
    const dayDate=addDays(monday,i), isToday=isSameDay(dayDate,today);
    const dayData=getData(monday);
    const beheer=groupCoverage(dayData,BEHEER_GRP,day);
    const dh=document.createElement("div"); dh.className=`day-hd${isToday?" today-col":""}`;
    // Alleen een afwijking laten zien: Systeembeheer of Support zonder iemand aanwezig (thuis of op kantoor), 's ochtends, 's middags of de hele dag. Zonder afwijking blijft de kop leeg.
    if(beheer.gap) dh.style.cssText="background:rgba(229,57,53,0.10);border-radius:6px;outline:1.5px solid rgba(229,57,53,0.5);";
    const warn=(gap,naam)=>gap ? `<div style="font-size:8px;color:#f48fb1;font-weight:700;letter-spacing:0.3px;margin-top:1px;">✗ ${naam} ${gap} weg</div>` : "";
    dh.innerHTML=`<div class="day-hd-name${isToday?" today-col":""}">${day}</div><div class="day-hd-date${isToday?" today-col":""}">${fmtDate(dayDate)}</div><div class="day-hd-count" id="cnt-${weekKey(monday)}-${day}" style="line-height:1.2">${warn(beheer.gap,"beheer")}</div>`;
    dayHdr.appendChild(dh);
  });
  panel.appendChild(dayHdr);
  visibleTeam().forEach((person,pi)=>{
    const row=document.createElement("div"); row.className=`person-row${pi%2===0?" alt":""}`;
    DAYS.forEach((day,i)=>{
      const dayDate=addDays(monday,i), isToday=isSameDay(dayDate,today);
      const wrap=document.createElement("div"); wrap.className="cell-wrap";
      const cell=document.createElement("div"); cell.className=`cell${isToday?" today-col":""}`; cell.id=cellId(weekKey(monday),person,day);
      renderCellContent(cell,getData(monday)[person][day]||[]);
      cell.addEventListener("click",e=>{ e.stopPropagation(); if(openPopup&&openPopup.wrap===wrap){ closePopup(); return; } showPopup(wrap,monday,person,day,false); });
      wrap.appendChild(cell); row.appendChild(wrap);
    });
    panel.appendChild(row);
  });

  requestAnimationFrame(()=>{
    if(document.documentElement.classList.contains("tp-gated")) return;   // verborgen: niet meten; de planning wordt opnieuw opgebouwd zodra de poort opengaat
    const todayHd = panel.querySelector(".day-hd.today-col");
    const todayCells = Array.from(panel.querySelectorAll(".cell.today-col"));
    if(!todayHd || !todayCells.length) return;
    const panelRect = panel.getBoundingClientRect();
    const hdRect    = todayHd.getBoundingClientRect();
    const lastRect  = todayCells[todayCells.length-1].getBoundingClientRect();
    const overlay   = document.createElement("div");
    overlay.className = "today-col-overlay";
    const cellRect2 = todayCells[0].getBoundingClientRect();
    overlay.style.left   = (cellRect2.left   - panelRect.left) + "px";
    overlay.style.top    = (hdRect.top       - panelRect.top)  + "px";
    overlay.style.width  =  cellRect2.width                    + "px";
    overlay.style.height = (lastRect.bottom  - hdRect.top)     + "px";
    panel.querySelectorAll(".today-col-overlay").forEach(e=>e.remove());
    panel.appendChild(overlay);
  });

  return panel;
}

function syncNameSpacer(){
  if(document.documentElement.classList.contains("tp-gated")) return;   // toegangspoort dicht: alles is verborgen en meet 0, dus niet meten (anders klappen de kopregels dicht)
  const panels=Array.from(document.querySelectorAll(".week-panel"));
  const nameCol=document.querySelector(".name-col");
  const spacer=document.querySelector(".name-spacer");
  if(!panels.length||!nameCol||!spacer) return;
  panels.forEach(p=>{ const wh=p.querySelector(".week-header"); const dh=p.querySelector(".day-header"); if(wh) wh.style.height=""; if(dh) dh.style.height=""; });
  const maxWH=Math.max(...panels.map(p=>{ const el=p.querySelector(".week-header"); return el?el.offsetHeight:0; }));
  const maxDH=Math.max(...panels.map(p=>{ const el=p.querySelector(".day-header"); return el?el.offsetHeight:0; }));
  panels.forEach(p=>{ const wh=p.querySelector(".week-header"); const dh=p.querySelector(".day-header"); if(wh) wh.style.height=maxWH+"px"; if(dh) dh.style.height=maxDH+"px"; });
  const firstRow=panels[0].querySelector(".person-row");
  if(!firstRow) return;
  spacer.style.height=(firstRow.getBoundingClientRect().top-nameCol.getBoundingClientRect().top)+"px";
}

function renderAndSync(){
  render();
  // Dubbele rAF zodat de layout volledig gesetteld is voor meting
  requestAnimationFrame(()=>requestAnimationFrame(syncNameSpacer));
}
