<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { min-height:100vh; background:linear-gradient(160deg,#0d0d1a 0%,#111827 60%,#0a1628 100%); font-family:'Courier New',monospace; color:#e8e8f0; padding:20px 16px; }
button { font-family:inherit; cursor:pointer; }

.nav-btn { width:34px; height:34px; border-radius:7px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; }

.nav-info { font-size:12px; color:#666; text-align:center; min-width:180px; }
.nav-now { font-size:10px; padding:6px 10px; color:#80cbc4; border:1px solid rgba(128,203,196,0.3); background:rgba(128,203,196,0.06); border-radius:7px; width:auto; }
.nav-now:hover { background:rgba(128,203,196,0.12); }
.scroll-wrap { overflow-x:auto; }
.grid-layout { min-width:640px; max-width:1100px; margin:0 auto; display:flex; gap:10px; }
.name-col { width:110px; flex-shrink:0; }
.name-spacer { height:86px; }
.name-row { height:38px; margin-bottom:3px; display:flex; align-items:center; gap:7px; padding:2px 4px; border-radius:6px; }
.name-row.alt { background:rgba(255,255,255,0.015); }
.avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex-shrink:0; }
.name-label { font-size:12px; color:#ffffff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name-label.self { color:#ffffff; }
.week-panel { flex:1; min-width:0; border-radius:14px; padding:14px 12px; position:relative; }
.week-panel.current { background:rgba(255,108,0,0.04); border:1px solid rgba(255,108,0,0.25); }
.week-panel.other   { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); }
.week-panel.template { background:rgba(0,61,122,0.15); border:1px solid rgba(0,150,255,0.3); }
.week-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.week-badge { border-radius:8px; padding:4px 14px; font-size:14px; font-weight:800; letter-spacing:1px; }
.week-badge.current  { background:rgba(255,108,0,0.2);  border:1px solid rgba(255,108,0,0.5);   color:#FF6C00; }
.week-badge.other    { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); color:#aaa; }
.week-badge.template { background:rgba(0,100,220,0.2);  border:1px solid rgba(0,150,255,0.4);   color:#60b0ff; }
.week-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; }
.week-year { margin-left:auto; font-size:10px; letter-spacing:2px; color:#fff; }   /* het jaartal rechtsboven in de weekkop: wit, even groot als het label ernaast */
.week-lbl.current  { color:#FF6C00; opacity:0.7; }
.week-lbl.other    { color:#555; }
.week-lbl.template { color:#60b0ff; opacity:0.8; }
.day-header { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:6px; }
.day-hd { text-align:center; border-radius:6px; padding:4px 0; box-sizing:border-box; overflow:hidden; min-width:0; }
.day-hd.today-col { background:rgba(255,213,128,0.08); }
.day-hd-name { font-size:12px; font-weight:800; color:#fff; letter-spacing:1px; }
.day-hd-name.today-col { color:#FFD580; font-size:14px; }
.day-hd-date { font-size:9px; color:#ffffff; margin-top:1px; }
.day-hd-date.today-col { color:#FFD58099; }
.today-badge { font-size:8px; letter-spacing:1px; text-transform:uppercase; color:#FFD580; background:rgba(255,213,128,0.12); border-radius:3px; padding:1px 4px; margin-top:2px; display:inline-block; }
.day-hd-count { margin-top:2px; font-size:9px; font-weight:600; min-height:12px; }
.person-row { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:3px; padding:2px 0; border-radius:6px; box-sizing:border-box; }
.person-row.alt { background:rgba(255,255,255,0.015); }
.cell-wrap { position:relative; }
.cell { height:34px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap; padding:2px; transition:all 0.12s; user-select:none; position:relative; overflow:hidden; }
.cell:hover { filter:brightness(1.3); }
.cell.today-col { }
.cell-empty-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.08); }
.dot { width:18px; height:18px; border-radius:4px; flex-shrink:0; }
.cross::before,.cross::after { content:""; position:absolute; background:#e53935; border-radius:2px; width:40%; height:2px; top:50%; left:50%; }
.cross::before { transform:translate(-50%,-50%) rotate(45deg); }
.cross::after  { transform:translate(-50%,-50%) rotate(-45deg); }
.half-indicator { display:flex; align-items:center; justify-content:center; gap:2px; width:100%; height:100%; }
.half-circle-left  { width:13px; height:13px; border-radius:50%; border:1.5px solid #e53935; background:linear-gradient(to right,#e53935 50%,transparent 50%); flex-shrink:0; }
.half-circle-right { width:13px; height:13px; border-radius:50%; border:1.5px solid #e53935; background:linear-gradient(to left,#e53935 50%,transparent 50%); flex-shrink:0; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.today-col-overlay {
  position:absolute; pointer-events:none; z-index:10;
  border:2.5px solid #FFD580;
  border-radius:8px;
  box-shadow:0 0 12px rgba(255,213,128,0.25);
  background:rgba(255,213,128,0.04);
}
.divider { width:1px; background:rgba(255,255,255,0.06); flex-shrink:0; border-radius:1px; }
.popup { position:fixed; z-index:600; background:#1a1a2e; border:1px solid rgba(255,255,255,0.18); border-radius:10px; padding:8px 6px; min-width:172px; box-shadow:0 8px 32px rgba(0,0,0,0.6); }
.popup-title { font-size:9px; color:#555; letter-spacing:2px; text-transform:uppercase; text-align:center; margin-bottom:6px; padding:0 22px; }
.popup-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; margin-bottom:2px; transition:all 0.1s; border:1px solid transparent; }
.popup-item:hover { background:rgba(255,255,255,0.06); }
.popup-dot { width:13px; height:13px; border-radius:50%; flex-shrink:0; }
.popup-label { font-size:11px; transition:color 0.1s; }
.popup-check { margin-left:auto; font-size:12px; }
/* Sluiten: elk venster heeft alleen een kruis rechtsboven in dat venster (geen 'Sluiten'- of 'Annuleren'-knoppen) */
.win-x { position:absolute; top:10px; right:10px; z-index:5; width:30px; height:30px; display:flex; align-items:center; justify-content:center; padding:0; font:inherit; font-size:14px; line-height:1; color:#aaa; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:8px; cursor:pointer; }
.win-x:hover, .win-x:focus-visible { color:#fff; background:rgba(244,143,177,0.18); border-color:rgba(244,143,177,0.55); outline:none; }
.win-x.small { top:6px; right:6px; width:22px; height:22px; font-size:11px; border-radius:6px; }
.popup-close { margin-top:6px; padding:6px 8px; font-size:10px; color:#555; text-align:center; cursor:pointer; border-top:1px solid rgba(255,255,255,0.06); }
.popup-close:hover { color:#aaa; }
.legend { width:fit-content; max-width:min(1100px, 100%); box-sizing:border-box; margin:12px auto 0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:8px; padding:6px 14px; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 14px; align-items:center; }
.legend-item { display:flex; align-items:center; gap:5px; }
.legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.legend-label { font-size:10px; color:#bbb; }
.compliment { margin:16px auto 4px; max-width:min(940px, 94%); box-sizing:border-box; min-height:4.6em; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(17px, 2.1vw, 26px); line-height:1.35; font-weight:600; letter-spacing:0.2px; color:#fff; }
.compliment .cmp-inner { opacity:0; display:block; }
.compliment .cmp-vertaling { display:block; margin-top:0.35em; font-size:0.6em; font-weight:500; line-height:1.3; color:rgba(255,255,255,0.78); text-shadow:none; }   /* de Nederlandse vertaling onder een Turks of Pools compliment: kleiner en rustiger, zonder gloed */
.compliment .cmp-vertaling:empty { display:none; }
.compliment .cmp-emoji { margin-left:0.3em; }   /* af en toe een smiley achter het compliment */
.compliment .cmp-emoji:empty { display:none; }
.compliment .cmp-naam { color:#ffcc66; font-weight:800; }
.compliment .cmp-spark { margin-right:8px; }
.compliment.cmp-on .cmp-inner { animation:tpCompliment var(--cmp-dur, 11s) ease-in-out infinite; }
@keyframes tpCompliment {   /* langzaam oplichten (27%), even blijven staan, langzaam doven */
  0%   { opacity:0; text-shadow:0 0 0 rgba(255,204,102,0);    transform:scale(0.985); }
  27%  { opacity:1; text-shadow:0 0 14px rgba(255,204,102,0.65), 0 0 34px rgba(255,160,60,0.35); transform:scale(1); }
  73%  { opacity:1; text-shadow:0 0 14px rgba(255,204,102,0.65), 0 0 34px rgba(255,160,60,0.35); transform:scale(1); }
  100% { opacity:0; text-shadow:0 0 0 rgba(255,204,102,0);    transform:scale(0.985); }
}
@keyframes tpComplimentFade { 0% { opacity:0; } 27% { opacity:1; } 73% { opacity:1; } 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce){ .compliment.cmp-on .cmp-inner { animation-name:tpComplimentFade; } }   /* wie minder beweging wil: alleen zacht in- en uitfaden, zonder gloed of schaal */
/* Template modal */
#tpl-modal { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); overflow-y:auto; }
/* Toegangspoort: zonder inloggen alleen een zwart scherm met het inlogvenster */
html.tp-gated, html.tp-gated body { background:#000 !important; }
html.tp-gated body > *:not([data-gate]):not(script):not(style):not(link) { display:none !important; }
/* Wie is er ingelogd: rechtsboven in het scherm (niet aanklikbaar, dus nooit in de weg); op een smal scherm boven de titel */
#who-badge { position:fixed; top:10px; right:14px; z-index:100; pointer-events:none; font-size:12px; }   /* de badge zelf laat klikken door; alleen de knop en het menu zijn aanklikbaar */
#who-btn { pointer-events:auto; display:inline-flex; align-items:center; gap:4px; font:inherit; font-size:12px; color:rgba(255,255,255,0.5); background:rgba(13,13,26,0.88); border:1px solid rgba(128,203,196,0.35); border-radius:999px; padding:5px 12px 5px 13px; white-space:nowrap; max-width:60vw; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
#who-btn:hover, #who-btn[aria-expanded="true"], #who-btn:focus-visible { border-color:rgba(128,203,196,0.75); color:rgba(255,255,255,0.8); outline:none; }
#who-btn b { color:#80cbc4; font-weight:700; }
#who-btn .caret { font-size:10px; opacity:0.75; transition:transform 0.15s; }
#who-btn[aria-expanded="true"] .caret { transform:rotate(180deg); }
#who-menu { pointer-events:auto; position:absolute; right:0; top:calc(100% + 6px); min-width:210px; padding:6px; background:#111827; border:1px solid rgba(255,255,255,0.15); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,0.55); }
#who-menu button { display:block; width:100%; text-align:left; font:inherit; font-size:12px; color:#e8e8f0; background:none; border:none; border-radius:7px; padding:8px 10px; cursor:pointer; }
#who-menu button:hover, #who-menu button:focus { background:rgba(255,255,255,0.08); outline:none; }
#who-menu button.out { color:#f48fb1; }
@media (max-width:640px){ #who-badge { position:relative; display:block; width:max-content; max-width:100%; margin:0 0 8px auto; } }   /* smal scherm: boven de titel, het menu blijft eraan vast */
/* Toegangspoort: de campusfoto over de volle breedte in de echte beeldverhouding (1881:592; niets afgesneden of uitgerekt). De rest van het scherm is een uitgerekte, vervaagde en verduisterde versie van dezelfde foto; het venster staat in de ruimte onder de foto; zwart is de terugval als de foto niet laadt */
.tp-overlay[data-gate] { background-color:#000; align-items:flex-start; overflow:auto; box-sizing:border-box; padding-top:max(0px, min(calc(100vw * 592 / 1881), calc(100vh - 290px))); }
.tp-overlay[data-gate]::before { content:""; position:fixed; inset:-40px; z-index:0; background:url("login-achtergrond.jpg") center / cover no-repeat; filter:blur(26px) brightness(0.5) saturate(1.15); }
.tp-overlay[data-gate]::after { content:""; position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:1; width:min(100vw, calc(100vh * 1881 / 592)); aspect-ratio:1881 / 592; background:url("login-achtergrond.jpg") center / 100% 100% no-repeat; box-shadow:0 10px 50px rgba(0,0,0,0.55); }
.tp-overlay[data-gate] > div { position:relative; z-index:2; margin:auto; }
/* Menu onder je naam: tabbladen, status, wachtwoord, uitloggen */
#who-menu { max-height:calc(100vh - 90px); overflow-y:auto; }
#who-menu button[aria-disabled="true"] { opacity:0.45; cursor:not-allowed; }
#who-menu button[hidden] { display:none; }
#who-menu button.sub { padding-left:28px; }
#who-menu .hd { padding:6px 10px 2px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.35); }
#who-menu .sep { height:1px; margin:5px 4px; background:rgba(255,255,255,0.08); }
#who-menu .ver { padding:6px 10px 2px; font-size:10px; color:rgba(255,255,255,0.3); }
#who-menu button.c-maand { color:#80cbc4; } #who-menu button.c-periode { color:#ce93d8; } #who-menu button.c-geenbeheer { color:#f48fb1; } #who-menu button.c-template { color:#60b0ff; } #who-menu button.c-admin { color:#ffcc80; } #who-menu button.c-status { color:#a5d6a7; }
#who-btn .hdot { display:none; width:8px; height:8px; border-radius:50%; background:#e53935; margin-left:3px; flex-shrink:0; }   /* alleen bij een echte storing */
</style>
</head>

async function groupsMutate(mutator, message){
  for(let i=0;i<4;i++){
    const cur = await groupsFetch();
    const refuse = mutator(cur.groups);
    if(refuse) return { error: refuse };
    const body = { message, content: encodeBase64(JSON.stringify({ v: 1, groups: cur.groups }, null, 1)), branch: GH_BRANCH };
    if(cur.sha) body.sha = cur.sha;
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GROUPS_PATH}`, { method: "PUT", headers: {"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body: JSON.stringify(body) });

      applyGroups(cur.groups); groupsSha = sha; groupsReady = true; groupsError = null;
      try{ showLockIndicator(); }catch(e){}
      return { ok: true, groups: cur.groups };
    }
    if(r.status !== 409 && r.status !== 422) throw new Error("HTTP " + r.status);
  }
  throw new Error("conflict");
}

const AUDIT_MAX_CHANGES = 200;

function auditEid(){
  const a = new Uint8Array(6);

function auditPersist(){

function auditDecode(b64){
  const bin = atob(String(b64).replace(/\n/g,""));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// Vergelijk twee opgeslagen staten en geef de echte wijzigingen terug
function auditDiff(base, cur, hinted){
  const D5 = ["MA","DI","WO","DO","VR"];
  const same = (a,b)=>JSON.stringify(a||[]) === JSON.stringify(b||[]);
  const bTeam = (base.team||[]).filter(p=>p!=="__divider__"), cTeam = (cur.team||[]).filter(p=>p!=="__divider__");
  const both = cTeam.filter(p=>bTeam.includes(p));
  const team = [];
  cTeam.filter(p=>!bTeam.includes(p)).forEach(p=>team.push({s:"team+", p}));
  bTeam.filter(p=>!cTeam.includes(p)).forEach(p=>team.push({s:"team-", p}));
  const bTpl = base.template||{}, cTpl = cur.template||{};
  const tpl = [];
  both.forEach(p=>D5.forEach(d=>{ const a=(bTpl[p]||{})[d], b=(cTpl[p]||{})[d]; if(!same(a,b)) tpl.push({s:"standaard", p, d, from:a||[], to:b||[]}); }));
  const bStore = base.store||{}, cStore = cur.store||{};
  const cells = [];
  Object.keys(cStore).forEach(w=>{
    const bw = bStore[w] || {}, cw = cStore[w] || {};
    both.forEach(p=>D5.forEach(d=>{
      const b = (cw[p]||{})[d]; if(b === undefined) return;
      let a = (bw[p]||{})[d]; if(a === undefined) a = (bTpl[p]||{})[d];   // ontbrekende cel/week = standaardrooster
      if(!same(a,b)) cells.push({s:"cel", w, p, d, from:a||[], to:b||[]});
    }));
  });
  let changes, n;
  if(tpl.length && !hinted){ changes = [...team, ...tpl, {s:"doorgevoerd", n:cells.length}]; n = team.length + tpl.length; }   // standaardrooster: afgeleide cellen alleen tellen
  else { changes = [...team, ...tpl, ...cells]; n = team.length + tpl.length + cells.length; }
  return { n, trunc: changes.length > AUDIT_MAX_CHANGES, changes: changes.slice(0, AUDIT_MAX_CHANGES),
           action: tpl.length ? "standaard" : (team.length && !cells.length ? "team" : "wijziging") };
}

// Na elke geslaagde opslag: wat is er veranderd, door wie, vanaf welke machine
function auditAfterSave(snap){
  try{
    const base = auditBase;
    auditBase = snap;
    if(!base) return;
    const hint = (auditHint && Date.now() - auditHint.t < 60000) ? auditHint.text : null;
    auditHint = null;
    const diff = auditDiff(base, snap, !!hint);
    if(!diff.n) return;
    const who = auditWho || currentIdentity || null;
    auditQueue.push({
      v:1, eid: auditEid(), t: new Date().toISOString(),
      user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "",
      action: hint || diff.action, n: diff.n, trunc: diff.trunc, changes: diff.changes
    });
    auditPushed++;
    auditWho = null;
    auditPersist();
    auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

// Regels toevoegen aan audit/<dag>.jsonl (lezen, toevoegen, schrijven; bij conflict opnieuw)
async function auditAppend(day, entries){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/audit/${day}.jsonl`;
  const hdr = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
  for(let attempt=0; attempt<4; attempt++){
    let sha, text = "";
    const g = await fetch(url + `?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers: hdr});
    if(g.status === 200){ const d = await g.json(); sha = d.sha; text = auditDecode(d.content); }
    else if(g.status !== 404){ return false; }
    const have = new Set();
    text.split("\n").forEach(l=>{ if(!l.trim()) return; try{ have.add(JSON.parse(l).eid); }catch(e){} });
    let add = entries.filter(e=>!have.has(e.eid));
    // iemand zonder naam kan het logboek niet vullen: hooguit 3 regels 'niet ingelogd' per 10 minuten in het hele logboek (de rest wordt weggelaten)
    let ruimte = 3 - text.split("\n").filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } }).filter(e=>e && e.anon && Date.now() - Date.parse(e.t) < 10 * 60 * 1000).length;
    add = add.filter(e=>{ if(!e.anon) return true; if(ruimte > 0){ ruimte--; return true; } return false; });
    if(!add.length) return true;
    const newText = text + (text && !text.endsWith("\n") ? "\n" : "") + add.map(e=>JSON.stringify(e)).join("\n") + "\n";
    const body = {message: commitMessage("Audit " + day), content: encodeBase64(newText), branch: GH_BRANCH};
    if(sha) body.sha = sha;
    const p = await ghWriteFetch(url, {method:"PUT", headers:{...hdr, "Content-Type":"application/json"}, body: JSON.stringify(body)});
    if(p.ok) return true;
    if(p.status === 409 || p.status === 422) continue;   // iemand was ons voor: opnieuw lezen en nogmaals proberen
    return false;
  }
  return false;
}

async function auditFlush(){
  if(auditFlushing || !auditQueue.length){ updateAuditDot(); return; }
  auditFlushing = true; updateAuditDot();
  try{
    let guard = 0;
    while(auditQueue.length && guard++ < 10){
      const day = auditQueue[0].t.slice(0,10);
      const batch = auditQueue.filter(e=>e.t.slice(0,10) === day);
      const ok = await auditAppend(day, batch);
      auditLastOk = ok;
      if(!ok) break;
      const done = new Set(batch.map(e=>e.eid));
      auditQueue = auditQueue.filter(e=>!done.has(e.eid));
      auditPersist();
    }
  }catch(e){ auditLastOk = false; console.warn("audit flush fout:", e); }
  finally{ auditFlushing = false; updateAuditDot(); }
}

function updateAuditDot(){
  const el = document.getElementById("health-audit"); if(!el) return;

  let col, title;
  if(auditLastOk === false){ col = "#e53935"; title = "Audit: uploaden mislukt, " + n + " regel" + (n!==1?"s":"") + " in wachtrij (wordt opnieuw geprobeerd)"; }
  else if(n > 0){ col = "#ffb74d"; title = "Audit: " + n + " in wachtrij"; }
  else if(auditLastOk === true){ col = "#4caf50"; title = "Audit: bijgewerkt (klik voor het logboek)"; }
  else { col = "rgba(255,255,255,0.2)"; title = "Audit: nog niets gelogd in deze sessie (klik voor het logboek)"; }

function b64e(u8){ let s = ""; for(let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]); return btoa(s); }

// Logboek bekijken: laatste 14 dagen, filter op naam en machine (voor ICT-Systeembeheer en ICT-Management)
// ── Audit: opeenvolgende gewone wijzigingen van dezelfde persoon op hetzelfde apparaat tellen als één sessie (hooguit 10 minuten tussen de opslagen: zo lang blijft bewerken aan staan na de laatste wijziging) ──
const AUDIT_SESSIE_GAP = 10 * 60 * 1000;      // wijzigingen: zo lang blijft bewerken aan na de laatste wijziging
const AUDIT_BEZOEK_GAP = 30 * 60 * 1000;      // bezoeken: dezelfde grens als waarop 'terug op de site' wordt vastgelegd
const auditIsBezoek = a=>a === "ingelogd" || a === "site geopend" || /^terug op de site/.test(a || "");
function auditGroupSessions(rows){   // de regels om te tonen, nieuwste bovenaan: elke regel is een losse regel of een sessie met meerdere opslagen of keren openen
  const asc = [...rows].sort((a, b)=>Date.parse(a.t) - Date.parse(b.t)), open = {}, out = [];
  asc.forEach(e=>{
    const t = Date.parse(e.t), samen = e.action === "wijziging" && e.n > 0 && (e.changes || []).length && (e.changes || []).every(c=>c && c.s === "cel");   // alleen gewone celwijzigingen: Periode, standaardrooster, team en backups blijven op zichzelf staan
    if(auditIsBezoek(e.action) && e.user && e.user !== "(niet ingelogd)"){   // dezelfde persoon op hetzelfde apparaat die de site achter elkaar opent: één regel per periode van gebruik
      const bk = "b|" + e.user + "|" + (e.device || ""), bg = open[bk];
      if(bg && t - bg.last <= AUDIT_BEZOEK_GAP){ bg.saves.push(e); bg.last = t; }
      else { const nb = { soort: "bezoeken", saves: [e], last: t }; open[bk] = nb; out.push(nb); }
      return;
    }
    if(!samen){ out.push({ saves: [e], last: t }); return; }
    const key = "w|" + (e.user || "") + "|" + (e.device || ""), g = open[key];
    if(g && t - g.last <= AUDIT_SESSIE_GAP){ g.saves.push(e); g.last = t; }
    else { const ng = { soort: "wijzigingen", saves: [e], last: t }; open[key] = ng; out.push(ng); }
  });
  return out.sort((a, b)=>b.last - a.last);
}
function auditCellChains(saves){   // per cel de reeks waarden (van → … → naar), in de volgorde van de opslagen
  const m = new Map();
  saves.forEach(e=>(e.changes || []).forEach(c=>{ const k = c.w + "|" + c.p + "|" + c.d; if(!m.has(k)) m.set(k, { c, states: [c.from || []] }); m.get(k).states.push(c.to || []); }));
  return [...m.values()];
}

// ── Audit per dag; per gebruiker per dag één overzichtsregel; dagbestanden ouder dan een maand worden vanzelf opgeruimd ──
const AUDIT_VIEW_DAYS = 30, AUDIT_KEEP_DAYS = 31;   // het venster en Statistics kijken 30 dagen terug; de dagbestanden blijven 31 dagen (de dagbestanden gaan op UTC-datum)
function auditDayKey(ms){ const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function auditIsCelWijziging(e){ return e.action === "wijziging" && e.n > 0 && (e.changes || []).length && (e.changes || []).every(c=>c && c.s === "cel"); }
function auditUserDay(u){   // wat deze gebruiker die dag heeft gedaan, in een paar kerncijfers
  let bezoeken = 0, wijzigingen = 0, opslagen = 0, first = Infinity, last = -Infinity; const extra = {}, apparaten = new Map(), plain = [];
  u.groups.forEach(g=>g.saves.forEach(e=>{
    const t = Date.parse(e.t); if(t < first) first = t; if(t > last) last = t;
    apparaten.set(e.device || "?", (e.ws || "?") + " (" + (e.device || "?") + ")");
    if(auditIsBezoek(e.action) || /^site benaderd/.test(e.action || "")) bezoeken++;
    else if(auditIsCelWijziging(e)){ wijzigingen += e.n; opslagen++; plain.push(e); }
    else { const k = String(e.action || "?").split(":")[0].trim(); extra[k] = (extra[k] || 0) + 1; }
  }));
  plain.sort((a, b)=>Date.parse(a.t) - Date.parse(b.t));
  return { user: u.user, groups: u.groups, bezoeken, wijzigingen, opslagen, extra, first, last, apparaten: [...apparaten.values()], plain, pending: u.groups.some(g=>g.saves.some(e=>e.pending)) };
}
function auditDays(shown){   // de regels per dag (nieuwste dag eerst) en binnen een dag per gebruiker (laatst actief eerst)
  const dagen = new Map();
  shown.forEach(g=>{
    const dag = auditDayKey(g.last), user = g.saves[0].user || "onbekend";
    if(!dagen.has(dag)) dagen.set(dag, new Map());
    const per = dagen.get(dag); if(!per.has(user)) per.set(user, { user, groups: [] });
    per.get(user).groups.push(g);
  });
  return [...dagen.entries()].sort((a, b)=>b[0].localeCompare(a[0])).map(([dag, per])=>({ dag, users: [...per.values()].map(auditUserDay).sort((a, b)=>b.last - a.last) }));
}
async function auditCleanup(){   // dagbestanden van het logboek ouder dan 31 dagen verwijderen: hooguit 5 per keer, hooguit eens per 6 uur per apparaat, alleen door wie het logboek mag zien
  try{
    if(!canSeeAdmin()) return;
    const sleutel = "tp_audit_cleanup_t", laatst = parseInt(localStorage.getItem(sleutel) || "0");
    if(laatst && Date.now() - laatst < 6 * 3600 * 1000) return;
    localStorage.setItem(sleutel, String(Date.now()));
    const hdr = {"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"};
    const lr = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/audit?ref=${GH_BRANCH}&t=${Date.now()}`, {headers: hdr});
    if(!lr.ok) return;
    const grens = new Date(Date.now() - AUDIT_KEEP_DAYS * 86400000).toISOString().slice(0, 10);   // alles met een datum vóór deze dag is ouder dan 31 dagen
    const oud = (await lr.json()).filter(f=>f && /^\d{4}-\d\d-\d\d\.jsonl$/.test(f.name) && f.name.slice(0, 10) < grens).sort((a, b)=>a.name.localeCompare(b.name)).slice(0, 5);
    const weg = [];
    for(const f of oud){
      const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/audit/${f.name}`, { method: "DELETE", headers: {...hdr, "Content-Type": "application/json"}, body: JSON.stringify({ message: `Audit opgeruimd: ${f.name.slice(0, 10)} (ouder dan ${AUDIT_KEEP_DAYS} dagen)`, sha: f.sha, branch: GH_BRANCH }) });
      if(!r.ok){ localStorage.setItem(sleutel, String(Date.now() - 5 * 3600 * 1000)); break; }   // mislukt (bijv. een conflict): over een uur opnieuw, niet elke minuut
      weg.push(f.name.slice(0, 10));
    }
    if(weg.length) auditEvent("audit opgeruimd: " + weg.length + " dagbestand" + (weg.length === 1 ? "" : "en") + " ouder dan " + AUDIT_KEEP_DAYS + " dagen (" + weg[0] + (weg.length > 1 ? " t/m " + weg[weg.length - 1] : "") + ")");
  }catch(e){}
}

    dagen.forEach((d, di)=>{   // per dag een kop (de nieuwste dag staat open) met daaronder één regel per gebruiker

async function hashPassword(pw){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ── Vensters sluit je alleen met een kruis rechtsboven in dat venster; het kruis sluit alleen dát venster ──
function addWinX(box, onClose, id, opts){
  opts = opts || {};
  const x = document.createElement("button");
  x.type = "button"; x.className = "win-x" + (opts.small ? " small" : ""); if(id) x.id = id;
  x.textContent = "✕"; x.setAttribute("aria-label", "Sluiten"); x.title = "Sluiten";
  x.addEventListener("click", e=>{ e.stopPropagation(); onClose(); });
  if(!opts.keepPosition && !/fixed|absolute|sticky/.test(box.style.position || "")) box.style.position = "relative";
  box.insertBefore(x, box.firstChild);
  return x;
}

  const m = document.getElementById("who-menu"), b = document.getElementById("who-btn");
  if(m) m.remove();
  if(b){ b.setAttribute("aria-expanded", "false"); if(focusBtn) b.focus(); }
}
function openWhoMenu(){
  const wb = document.getElementById("who-badge"), b = document.getElementById("who-btn");
  if(!wb || !b || document.getElementById("who-menu")) return;
  const m = document.createElement("div"); m.id = "who-menu"; m.setAttribute("role", "menu");
  const item = (id, label, cls, fn)=>{ const x = document.createElement("button"); x.type = "button"; x.id = id; x.setAttribute("role", "menuitem"); x.textContent = label; if(cls) x.className = cls; x.onclick = ()=>{ closeWhoMenu(); fn(); }; m.appendChild(x); };
  const sep = ()=>{ const d = document.createElement("div"); d.className = "sep"; d.setAttribute("role", "separator"); m.appendChild(d); };
  const cmd = id => ()=>{ const knop = document.getElementById(id); if(knop) knop.click(); };   // de tabbladen zijn opdrachten: het menu roept dezelfde (verborgen) knoppen aan als voorheen
  item("menu-maand", "📅 Maand", "c-maand", cmd("btn-maand"));
  item("menu-periode", "📆 Periode", "c-periode", cmd("btn-periode"));
  item("menu-geenbeheer", "⚠ Geen Beheer", "c-geenbeheer", cmd("btn-geen-beheer"));
  item("menu-template", "★ Standaard", "c-template", cmd("btn-template"));
  if(canSeeAdmin()){   // Admin: alleen ICT-Systeembeheer en ICT-Management
    const kop = t => { const d = document.createElement("div"); d.className = "hd"; d.textContent = t; d.setAttribute("role", "presentation"); m.appendChild(d); };   // een kopje in het menu (geen knop)
    sep(); kop("Admin");
    item("menu-audit", "📜 Audit", "c-admin", cmd("btn-admin"));
    item("menu-wachtwoorden", "🔑 Wachtwoorden", "c-admin", ()=>showUsersModal());
    item("menu-groepen", "👥 Groepen", "c-admin", ()=>showGroupsModal());
    item("menu-status", "📊 Status", "c-status", ()=>showStatusWindow());
    item("menu-stats", "📈 Statistics", "c-status", ()=>showStatsWindow());
    item("menu-boodschap", "💬 Boodschap", "c-admin", ()=>showBoodschapModal());
    // Backup/Restore: een tabblad onder Admin dat uitklapt naar Backup en Restore (klappen blijft het menu openhouden)
    const bkTab = document.createElement("button"); bkTab.type = "button"; bkTab.id = "menu-backuprestore"; bkTab.className = "c-admin";
    bkTab.setAttribute("role", "menuitem"); bkTab.setAttribute("aria-haspopup", "true"); bkTab.setAttribute("aria-expanded", "false"); bkTab.textContent = "🗄 Backup/Restore ▸";
    m.appendChild(bkTab);
    item("menu-backup-maken", "💾 Backup", "c-admin sub", ()=>makeManualBackup());
    item("menu-backup-terugzetten", "⟳ Restore", "c-admin sub", ()=>{ if(!canRestore()){ denyRestore(); return; } cmd("btn-restore-backup")(); });
    const bkSubs = [m.querySelector("#menu-backup-maken"), m.querySelector("#menu-backup-terugzetten")]; bkSubs.forEach(x=>{ x.hidden = true; });
    bkTab.onclick = ()=>{ const open = bkTab.getAttribute("aria-expanded") !== "true"; bkTab.setAttribute("aria-expanded", String(open)); bkTab.textContent = "🗄 Backup/Restore " + (open ? "▾" : "▸"); bkSubs.forEach(x=>{ x.hidden = !open; }); };
    if(!canRestore()){ const t = m.querySelector("#menu-backup-terugzetten"); t.setAttribute("aria-disabled", "true"); t.title = "Een backup terugzetten mag alleen " + RESTORE_GROUP; }
    if(!editUnlocked){   // Admin werkt alleen als bewerken aan staat: een klik op een onderdeel geeft eerst de vraag om bewerken aan te zetten (bewuste tussenstap)
      ["menu-wachtwoorden", "menu-groepen", "menu-boodschap", "menu-backuprestore", "menu-backup-maken", "menu-backup-terugzetten"].forEach(id=>{   // Audit, Status en Statistics zijn alleen kijken: zonder vraag
        const x = m.querySelector("#" + id); if(!x) return;
        if(id === "menu-boodschap" && !canToggleMessage()) return;   // ICT-Management kijkt alleen mee: geen vraag
        if(id === "menu-backup-terugzetten" && !canRestore()) return;   // terugzetten mag deze gebruiker niet: blijft uitgeschakeld met uitleg
        x.title = "Eerst volgt de vraag om bewerken aan te zetten";
      });
      const tab = m.querySelector("#menu-backuprestore");   // het tabblad zelf opent niets: eerst de vraag, dan het menu opnieuw met het tabblad uitgeklapt
      if(tab) tab.onclick = async ()=>{ closeWhoMenu(); if(await requireUnlock({ admin: true })){ openWhoMenu(); const t = document.getElementById("menu-backuprestore"); if(t) t.click(); } };
    }
  }
  sep();
  item("menu-pw", "🔑 Wachtwoord wijzigen", "", ()=>showChangePassword());
  item("menu-logout", "↪ Uitloggen", "out", ()=>lock());
  const verEl = document.getElementById("app-version"); if(verEl){ const v = document.createElement("div"); v.className = "ver"; v.id = "menu-version"; v.textContent = verEl.textContent; m.appendChild(v); }
  m.addEventListener("keydown", e=>{
    const items = [...m.querySelectorAll("button")].filter(x=>!x.hidden), i = items.indexOf(document.activeElement);
    if(e.key === "ArrowDown"){ e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if(e.key === "Escape"){ e.preventDefault(); closeWhoMenu(true); }
    else if(e.key === "Tab"){ closeWhoMenu(); }
  });
  wb.appendChild(m); b.setAttribute("aria-expanded", "true");
  m.querySelector("button").focus();
}
document.addEventListener("click", e=>{ if(document.getElementById("who-menu") && !(e.target.closest && e.target.closest("#who-badge"))) closeWhoMenu(); }, true);
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && document.getElementById("who-menu")) closeWhoMenu(true); });

function showLockIndicator(){
  const ind = document.getElementById("lock-ind");
  if(!ind) return;
  const idLine = currentIdentity ? "Ingelogd als " + currentIdentity.id + " (" + currentIdentity.workstation + ")\nGroep: " + (groupsReady ? (groupOf(currentIdentity.user) || "geen") : "nog niet geladen") + (currentIdentity.info ? "\n" + currentIdentity.info : "") : "";
  if(currentIdentity && editUnlocked){
    ind.textContent = "🔓 bewerken aan · " + currentIdentity.user;
    ind.style.color = "#80cbc4";
    ind.title = idLine + "\nBewerken gaat na 10 minuten zonder wijziging vanzelf uit. Klik om het nu uit te zetten.";
    ind.style.display = "";   // zolang bewerken aan staat zie je dat, en kun je het hier uitzetten
  } else {
    ind.style.display = "none";   // alleen lezen is de normale toestand en hoeft niet in beeld: wie iets wil wijzigen krijgt de vraag om bewerken aan te zetten
    ind.textContent = "🔒 alleen lezen" + (currentIdentity ? " · klik om te bewerken" : "");
    ind.style.color = "rgba(255,255,255,0.3)";
    ind.title = currentIdentity ? idLine + "\nBewerken staat uit. Klik om het aan te zetten (het gaat na 10 minuten zonder wijziging vanzelf weer uit)." : "Eerst inloggen";
  }
  ind.style.cursor = "pointer";
  const rb = document.getElementById("btn-restore-backup");   // terugzetten: alleen ICT-Systeembeheer
  if(rb){
    const ok = canRestore();
    if(!ok){ rb.disabled = true; rb.dataset.denied = "1"; rb.title = "Een backup terugzetten mag alleen " + RESTORE_GROUP; rb.style.cursor = "not-allowed"; rb.style.opacity = "0.45"; }
    else if(rb.dataset.denied){ delete rb.dataset.denied; rb.disabled = false; rb.title = "Herstel een backup"; rb.style.cursor = ""; rb.style.opacity = ""; }
  }
  const on = !!currentIdentity;
  const ab = document.getElementById("btn-admin"); if(ab) ab.style.display = canSeeAdmin() ? "" : "none";   // Admin: alleen voor ICT-Systeembeheer en ICT-Management
  if(!canSeeAdmin()) closeAdminWindows(true); else if(!editUnlocked) closeAdminWindows();                                                                     // verandert je groep terwijl Admin openstaat, dan gaat het dicht
  try{ updateAuditDot(); }catch(e){}
  try{ updateBadgeHealth(); }catch(e){}
  // Rechtsboven: onder wie er is ingelogd, met een pulldown (alleen tekst, nooit HTML)
  const wb = document.getElementById("who-badge");
  if(wb){
    const key = currentIdentity ? currentIdentity.id + "|" + currentIdentity.user : "";
    if(wb.dataset.key !== key){   // alleen opnieuw opbouwen als de gebruiker wisselt: een open menu blijft open als bewerken aan/uit gaat
      closeWhoMenu(); wb.textContent = ""; wb.dataset.key = key;
      if(currentIdentity){
        const btn = document.createElement("button"); btn.type = "button"; btn.id = "who-btn";
        btn.setAttribute("aria-haspopup", "menu"); btn.setAttribute("aria-expanded", "false");
        btn.append("Ingelogd als ");
        const b = document.createElement("b"); b.textContent = currentIdentity.user; btn.appendChild(b);
        const hd = document.createElement("span"); hd.className = "hdot"; hd.id = "who-health"; btn.appendChild(hd);   // rood puntje als er een storing is (zonder tekst)
        const c = document.createElement("span"); c.className = "caret"; c.setAttribute("aria-hidden", "true"); c.textContent = "▾"; btn.append(" ", c);
        btn.onclick = ()=>{ if(document.getElementById("who-menu")) closeWhoMenu(); else openWhoMenu(); };
        wb.appendChild(btn);
        updateBadgeHealth();
      }
    }
    wb.title = currentIdentity ? idLine : "";
    wb.style.display = currentIdentity ? "" : "none";
  }
}

function lock(){   // uitloggen: terug naar de toegangspoort
  const dirty = editUnlocked && editDirty, who = commitMessage(""); editDirty = false;   // is er gewijzigd, dan komt er een backup (zie endOfEditBackup)
  editUnlocked = false;
  clearTimeout(unlockTimer);
  try{ localStorage.removeItem("tp_unlocked"); localStorage.removeItem("tp_user"); localStorage.removeItem("tp_edit"); }catch(e){}
  currentIdentity = null;
  // Open keuzemenu's/popups sluiten, zodat daarmee niets meer gemuteerd kan worden
  try{ closePopup(); }catch(e){}
  document.querySelectorAll(".mo-inline-menu").forEach(m=>m.remove());
  showLockIndicator();
  document.dispatchEvent(new CustomEvent("tp-lock-changed"));
  gateOn();   // uitgelogd = weer een zwart scherm: eerst aangeven wie je bent
  if(dirty) endOfEditBackup(who);
}
function enableEditing(){   // bewerken aanzetten (alleen als je bent ingelogd); de 10 minuten beginnen nu
  if(!currentIdentity || editUnlocked) return;
  editUnlocked = true; editDirty = false;
  touchEditTimer();
  document.dispatchEvent(new CustomEvent("tp-lock-changed"));

}
function disableEditing(){   // bewerken uit; je blijft ingelogd en kunt gewoon blijven kijken
  clearTimeout(unlockTimer);
  try{ localStorage.removeItem("tp_edit"); }catch(e){}
  if(!editUnlocked){ showLockIndicator(); return; }

  const dirty = editDirty, who = commitMessage(""); editDirty = false;   // is er gewijzigd, dan komt er een backup (zie endOfEditBackup)
  try{ closePopup(); }catch(e){}
  document.querySelectorAll(".mo-inline-menu").forEach(m=>m.remove());
  document.dispatchEvent(new CustomEvent("tp-lock-changed"));
  showLockIndicator();
  if(dirty) endOfEditBackup(who);
}

// ── Toegangspoort: zonder inloggen is er alleen een zwart scherm met 'Wie ben je?' ──
let gatePrompt = null, firstLoadSettled = false;
function gateOn(){
  document.documentElement.classList.add("tp-gated");
  try{ closeAllOverlays(); }catch(e){}   // geen openstaande vensters van een vorige gebruiker
  if(gatePrompt && document.querySelector(".tp-overlay[data-gate]")) return;   // het inlogvenster staat al open
  gatePrompt = promptUnlock({ gate: true }).then(()=>{ gatePrompt = null; if(currentIdentity) gateOff(); });
}
function gateOff(){
  const was = document.documentElement.classList.contains("tp-gated");
  document.documentElement.classList.remove("tp-gated");
  if(was && firstLoadSettled){ try{ renderAndSync(); }catch(e){ console.warn("opnieuw opbouwen na de poort mislukt:", e); } }   // tijdens de poort was alles verborgen: nu opnieuw opbouwen en meten
}
// Een sessie eindigt zodra het wachtwoord waarmee je inlogde is gereset of verwijderd (ook op andere apparaten); bij een storing, of zolang er nog geen wachtwoordbestand is, blijft alles zoals het is
async function revalidateSession(){
  if(!currentIdentity || !currentIdentity.pw) return;   // alleen sessies die met een eigen wachtwoord zijn aangemaakt
  const who = currentIdentity.user;
  try{
    const reg = await usersLoad();
    if(reg.sha && currentIdentity && currentIdentity.user === who && !reg.users[who]) lock();
  }catch(e){}
}

// ── Persoonlijke wachtwoorden: per naam een salt + PBKDF2-hash in users.json op de data-branch ──
const USER_ITER = 210000, USERS_PATH = "users.json", PW_MIN = 10;
const EXTRA_LOGINS = ["Monitor"];   // mogen inloggen maar zijn geen teamlid: geen rij in de planning, niet in Systeembeheer of Support
const loginNames = () => TEAM.filter(n=>n!=="__divider__").concat(EXTRA_LOGINS.filter(n=>!TEAM.includes(n)));
async function usersLoad(){
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}?ref=${GH_BRANCH}&t=${Date.now()}&r=${Math.random().toString(36).slice(2)}`, {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
  if(r.status === 404) return { users: {}, sha: null };       // nog nooit iemand een eigen wachtwoord ingesteld
  if(!r.ok) throw new Error("HTTP " + r.status);              // bij twijfel NIET terugvallen op het startwachtwoord
  const d = await r.json();
  const parsed = JSON.parse(auditDecode(d.content));
  return { users: (parsed && typeof parsed.users === "object" && parsed.users) || {}, sha: d.sha };
}
// Lezen, wijzigen, schrijven; bij een schrijfconflict opnieuw. mutator(users) wijzigt de lijst en geeft een tekst terug om te weigeren.
async function usersMutate(mutator, message){
  for(let i=0;i<4;i++){
    const cur = await usersLoad();
    const refuse = mutator(cur.users);
    if(refuse) return { error: refuse };
    const body = { message, content: encodeBase64(JSON.stringify({ v: 1, users: cur.users }, null, 1)), branch: GH_BRANCH };
    if(cur.sha) body.sha = cur.sha;
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${USERS_PATH}`, { method: "PUT", headers: {"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body: JSON.stringify(body) });
    if(r.ok) return { ok: true };
    if(r.status !== 409 && r.status !== 422) throw new Error("HTTP " + r.status);
  }
  throw new Error("conflict");
}
async function verifyUserPw(pw, rec){
  const got = await adminDerive(pw, b64d(rec.salt), rec.iter), want = b64d(rec.hash);
  let diff = got.length ^ want.length; for(let i=0;i<Math.min(got.length, want.length);i++) diff |= got[i] ^ want[i];
  return diff === 0;
}
async function newUserRecord(pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return { salt: b64e(salt), hash: b64e(await adminDerive(pw, salt, USER_ITER)), iter: USER_ITER, set: new Date().toISOString() };
}
function pwProblem(p1, p2){ if(p1.length < PW_MIN) return "Minimaal " + PW_MIN + " tekens"; if(p1 !== p2) return "De wachtwoorden komen niet overeen"; return null; }
// Gebeurtenis zonder celwijziging (wachtwoord ingesteld/gewijzigd/gereset) in het logboek zetten
function auditEvent(action, opts){
  try{
    let who = currentIdentity; const anon = !!(opts && opts.anon);
    if(!who && anon) who = makeIdentity("(niet ingelogd)", guessWorkstation(), machineText(machineBase()));   // iemand bij de poort: wel apparaat en browser, geen naam
    auditQueue.push({ v: 1, eid: auditEid(), t: new Date().toISOString(), user: who ? who.user : "onbekend", ws: who ? who.workstation : "", device: who ? who.device : "", id: who ? who.id : "", wsinfo: who ? (who.info || "") : "", action, n: 0, trunc: false, changes: [], ...(anon ? { anon: true } : {}) });
    auditPushed++;
    auditPersist(); auditFlush();
  }catch(e){ console.warn("audit fout:", e); }
}

// ── Wie de site opent of ernaar terugkeert (audit) ──
const AUTO_RELOAD_KEY = "tp_autoreload";
function markAutoReload(){ try{ sessionStorage.setItem(AUTO_RELOAD_KEY, String(Date.now())); }catch(e){} }   // vlak vóór een herladen dat niemand zelf deed (elk uur, of naar een nieuwe versie)
const OPENED_AUTO = (()=>{ try{ const t = parseInt(sessionStorage.getItem(AUTO_RELOAD_KEY) || "0"); sessionStorage.removeItem(AUTO_RELOAD_KEY); return !!t && Date.now() - t < 120000; }catch(e){ return false; } })();
function siteAccessAudit(){
  if(OPENED_AUTO) return;   // een automatisch herladen is geen nieuw bezoek
  try{
    if(currentIdentity){   // iemand opent de site (opnieuw) met een lopende inlog: nieuw tabblad, verversen, het scherm op de afdeling dat opnieuw start
      const last = parseInt(localStorage.getItem("tp_open_t") || "0");
      if(last && Date.now() - last < 2 * 60 * 1000) return;   // snel achter elkaar verversen: één regel
      localStorage.setItem("tp_open_t", String(Date.now()));
      auditEvent("site geopend");
    } else {   // de poort: pas na 1 minuut als er dan nog niet is ingelogd (wie inlogt staat al als 'ingelogd'; een bot die even langskomt schrijft niets)
      setTimeout(()=>{
        if(currentIdentity) return;
        const last = parseInt(localStorage.getItem("tp_gate_t") || "0");
        if(last && Date.now() - last < 30 * 60 * 1000) return;   // per apparaat hooguit eens per 30 minuten
        localStorage.setItem("tp_gate_t", String(Date.now()));
        auditEvent("site benaderd, niet ingelogd", { anon: true });
      }, 60 * 1000);
    }
  }catch(e){}
}
let hiddenSince = 0;
document.addEventListener("visibilitychange", ()=>{   // terug op de site na minstens 30 minuten weg (tabblad of app op de achtergrond, telefoon op slot)
  if(document.hidden){ hiddenSince = Date.now(); return; }
  const weg = hiddenSince ? Date.now() - hiddenSince : 0; hiddenSince = 0;
  if(currentIdentity && weg >= 30 * 60 * 1000) auditEvent("terug op de site (na " + Math.round(weg / 60000) + " min weg)");
});

async function promptUnlock(opts){
  const gate = !!(opts && opts.gate);
  if(!gate && gatePrompt){ await gatePrompt; return !!currentIdentity; }   // het inlogvenster van de toegangspoort staat al open: daar inloggen
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "tp-overlay"; overlay.style.cssText = "position:fixed;inset:0;z-index:950;display:flex;justify-content:center;" + (gate ? "" : "background:rgba(0,0,0,0.75);align-items:center;");   // poort: achtergrond en uitlijning komen uit de stijl
    if(gate) overlay.dataset.gate = "1";   // poort: de achtergrondfoto komt uit de stijl (.tp-overlay[data-gate]); het venster is niet te sluiten
    const box = document.createElement("div");
    box.style.cssText = "background:#111827;border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:28px 24px;min-width:280px;max-width:92vw;text-align:center;";
    overlay.appendChild(box); document.body.appendChild(overlay);
    const FIELD = "width:100%;box-sizing:border-box;background:#1a1a2e;color:#eee;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;outline:none;";
    const BTN = "border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:inherit;";
    // Machine-gegevens worden op de achtergrond vastgelegd (niet gevraagd of getoond bij het inloggen)
    const mBase = machineBase();
    let machineInfoStr = machineText(mBase);
    machineEnrich(mBase).then(o=>{ machineInfoStr = machineText(o); });
    const cancel = gate ? (()=>{ render1(); }) : (()=>{ overlay.remove(); resolve(false); });   // in de poort: Annuleren in stap 2 gaat terug naar stap 1

    function finishLogin(user, after){
      const ws = guessWorkstation();   // automatisch: besturingssysteem · browser
      currentIdentity = makeIdentity(user, ws, machineInfoStr);
      currentIdentity.pw = true;       // ingelogd met een eigen wachtwoord: de sessie eindigt als dat wachtwoord wordt gereset
      editUnlocked = false;            // na inloggen kun je alleen kijken; bewerken zet je zelf aan
      clearTimeout(unlockTimer);
      lastActivity = Date.now(); auditWho = currentIdentity;
      try{ localStorage.removeItem("tp_ws"); localStorage.removeItem("tp_edit"); localStorage.setItem("tp_user", JSON.stringify(currentIdentity)); localStorage.setItem("tp_last_user", user); localStorage.setItem("tp_unlocked", String(lastActivity)); }catch(e){}   // onthoud op dit apparaat (tot 10 minuten na de laatste activiteit)
      document.dispatchEvent(new CustomEvent("tp-lock-changed"));
      showLockIndicator();
      groupsLoad(); settingsLoad();   // verse indeling en instellingen bij het inloggen
      overlay.remove();
      resolve(true);
      auditEvent("ingelogd");   // begin van de sessie: ook alleen kijken telt, dus elke echte inlog (naam + wachtwoord) staat in het logboek; een pagina die zich na verversen herstelt niet
      if(after) after();
    }

    // Stap 1: naam + wachtwoord (het eigen wachtwoord, of de eerste keer het startwachtwoord)
    function render1(msg, preUser){
      box.innerHTML = `<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:6px;">${gate ? "🔒 Inloggen" : "🔒 Wachtwoord vereist"}</div>
      <div style="font-size:11px;color:#777;margin-bottom:14px;">${gate ? "Kies wie je bent en voer je wachtwoord in om de planning te zien" : "Kies wie je bent en voer je wachtwoord in om te bewerken"}</div>
      <div style="text-align:left;font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;margin-bottom:4px;">WIE BEN JE?</div>
      <select id="pw-user" style="${FIELD}margin-bottom:10px;"></select>
      <input id="pw-input" type="password" placeholder="Wachtwoord" autocomplete="off" style="${FIELD}margin-bottom:8px;">
      <div style="text-align:left;font-size:10px;color:#666;margin-bottom:4px;">Eerste keer? Voer het startwachtwoord in, daarna kies je een eigen wachtwoord. Vergeten? Vraag een lid van ${GROUP_ADMIN} om een reset.</div>
      <div id="pw-error" style="font-size:10px;color:#f48fb1;min-height:14px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button id="pw-ok" style="background:rgba(128,203,196,0.15);border:1px solid rgba(128,203,196,0.4);color:#80cbc4;font-weight:700;${BTN}">${gate ? "Inloggen" : "Ontgrendelen"}</button>
      </div>`;
      const input = box.querySelector("#pw-input"), error = box.querySelector("#pw-error"), userSel = box.querySelector("#pw-user");
      function fillNames(){
        const loading = gate && !firstLoadSettled;   // de teamlijst is nog niet binnen: nog geen (verouderde) namen tonen
        const names = loading ? [] : loginNames();
        const sig = (loading ? "laden" : "klaar") + "|" + names.join("|");
        if(userSel.dataset.sig === sig) return;      // niets veranderd: keuzelijst met rust laten
        const wasLoading = (userSel.dataset.sig || "").startsWith("laden");
        userSel.dataset.sig = sig;
        const cur = userSel.value;
        userSel.innerHTML = "";
        const ph = document.createElement("option"); ph.value = ""; ph.disabled = true; ph.selected = true; ph.textContent = loading ? "— Planning laden… —" : "— Kies je naam —"; userSel.appendChild(ph);
        userSel.disabled = loading;
        if(loading) return;
        TEAM.filter(n=>n!=="__divider__").forEach(n=>{ const o = document.createElement("option"); o.value = n; o.textContent = n; userSel.appendChild(o); });
        const extra = EXTRA_LOGINS.filter(n=>!TEAM.includes(n));
        if(extra.length){ const g = document.createElement("optgroup"); g.label = "Overig (geen teamlid)"; extra.forEach(n=>{ const o = document.createElement("option"); o.value = n; o.textContent = n; g.appendChild(o); }); userSel.appendChild(g); }
        let pick = names.includes(cur) ? cur : (preUser || ""); if(!pick){ try{ pick = localStorage.getItem("tp_last_user") || ""; }catch(e){} }
        if(pick && names.includes(pick)) userSel.value = pick;   // laatst gebruikte naam op dit werkstation
        if(wasLoading) (userSel.value ? input : userSel).focus();   // de lijst is net binnen: focus op de naam, of op het wachtwoord als de naam al staat
        else if(userSel.value && document.activeElement === userSel) input.focus();
      }
      fillNames();
      const onTeam = ()=>{ if(!userSel.isConnected){ document.removeEventListener("tp-team-changed", onTeam); return; } fillNames(); };
      document.addEventListener("tp-team-changed", onTeam);
      if(msg) error.textContent = msg;
      const wrong = ()=>{ error.textContent = "Onjuist wachtwoord"; input.value = ""; input.focus(); };   // venster blijft open: na een juist wachtwoord gaat de oorspronkelijke actie gewoon door

      async function tryUnlock(){
        const user = userSel.value;
        if(!user){ error.textContent = "Kies eerst wie je bent"; userSel.focus(); return; }
        error.textContent = "";
        let reg;
        try{ reg = await usersLoad(); }
        catch(e){ error.textContent = "De wachtwoorden konden niet worden opgehaald. Probeer het opnieuw."; return; }
        const rec = reg.users[user];
        if(rec){
          let ok = false; try{ ok = await verifyUserPw(input.value, rec); }catch(e){}
          if(!ok){ wrong(); return; }
          finishLogin(user);
        } else {
          if(await hashPassword(input.value) !== PW_HASH){ wrong(); return; }
          render2(user);                 // startwachtwoord klopt: nu een eigen wachtwoord kiezen
        }
      }
      box.querySelector("#pw-ok").onclick = tryUnlock;
      if(!gate) addWinX(box, cancel, "pw-close");   // (de toegangspoort zelf heeft geen kruis: die kan niet dicht)
      input.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); if(e.key==="Escape" && !gate) cancel(); });
      (userSel.value ? input : userSel).focus();
    }

    // Stap 2 (alleen de eerste keer): een eigen wachtwoord kiezen
    function render2(user){
      box.innerHTML = `<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:6px;">🔑 Kies je eigen wachtwoord</div>
      <div id="pw2-intro" style="font-size:11px;color:#777;margin-bottom:14px;"></div>
      <input id="pw-new1" type="password" placeholder="Nieuw wachtwoord (min. ${PW_MIN} tekens)" autocomplete="new-password" style="${FIELD}margin-bottom:8px;">
      <input id="pw-new2" type="password" placeholder="Herhaal wachtwoord" autocomplete="new-password" style="${FIELD}margin-bottom:8px;">
      <div id="pw-error" style="font-size:10px;color:#f48fb1;min-height:14px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button id="pw-cancel" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#aaa;${BTN}">← Terug</button>
        <button id="pw-ok" style="background:rgba(128,203,196,0.15);border:1px solid rgba(128,203,196,0.4);color:#80cbc4;font-weight:700;${BTN}">Opslaan en inloggen</button>
      </div>`;
      box.querySelector("#pw2-intro").textContent = "Hallo " + user + ". Daarmee log je voortaan in; het startwachtwoord werkt dan niet meer voor jouw naam.";
      const n1 = box.querySelector("#pw-new1"), n2 = box.querySelector("#pw-new2"), error = box.querySelector("#pw-error"), okBtn = box.querySelector("#pw-ok");
      async function save(){
        const prob = pwProblem(n1.value, n2.value); if(prob){ error.textContent = prob; return; }
        error.textContent = ""; okBtn.disabled = true;
        try{
          const rec = await newUserRecord(n1.value);
          const res = await usersMutate(u=>{ if(u[user]) return "bestaat al"; u[user] = rec; return false; }, "Wachtwoord ingesteld voor " + user);
          if(res.error){ render1("Er is intussen al een eigen wachtwoord voor deze naam. Log in met dat wachtwoord.", user); return; }
        }catch(e){ error.textContent = "Opslaan mislukt (" + e.message + "). Probeer het opnieuw."; okBtn.disabled = false; return; }
        finishLogin(user, ()=>auditEvent("wachtwoord ingesteld"));
      }
      okBtn.onclick = save;
      box.querySelector("#pw-cancel").onclick = cancel;
      [n1, n2].forEach(el=>el.addEventListener("keydown", e=>{ if(e.key==="Enter") save(); if(e.key==="Escape") cancel(); }));
      n1.focus();
    }
    render1();
  });
}

    let reg; try{ reg = await usersLoad(); }catch(e){ list.textContent = "Laden mislukt: " + e.message; return; }
    const canReset = canResetPasswords();
    hint.textContent = baseHint + (canReset ? "" : (groupsReady ? " Alleen leden van " + GROUP_ADMIN + " kunnen een reset doen." : " De groepen zijn nog niet opgehaald, dus resetten kan nu niet."));

      const rec = reg.users[name];

      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,0.06);";

      const nm = document.createElement("span"); nm.style.cssText = "min-width:90px;color:#fff;"; nm.textContent = name + (TEAM.includes(name) ? "" : (EXTRA_LOGINS.includes(name) ? " (geen teamlid)" : " (niet in team)")) + (mij ? " (jij)" : "");
      if(mij) nm.title = "Je eigen wachtwoord wijzig je via 'wachtwoord wijzigen' (met je huidige wachtwoord); resetten kan hier niet, zodat je jezelf niet buitensluit.";
      const st = document.createElement("span"); st.style.cssText = "flex:1;color:" + (rec ? "#80cbc4" : "rgba(255,255,255,0.4)") + ";";
      st.textContent = rec ? "eigen wachtwoord sinds " + fmt(rec.set) : "nog niet ingesteld (startwachtwoord)";
      row.append(nm, st);
      if(rec && canReset && !mij){   // je eigen wachtwoord reset je niet (dan moet je met het startwachtwoord opnieuw beginnen): wijzigen kan via 'wachtwoord wijzigen'
        const b = document.createElement("button"); b.textContent = "Reset";
        b.style.cssText = "background:rgba(244,143,177,0.1);border:1px solid rgba(244,143,177,0.35);color:#f48fb1;border-radius:8px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;";
        b.onclick = async ()=>{
          if(currentIdentity && currentIdentity.user === name){ alert("Je eigen wachtwoord kun je hier niet resetten. Gebruik 'wachtwoord wijzigen'."); return; }   // niet jezelf buitensluiten
          // de rechten worden op het moment van resetten nog eens gecontroleerd op de nieuwste indeling (niet op wat dit venster al wist)
          try{ await groupsRefresh(); }catch(e){ alert("De groepen konden niet worden opgehaald, dus resetten kan nu niet."); return; }
          if(!canResetPasswords()){ alert("Alleen leden van " + GROUP_ADMIN + " kunnen wachtwoorden resetten."); try{ showLockIndicator(); }catch(e){} renderList(); return; }
          if(!confirm("Wachtwoord van " + name + " resetten?\n" + name + " moet daarna opnieuw een eigen wachtwoord kiezen, met het startwachtwoord.")) return;
          try{
            const r = await usersMutate(u=>{ if(!u[name]) return "Heeft geen eigen wachtwoord"; delete u[name]; return false; }, "Wachtwoord gereset voor " + name);

          }catch(e){ alert("Reset mislukt: " + e.message); }
          renderList();
        };
        row.appendChild(b);
      }
      list.appendChild(row);
    });
  }
  renderList();
}


// ── Groepen aanpassen (Admin > Groepen): ICT-Systeembeheer en ICT-Management kunnen kijken; alleen een lid van ICT-Systeembeheer kan wijzigen ──
async function showGroupsModal(){
  if(!await ensureAdmin()) return;
  const old = document.getElementById("grp-overlay"); if(old) old.remove();
  const overlay = document.createElement("div");
  overlay.className = "tp-overlay"; overlay.id = "grp-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:870;background:rgba(0,0,0,0.85);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px;";
  const BTN = "border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:inherit;";
  overlay.innerHTML = `<div style="background:#111827;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:20px;width:520px;max-width:98vw;font-family:'Courier New',monospace;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-right:40px;"><div style="font-size:14px;font-weight:700;color:#80cbc4;">👥 Groepen</div></div>
    <div id="grp-hint" style="font-size:10px;color:#777;margin-bottom:12px;line-height:1.5;"></div>
    <div id="grp-list" style="font-size:12px;color:rgba(255,255,255,0.75);">Laden...</div>
    <div id="grp-msg" style="font-size:11px;min-height:16px;margin:12px 0 8px;"></div>
    <div id="grp-actions" style="display:flex;gap:8px;justify-content:flex-end;"></div></div>`;
  document.body.appendChild(overlay);
  const q = s=>overlay.querySelector(s), list = q("#grp-list"), msg = q("#grp-msg"), hint = q("#grp-hint"), actions = q("#grp-actions");
  addWinX(overlay.firstElementChild, ()=>overlay.remove(), "grp-close");
  const setMsg = (t, ok)=>{ msg.textContent = t || ""; msg.style.color = ok ? "#80cbc4" : "#f48fb1"; };
  let cur = null;   // laatst opgehaalde indeling {groups, sha}
  const curGroup = n => GROUP_NAMES.find(g=>cur.groups[g].includes(n)) || "";
  const moves = ()=>[...list.querySelectorAll("select")].map(s=>({ name: s.dataset.name, from: curGroup(s.dataset.name), to: s.value })).filter(m=>m.from !== m.to);
  const result = ms=>{ const g = {}; GROUP_NAMES.forEach(x=>{ g[x] = cur.groups[x].slice(); }); ms.forEach(m=>{ GROUP_NAMES.forEach(x=>{ g[x] = g[x].filter(n=>n!==m.name); }); if(m.to) g[m.to].push(m.name); }); return g; };
  const adminLeft = g => g[GROUP_ADMIN].filter(n=>TEAM.includes(n)).length;
  const check = ()=>{
    const save = q("#grp-save"); if(!save) return;
    const ms = moves(); let bad = "";
    const zonder = [...list.querySelectorAll("select")].filter(s=>!s.value).length;   // iedereen moet in een groep zitten
    if(zonder) bad = "Kies voor iedereen een groep (nog " + zonder + " zonder).";
    else if(ms.length && adminLeft(result(ms)) < 1) bad = GROUP_ADMIN + " moet minstens één lid houden.";
    save.disabled = !ms.length || !!bad; save.style.opacity = save.disabled ? "0.5" : "";
    if(bad) setMsg(bad, false); else if(!msg.dataset.keep) setMsg("");
  };
  const render = ()=>{
    const editable = !!(currentIdentity && cur.groups[GROUP_ADMIN].includes(currentIdentity.user));
    hint.textContent = "Elke persoon zit in precies één groep. Alleen " + ADMIN_VIEW_GROUPS.join(" en ") + " hebben Admin; alleen een lid van " + GROUP_ADMIN + " kan de groepen aanpassen." + (editable ? " Jezelf uit " + GROUP_ADMIN + " halen kan niet (dat kan een collega wel)." : " Jij kunt de groepen niet aanpassen.") + " ICT-Systeembeheer mag backups terugzetten; ICT-Support en ICT-Systeembeheer bepalen de dekking-waarschuwingen; ICT-Monitoring is voor het scherm Monitor." + (cur.sha ? "" : " (Nog niet aangepast: standaardindeling.)");
    list.innerHTML = "";
    const team = TEAM.filter(n=>n!=="__divider__"), logins = EXTRA_LOGINS.filter(n=>!team.includes(n));   // logins (Monitor) staan er altijd; namen van wie niet meer in het team zit worden niet getoond
    team.concat(logins).forEach(name=>{
      const row = document.createElement("div"); row.dataset.name = name;
      row.style.cssText = "display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.06);";
      const mij = !!(currentIdentity && currentIdentity.user === name);
      const lbl = document.createElement("span"); lbl.style.cssText = "flex:1;color:#fff;"; lbl.textContent = name + (logins.includes(name) ? " (geen teamlid)" : "") + (mij ? " (jij)" : "");
      const s = document.createElement("select"); s.dataset.name = name;
      s.style.cssText = "background:#1a1a2e;border:1px solid rgba(255,255,255,0.15);color:#eee;border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12px;min-width:170px;";
      if(!curGroup(name)){ const ph = document.createElement("option"); ph.value = ""; ph.disabled = true; ph.textContent = "— kies een groep —"; s.appendChild(ph); }   // alleen voor wie nu nog in geen groep zit (bijv. een nieuw teamlid); 'geen groep' is geen keuze
      GROUP_NAMES.forEach(g=>{ const o = document.createElement("option"); o.value = g; o.textContent = g; s.appendChild(o); });
      s.value = curGroup(name); s.disabled = !editable;
      if(editable && mij && curGroup(name) === GROUP_ADMIN){ s.disabled = true; s.title = "Jezelf uit " + GROUP_ADMIN + " halen kan niet; vraag een collega."; }   // niet jezelf buitensluiten
      s.onchange = ()=>{ delete msg.dataset.keep; check(); };
      row.append(lbl, s); list.appendChild(row);
    });
    actions.innerHTML = "";
    if(editable){
      const save = document.createElement("button"); save.id = "grp-save"; save.textContent = "Opslaan";
      save.style.cssText = "background:rgba(128,203,196,0.15);border:1px solid rgba(128,203,196,0.4);color:#80cbc4;font-weight:700;" + BTN;
      save.disabled = true; save.style.opacity = "0.5"; save.onclick = doSave; actions.appendChild(save);
    }
    check();
  };
  const reload = async ()=>{   // altijd eerst de nieuwste indeling (en dus de nieuwste rechten) ophalen
    try{
      const c = await groupsFetch();
      applyGroups(c.groups); groupsSha = c.sha; groupsReady = true; groupsError = null; cur = c;
      try{ showLockIndicator(); }catch(e){}
      render(); return true;
    }catch(e){
      list.textContent = ""; hint.textContent = ""; actions.innerHTML = "";
      setMsg("De groepen konden niet worden opgehaald (" + ((e && e.message) || e) + "). Er kan nu niets worden aangepast.", false);
      const retry = document.createElement("button"); retry.id = "grp-retry"; retry.textContent = "Opnieuw proberen";
      retry.style.cssText = "background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#ddd;" + BTN;
      retry.onclick = ()=>{ setMsg(""); list.textContent = "Laden..."; reload(); }; actions.appendChild(retry);
      return false;
    }
  };
  const doSave = async ()=>{
    const ms = moves(); if(!ms.length) return;
    if(!await requireUnlock()) return;   // bewerken moet aan staan (anders vraagt dit eerst om het aan te zetten)
    const save = q("#grp-save"); if(save) save.disabled = true;
    setMsg("Opslaan...", true);
    try{
      const res = await groupsMutate(g=>{
        const me = currentIdentity && currentIdentity.user;
        if(!me || !g[GROUP_ADMIN].includes(me)) return "Alleen een lid van " + GROUP_ADMIN + " kan de groepen aanpassen.";   // gecontroleerd op de nieuwste indeling, niet op wat dit venster al wist
        if(ms.some(m=>!m.to)) return "Kies voor iedereen een groep.";   // 'geen groep' bestaat niet
        ms.forEach(m=>{ GROUP_NAMES.forEach(x=>{ g[x] = g[x].filter(n=>n!==m.name); }); if(m.to) g[m.to].push(m.name); });
        if(!g[GROUP_ADMIN].includes(me)) return "Je kunt jezelf niet uit " + GROUP_ADMIN + " halen. Vraag een collega uit " + GROUP_ADMIN + " om dat te doen.";   // niet jezelf buitensluiten
        if(g[GROUP_ADMIN].filter(n=>TEAM.includes(n)).length < 1) return GROUP_ADMIN + " moet minstens één lid houden.";
        return false;
      }, commitMessage("Groepen aangepast"));
      if(res.error){ msg.dataset.keep = "1"; await reload(); if(!document.body.contains(overlay)) adminNotice(res.error, "👥 Groepen"); else setMsg(res.error, false); return; }   // is je recht intussen vervallen, dan sluit het venster: toon de melding apart
      auditEvent("groepen gewijzigd: " + ms.map(m=>m.name + ": " + (m.from || "geen groep") + " → " + (m.to || "geen groep")).join("; "));
      cur = { groups: res.groups, sha: groupsSha };
      msg.dataset.keep = "1"; render(); setMsg("✓ Opgeslagen", true);
      try{ renderAndSync(); }catch(e){}   // de dekking-waarschuwingen volgen de nieuwe groepen
    }catch(e){ msg.dataset.keep = "1"; setMsg("Opslaan mislukt (" + ((e && e.message) || e) + "). Probeer het opnieuw.", false); if(save) save.disabled = false; }
  };
  reload();
}

// Alleen ingelogd zijn is genoeg (kijken, Admin, je eigen wachtwoord wijzigen)
async function requireLogin(){
  if(currentIdentity) return true;
  return await promptUnlock();   // de toegangspoort: eerst naam + wachtwoord
}

async function loadFromGitHub(usePrefetch=false){
  try{
    // Gebruik prefetch-promise als die nog loopt (eerste load), anders nieuw verzoek
    const r = await (usePrefetch ? _prefetchState : fetch(
      `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
      {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
    ));
    if(!r.ok){ console.warn("GitHub laden HTTP:", r.status); return false; }
    const d = await r.json();
    ghSha = d.sha;
    const text = atob(d.content.replace(/\n/g,""));
    const data = JSON.parse(text);
    if(data && data.store && data.team && data.team.length > 0){
      HEALTH.github = "ok"; HEALTH.data = "ok";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      applyState(data); auditRebase(); return true;
    } else {
      HEALTH.github = "ok"; HEALTH.data = "error";
      updateHealthBar();
      console.warn("GitHub: state leeg of ongeldig, wordt genegeerd");
    }
  }catch(e){
    HEALTH.github = "error";
    updateHealthBar();
    console.warn("GitHub laden mislukt:", e);
  }
  return false;
}

// Helper: encode JSON naar base64 (unicode-safe)
function encodeBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

// Helper: PUT een bestand naar GitHub (maakt aan of overschrijft)
async function ghPut(path, content, message){
  const url = `https://api.github.com/repos/${GH_REPO}/contents/${path}`;
  let sha = undefined;
  try{
    const r = await fetch(url + `?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(r.ok){ const d = await r.json(); sha = d.sha; }
  }catch(e){}
  const body = {message, content, branch: GH_BRANCH, ...(sha ? {sha} : {})};
  return ghWriteFetch(url, {method:"PUT", headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"}, body:JSON.stringify(body)});
}

// Backup elke 10 minuten na een wijziging (maximaal 14 dagen bewaard)
let lastBackupJson = null;   // staat bij de laatste GESLAAGDE backup
let lastBackupTime = 0;      // tijdstip van de laatste geslaagde backup
let backupBusy = false;      // er loopt een backup (die zichzelf herhaalt bij een conflict)
let backupPending = null;    // de laatste poging is mislukt: elke minuut opnieuw proberen tot het lukt
const BACKUP_INTERVAL = 10 * 60 * 1000; // 10 minuten
const BACKUP_RETRY_STATUS = [409, 422, 500, 502, 503, 504];   // conflict of storing: opnieuw; een andere fout (bijv. geen rechten) niet blijven proberen

async function maybeBackup(stateJson, opts = {}){
  // opts.force: de 10-minutenregel overslaan; opts.always: ook als er niets is gewijzigd (handmatig); opts.label/who: commitbericht; opts.attempts: aantal pogingen
  const now = Date.now();
  if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                     // niets gewijzigd sinds de laatste geslaagde backup
  if(!opts.force && !opts.always && now - lastBackupTime < BACKUP_INTERVAL && !backupPending) return null;   // nog geen 10 min (een mislukte backup wacht daar niet op)
  if(backupBusy){
    if(!opts.force && !opts.always){ backupPending = stateJson; return null; }                       // er loopt er al een
    for(let i = 0; i < 150 && backupBusy; i++) await new Promise(r=>setTimeout(r, 200));              // een gevraagde backup wacht op de lopende
    if(backupBusy){ backupPending = stateJson; return null; }
    if(!opts.always && stateJson === lastBackupJson && !backupPending) return null;                   // de lopende backup bevatte al precies deze staat
  }
  backupBusy = true;
  const now_dt = new Date();
  const date = now_dt.toISOString().slice(0,10);
  const time = now_dt.toTimeString().slice(0,5).replace(":","-");
  const filename = `${date}_${time}`;
  const content = encodeBase64(stateJson);
  const message = opts.label ? `${opts.label} ${filename}${opts.who || ""}` : `Auto-backup ${filename}`;
  let res = null;
  try{
    for(let poging = 0; poging < (opts.attempts || 4); poging++){   // GitHub weigert schrijfacties die tegelijk binnenkomen (409): even wachten en nogmaals
      if(poging) await new Promise(r=>setTimeout(r, 1500 * poging + Math.random() * 1000));
      res = await ghPut(`backups/${filename}.json`, content, message).catch(()=>null);
      if(res && res.ok) break;
      if(res && !BACKUP_RETRY_STATUS.includes(res.status)) break;
    }
    if(res && res.ok){
      lastBackupJson = stateJson; lastBackupTime = Date.now(); backupPending = null;
      HEALTH.lastBackup = lastBackupTime; HEALTH.lastBackupOk = true; HEALTH.lastBackupErr = null;
      HEALTH.lastBackupLabel = now_dt.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit"})+" "+
                               now_dt.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
    } else {
      backupPending = stateJson;   // niet als gedaan markeren: de volgende minuut opnieuw
      HEALTH.lastBackupOk = false; HEALTH.lastBackupErr = res ? "HTTP " + res.status : "geen verbinding";
    }
  }finally{ backupBusy = false; }
  updateHealthBar();
  const result = (res && res.ok) ? { ok: true, filename } : { ok: false, err: HEALTH.lastBackupErr };
  if(!result.ok) return result;
  // Verwijder backups ouder dan 14 dagen: op de achtergrond, hooguit 5 per keer (zodat het opslaan niet wordt opgehouden) en netjes achter elkaar
  try{
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 14);
    const cut = cutoff.toISOString().slice(0,10);
    const listR = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/backups?ref=${GH_BRANCH}&t=` + Date.now(), {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}});
    if(listR.ok){
      const files = await listR.json();
      files.filter(f=>f.name.replace(".json","").slice(0,10) < cut).slice(0, 5).forEach(f=>{
        const d = f.name.replace(".json","").slice(0,10); // YYYY-MM-DD prefix
        ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/backups/${f.name}`, {
          method:"DELETE",
          headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
          body: JSON.stringify({message:`Verwijder oude backup ${d}`, sha: f.sha, branch: GH_BRANCH})
        }).catch(()=>{});
      });
    }
  }catch(e){}
  return result;
}
// Wat nog op opslaan wacht eerst wegschrijven (maximaal ~15 s)
async function flushPendingSave(){
  for(let i = 0; i < 60 && (ghSaving || savePending); i++){
    if(savePending && !ghSaving){ clearTimeout(ghSaveTimer); await saveToGitHub(); }
    else await new Promise(r=>setTimeout(r, 250));
  }
}

// Admin > Backup maken: een kopie van de planning zoals die nu op GitHub staat (bewerken hoeft niet aan te staan: een backup wijzigt niets)
async function makeManualBackup(){

  adminNotice("Backup wordt gemaakt …", "💾 Backup maken");

  }catch(e){}
  if(!json) json = lastSavedJson || JSON.stringify(serializeState());   // lukt het ophalen niet: de staat in deze pagina
  const res = await maybeBackup(json, { always: true, force: true, label: "Handmatige backup", who: commitMessage(""), attempts: 3 });

  else adminNotice("✗ Backup mislukt" + (res && res.err ? " (" + res.err + ")" : "") + ". Probeer het zo opnieuw.", "💾 Backup maken");
}

setInterval(retryPendingBackup, 60 * 1000);

async function saveToGitHub(){
  if(ghSaving) return;
  ghSaving = true; savePending = false;
  try{
    // Haal altijd eerst de actuele SHA op om conflicts te voorkomen
    const check = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2), {
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}
    });
    if(check.ok){ const cd = await check.json(); ghSha = cd.sha; }

    const json = JSON.stringify(serializeState());
    const content = encodeBase64(json);

    const body = {message:commitMessage("Update planning"), content, sha: ghSha, branch: GH_BRANCH};
    const r = await ghWriteFetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      method:"PUT",
      headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Content-Type":"application/json","Accept":"application/vnd.github.v3+json"},
      body: JSON.stringify(body)
    });
    if(r.ok){
      const d = await r.json();
      ghSha = d.content.sha;
      HEALTH.github = "ok"; HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = true;
      updateHealthBar();
      showSaveStatus("ok");
      // Prefetch SHA alvast voor volgende save (tijdens rustige periode)
      setTimeout(async ()=>{
        if(!ghSaving){
          try{
            const pre = await fetch(
              `https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=`+Date.now()+`&r=`+Math.random().toString(36).slice(2),
              {headers:{"Authorization":`Bearer ${GH_TOKEN}`,"Accept":"application/vnd.github.v3+json"}}
            );
            if(pre.ok){ const pd = await pre.json(); ghSha = pd.sha; }
          }catch(e){}
        }
      }, 2000);
      // Backup (silent, na succesvolle save)
      lastSavedJson = json; saveOkCount++;
      maybeBackup(json);
      auditAfterSave(JSON.parse(json));   // audit: wat is er veranderd, door wie
    } else {
      const err = await r.json().catch(()=>({}));
      const msg = err.message || err.errors?.[0]?.message || r.status;
      console.error("GitHub opslaan mislukt:", r.status, msg);
      HEALTH.github = r.status === 401 || r.status === 403 ? "error" : "warn";
      HEALTH.lastSync = Date.now(); HEALTH.lastSyncOk = false;
      updateHealthBar();
      // Bij 409 conflict: SHA ophalen en opnieuw proberen
      if(r.status === 409){
        console.warn("SHA conflict, opnieuw proberen...");
        ghSha = null; savePending = true;
        ghSaveTimer = setTimeout(saveToGitHub, 2000);
      } else {
        showSaveStatus("error: "+msg);
      }
    }
  }catch(e){
    console.warn("GitHub opslaan fout:", e);
    showSaveStatus("error");
  } finally {
    ghSaving = false;
  }
}

function showSaveStatus(state){
  const ind=document.getElementById("save-ind"); if(!ind) return;
  if(state==="ok"){
    ind.textContent="✓ opgeslagen"; ind.style.color="#80cbc4";
    ind.style.opacity="1";
    clearTimeout(ind._t);
    ind._t=setTimeout(()=>{ ind.style.opacity="0"; },3000);
    // Verberg foutbanner als die nog zichtbaar is
    hideSyncErrorBanner();
  } else if(state==="error"||state.startsWith("error:")){
    const msg = state.startsWith("error:") ? state.slice(6).trim() : "";
    ind.textContent="✗ mislukt"; ind.style.color="#f48fb1";
    ind.style.opacity="1";
    clearTimeout(ind._t);
    // Toon prominente foutbanner
    showSyncErrorBanner(msg);
  } else {
    ind.textContent="⟳ "+state; ind.style.color="#ffb74d";
    ind.style.opacity="1";
    clearTimeout(ind._t);
  }
}

const HEALTH = { github: "unknown", data: "unknown", lastSync: null, lastSyncOk: false, lastBackup: null, lastBackupOk: false, lastBackupLabel: null, lastBackupErr: null };

function updateHealthBar(){
